id: '1779284563722'
alias: 'Office: Litra Status Refresh on HA Start'
description: Forces sensor.litra_glow_status to poll the device immediately when HA
  starts up, so the template light reflects accurate state before the next scheduled
  scan_interval.
triggers:
- alias: HA finished starting
  event: start
  trigger: homeassistant
conditions: []
actions:
- alias: Refresh Litra status sensor
  action: homeassistant.update_entity
  target:
    entity_id: sensor.litra_glow_status
mode: single
category: 01KS3AHTTAQVWP6HWNE9CJ207W
