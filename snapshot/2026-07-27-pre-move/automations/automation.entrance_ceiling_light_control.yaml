id: '1694824176111'
alias: 'Entrance: Ceiling Light Control'
description: Manages the entrance ceiling light based on closet door activity, arrivals,
  and time of day. Closet door open lights at full brightness; closed reverts to ambient
  (off during day, 15% after sunset, off when sleeping). Arrivals and sunset transitions
  set ambient lighting when occupied. Turns off 30 minutes after sunrise when the
  closet is closed.
triggers:
- alias: Closet doors opened
  entity_id:
  - binary_sensor.entrance_closet_doors
  from: 'off'
  to: 'on'
  id: opened
  trigger: state
- alias: Closet doors closed
  entity_id:
  - binary_sensor.entrance_closet_doors
  from: 'on'
  to: 'off'
  id: closed
  trigger: state
- alias: Someone arrives home
  entity_id:
  - sensor.household_people_home
  from: '0'
  id: someone_home
  trigger: state
- alias: 30 minutes before sunset
  event: sunset
  offset: -00:30:00
  id: ambient_on
  trigger: sun
- alias: 30 minutes after sunrise
  event: sunrise
  offset: 00:30:00
  id: ambient_off
  trigger: sun
conditions: []
actions:
- alias: Route by trigger
  choose:
  - alias: Closet doors opened — full brightness
    conditions:
    - alias: Triggered by closet opened
      condition: trigger
      id: opened
    sequence:
    - alias: Turn on ceiling at 95%
      action: light.turn_on
      data:
        brightness_pct: 95
      target:
        entity_id: light.entrance_ceiling
  - alias: Closet doors closed — evaluate ambient state
    conditions:
    - alias: Triggered by closet closed
      condition: trigger
      id: closed
    sequence:
    - alias: Evaluate time and sleep state
      choose:
      - alias: Daytime — turn off
        conditions:
        - alias: Daytime
          condition: sun
          after: sunrise
          before: sunset
          before_offset: -00:30:00
        sequence:
        - alias: Fade off
          action: light.turn_off
          data:
            transition: 2
          target:
            entity_id: light.entrance_ceiling
      - alias: After sunset, not sleeping — dim ambient
        conditions:
        - alias: After sunset
          condition: sun
          after: sunset
          before: sunrise
          after_offset: -00:30:00
        - alias: Everyone awake
          condition: state
          entity_id: input_boolean.everyone_sleeping
          state: 'off'
        sequence:
        - alias: Set ceiling to 15%
          action: light.turn_on
          data:
            brightness_pct: 15
          target:
            entity_id: light.entrance_ceiling
      - alias: Everyone sleeping — turn off slowly
        conditions:
        - alias: Everyone sleeping
          condition: state
          entity_id: input_boolean.everyone_sleeping
          state: 'on'
        sequence:
        - alias: Fade off
          action: light.turn_off
          data:
            transition: 5
          target:
            entity_id: light.entrance_ceiling
  - alias: Arrival or sunset — set ambient if home, awake, closet closed, not movie
      mode
    conditions:
    - alias: Arrival or sunset trigger
      condition: trigger
      id:
      - someone_home
      - ambient_on
    - alias: After sunset
      condition: sun
      after: sunset
      before: sunrise
      after_offset: -00:30:00
    - alias: Someone home
      condition: numeric_state
      entity_id: sensor.household_people_home
      above: 0
    - alias: Everyone awake
      condition: state
      entity_id: input_boolean.everyone_sleeping
      state: 'off'
    - alias: Movie mode off
      condition: state
      entity_id: input_boolean.movie_mode
      state: 'off'
    - alias: Closet door closed
      condition: state
      entity_id: binary_sensor.entrance_closet_doors
      state: 'off'
    sequence:
    - alias: Set ceiling to 15%
      action: light.turn_on
      data:
        brightness_pct: 15
      target:
        entity_id: light.entrance_ceiling
  - alias: Sunrise — turn off ambient
    conditions:
    - alias: Triggered by sunrise
      condition: trigger
      id: ambient_off
    - alias: Closet door closed
      condition: state
      entity_id: binary_sensor.entrance_closet_doors
      state: 'off'
    sequence:
    - alias: Turn off entrance ceiling
      action: light.turn_off
      target:
        entity_id: light.entrance_ceiling
mode: single
category: 01KQA4YGXGDK2DH076K5A7H8YH
