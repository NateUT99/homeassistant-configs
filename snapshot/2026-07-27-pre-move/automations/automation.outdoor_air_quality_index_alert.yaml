id: '1780422102445'
alias: Outdoor Air Quality Index Alert
description: Notifies when outdoor AQI exceeds 125 with someone home. When awake with
  a door or window open, announces on the kitchen HomePod; for person_arrives, waits
  for the interior garage door to close first. When sleeping, sends a push notification.
  Wake-up TTS is handled by automation.household_morning_report.
triggers:
- entity_id: binary_sensor.outdoor_air_quality_index_high
  to: 'on'
  alias: AQI rises above threshold
  id: aqi_spike
  trigger: state
- entity_id: sensor.household_people_home
  above: 0
  alias: First person arrives home
  id: person_arrives
  trigger: numeric_state
conditions:
- condition: numeric_state
  entity_id: sensor.household_people_home
  above: 0
  alias: Someone is home
actions:
- alias: Build AQI urgency variable
  variables:
    v_aqi_urgency: '{% if states(''sensor.toledo_ohio_usa_air_quality_index'') | int
      > 150 %}Please keep the exterior doors and windows closed.{% else %}Consider
      keeping the exterior doors and windows closed.{% endif %}'
- alias: Branch on sleeping state and trigger
  choose:
  - conditions:
    - condition: state
      entity_id: binary_sensor.outdoor_air_quality_index_high
      state: 'on'
      alias: AQI above threshold
    - condition: state
      entity_id: input_boolean.everyone_sleeping
      state: 'on'
      alias: Everyone sleeping
    sequence:
    - alias: Send push notification
      action: notify.mobile_app_nates_iphone
      data:
        title: Close Doors & Windows — Poor Air Quality
        message: Outdoor AQI is {{ states('sensor.toledo_ohio_usa_air_quality_index')
          }}. {{ v_aqi_urgency }}
        data:
          tag: air_quality_index_alert
    alias: Everyone sleeping — push notification
  - conditions:
    - condition: state
      entity_id: binary_sensor.outdoor_air_quality_index_high
      state: 'on'
      alias: AQI above threshold
    - condition: trigger
      id: person_arrives
      alias: Person arrives trigger
    - condition: state
      entity_id: binary_sensor.exterior_door_window_open
      state: 'on'
      alias: Exterior door or window is open
    sequence:
    - alias: Wait for interior garage door to close
      wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.garage_interior_door_contact
        from: 'on'
        to: 'off'
      timeout:
        minutes: 5
      continue_on_timeout: true
    - alias: Buffer after entry
      delay:
        seconds: 15
    - alias: TTS to kitchen HomePod
      action: script.household_tts_announce
      data:
        message: Heads up — outdoor air quality index is {{ states('sensor.toledo_ohio_usa_air_quality_index')
          }}. {{ v_aqi_urgency }}
        target: kitchen
        notification_title: Poor Air Quality
    alias: Person arrives with door open — kitchen TTS after garage entry
  - conditions:
    - condition: state
      entity_id: binary_sensor.outdoor_air_quality_index_high
      state: 'on'
      alias: AQI above threshold
    - condition: trigger
      id: aqi_spike
      alias: AQI rises above threshold trigger
    - condition: state
      entity_id: binary_sensor.exterior_door_window_open
      state: 'on'
      alias: Exterior door or window is open
    sequence:
    - alias: TTS to kitchen HomePod
      action: script.household_tts_announce
      data:
        message: Heads up — outdoor air quality index is {{ states('sensor.toledo_ohio_usa_air_quality_index')
          }}. {{ v_aqi_urgency }}
        target: kitchen
        notification_title: Poor Air Quality
    alias: AQI spikes with door open — kitchen TTS
mode: single
category: 01KRKH5XD6FDD72M36FQHAXF6R
