id: '1779241736770'
alias: 'Outside: Patio Light Button'
description: 'Controls the patio light from the Zigbee button.


  **Single tap:**

  - Off → on at 90%

  - On below 90% → brighten to 90%

  - On at 90%, sunset −30m to sunrise +30m → dim to 65%

  - On at 90%, outside that window → turn off


  **Hold:** Always turn off.'
triggers:
- alias: Patio button single tap
  domain: mqtt
  device_id: 4e36baa5b5729286af9f2a4e408ac114
  type: action
  subtype: single
  id: single
  trigger: device
- alias: Patio button hold
  domain: mqtt
  device_id: 4e36baa5b5729286af9f2a4e408ac114
  type: action
  subtype: hold
  id: hold
  trigger: device
conditions: []
actions:
- alias: Route by button action
  choose:
  - alias: Hold — turn off
    conditions:
    - alias: Hold trigger
      condition: trigger
      id: hold
    sequence:
    - alias: Turn off patio light
      action: light.turn_off
      target:
        entity_id: light.outside_patio_bulb
  - alias: Single tap — route by light state
    conditions:
    - alias: Single tap trigger
      condition: trigger
      id: single
    sequence:
    - alias: Evaluate current light state and time
      choose:
      - alias: Light off — turn on at 90%
        conditions:
        - alias: Light is off
          condition: state
          entity_id: light.outside_patio_bulb
          state: 'off'
        sequence:
        - alias: Turn on at 90%
          action: light.turn_on
          target:
            entity_id: light.outside_patio_bulb
          data:
            brightness_pct: 90
      - alias: Light on below 90% — brighten to 90%
        conditions:
        - alias: Light is on
          condition: state
          entity_id: light.outside_patio_bulb
          state: 'on'
        - alias: Brightness below 90%
          condition: numeric_state
          entity_id: light.outside_patio_bulb
          attribute: brightness
          below: 228
        sequence:
        - alias: Brighten to 90%
          action: light.turn_on
          target:
            entity_id: light.outside_patio_bulb
          data:
            brightness_pct: 90
      - alias: Light on at 90%, night window — dim to 65%
        conditions:
        - alias: Night window — sunset minus 30 to sunrise plus 30
          condition: sun
          after: sunset
          after_offset: -00:30:00
          before: sunrise
          before_offset: 00:30:00
        sequence:
        - alias: Dim to 65%
          action: light.turn_on
          target:
            entity_id: light.outside_patio_bulb
          data:
            brightness_pct: 65
      default:
      - alias: Light on at 90%, outside night window — turn off
        action: light.turn_off
        target:
          entity_id: light.outside_patio_bulb
mode: restart
category: 01KQA4YGXGDK2DH076K5A7H8YH
