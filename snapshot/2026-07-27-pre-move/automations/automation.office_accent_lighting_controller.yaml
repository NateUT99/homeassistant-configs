id: '1778376138155'
alias: 'Office: Accent Lighting Controller'
description: 'Sole owner of office accent lighting during dim conditions. Maintains
  the invariant: accents are ON only when (someone is home) AND (not everyone sleeping)
  AND (room is dim per sensor.office_presence_sensor_illuminance).


  Triggers on any input that affects this invariant and re-evaluates the whole condition
  every time, so it converges to the correct state regardless of which input changed.


  Room brightness uses dual thresholds for hysteresis: the dim trigger fires when
  the 10-minute illuminance average drops below 30 lux; the lit trigger fires when
  the average rises above 40 lux. The 10-lux deadband (30–40) prevents flapping near
  the crossover. The ON condition uses the same 30-lux threshold as the dim trigger.


  Everyone-leaving and everyone-sleeping are handled by separate automations. This
  controller triggers only on: illuminance crossings; someone arriving at an empty
  home; and everyone_sleeping clearing at morning wakeup (so accents can turn on when
  the house wakes with the room still dark).


  When turning on, the Hue background zone is activated via the Motown scene (record
  + pinball cabinets), and the other lights are set to inline values:

  - turntable cabinet: 85% magenta

  - floor accents: 65% purple

  - movie poster: on (switch_as_x light, on/off only)

  - coke machine: on (switch)'
triggers:
- alias: At least one person arrives at empty home
  entity_id: sensor.household_people_home
  from: '0'
  id: someone_home
  trigger: state
- alias: Office becomes dim
  entity_id:
  - sensor.office_illuminance_average
  below: 30
  id: room_dim
  trigger: numeric_state
- alias: Office becomes lit
  entity_id:
  - sensor.office_illuminance_average
  above: 40
  id: room_lit
  trigger: numeric_state
- alias: Everyone sleeping cleared (morning wakeup)
  entity_id: input_boolean.everyone_sleeping
  from: 'on'
  to: 'off'
  id: morning_wakeup
  trigger: state
- alias: Accent scene selection changed
  trigger: state
  entity_id: input_select.office_accent_scene
  id: scene_changed
- alias: 30 minutes before sunset
  event: sunset
  offset: -00:30:00
  id: pre_sunset
  trigger: sun
conditions:
- alias: Someone is home
  condition: numeric_state
  entity_id: sensor.household_people_home
  above: 0
- alias: No one is sleeping
  condition: state
  entity_id: input_boolean.everyone_sleeping
  state: 'off'
actions:
- choose:
  - alias: Accents should be ON (room dim, movie mode off)
    conditions:
    - alias: Room is dim
      condition: numeric_state
      entity_id: sensor.office_illuminance_average
      below: 30
    - alias: Movie mode is off
      condition: state
      entity_id: input_boolean.movie_mode
      state: 'off'
    sequence:
    - alias: Activate selected scene and set turntable cabinet
      choose:
      - alias: Motown
        conditions:
        - condition: state
          entity_id: input_select.office_accent_scene
          state: Motown
        sequence:
        - alias: Activate Motown scene
          action: scene.turn_on
          target:
            entity_id: scene.office_background_lights_motown
        - alias: Turntable cabinet - Motown (color TBD)
          action: light.turn_on
          target:
            entity_id: light.office_turntable_cabinet
          data:
            brightness_pct: 85
            rgb_color:
            - 255
            - 0
            - 255
      - alias: Chinatown
        conditions:
        - condition: state
          entity_id: input_select.office_accent_scene
          state: Chinatown
        sequence:
        - alias: Activate Chinatown scene
          action: scene.turn_on
          target:
            entity_id: scene.office_background_lights_chinatown
        - alias: Turntable cabinet - Chinatown (color TBD)
          action: light.turn_on
          target:
            entity_id: light.office_turntable_cabinet
          data:
            brightness_pct: 85
            rgb_color:
            - 255
            - 0
            - 255
      - alias: HAL
        conditions:
        - condition: state
          entity_id: input_select.office_accent_scene
          state: HAL
        sequence:
        - alias: Activate HAL scene
          action: scene.turn_on
          target:
            entity_id: scene.office_background_lights_hal
        - alias: Turntable cabinet - HAL (color TBD)
          action: light.turn_on
          target:
            entity_id: light.office_turntable_cabinet
          data:
            brightness_pct: 85
            rgb_color:
            - 255
            - 0
            - 255
      - alias: Sundown
        conditions:
        - condition: state
          entity_id: input_select.office_accent_scene
          state: Sundown
        sequence:
        - alias: Activate Sundown scene
          action: scene.turn_on
          target:
            entity_id: scene.office_background_lights_sundown
        - alias: Turntable cabinet - Sundown (color TBD)
          action: light.turn_on
          target:
            entity_id: light.office_turntable_cabinet
          data:
            brightness_pct: 85
            rgb_color:
            - 255
            - 0
            - 255
      - alias: Fire
        conditions:
        - condition: state
          entity_id: input_select.office_accent_scene
          state: Fire
        sequence:
        - alias: Activate Fire scene
          action: scene.turn_on
          target:
            entity_id: scene.office_background_lights_fire
        - alias: Turntable cabinet - Fire (color TBD)
          action: light.turn_on
          target:
            entity_id: light.office_turntable_cabinet
          data:
            brightness_pct: 85
            rgb_color:
            - 255
            - 0
            - 255
    - alias: Set floor accents to 65% purple
      action: light.turn_on
      target:
        entity_id: light.office_floor_accents
      data:
        brightness_pct: 65
        rgb_color:
        - 128
        - 0
        - 128
    - alias: Turn on movie poster
      action: light.turn_on
      target:
        entity_id:
        - light.office_movie_poster
      data: {}
    - alias: Turn on coke machine
      action: switch.turn_on
      target:
        entity_id: switch.office_coke_machine
  default:
  - alias: Turn off all office accent lights and coke machine
    parallel:
    - alias: Turn off accent lights
      action: light.turn_off
      target:
        entity_id:
        - light.office_background_lights
        - light.office_turntable_cabinet
        - light.office_floor_accents
        - light.office_movie_poster
        - light.office_dragons_lair_accent
    - alias: Turn off coke machine
      action: switch.turn_off
      target:
        entity_id: switch.office_coke_machine
mode: restart
category: 01KQA4YGXGDK2DH076K5A7H8YH
