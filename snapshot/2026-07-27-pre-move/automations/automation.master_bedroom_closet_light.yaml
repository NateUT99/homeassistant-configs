id: '1694822743278'
alias: 'Master Bedroom: Closet Light'
description: Controls light.master_closet_ceiling based on the closet door contact
  sensor. Opening the door turns the light on — at 95% if everyone is awake, 65% if
  everyone is sleeping. Closing the door turns it off. Closing while inside will also
  turn the light off; occupancy detection is not yet in place.
triggers:
- entity_id:
  - binary_sensor.master_closet_door_contact
  from: 'off'
  to: 'on'
  id: open
  alias: Closet door opened
  trigger: state
- entity_id:
  - binary_sensor.master_closet_door_contact
  from: 'on'
  to: 'off'
  id: closed
  alias: Closet door closed
  trigger: state
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - open
      alias: Triggered by door opening
    sequence:
    - if:
      - condition: state
        entity_id: input_boolean.everyone_sleeping
        state: 'on'
        alias: Everyone is sleeping
      then:
      - action: light.turn_on
        target:
          entity_id:
          - light.master_closet_ceiling
        data:
          brightness_pct: 65
        alias: Turn on closet light at 65%
      else:
      - action: light.turn_on
        target:
          entity_id:
          - light.master_closet_ceiling
        data:
          brightness_pct: 95
        alias: Turn on closet light at 95%
      alias: Set brightness based on sleep state
    alias: Door opened — turn on light
  - conditions:
    - condition: trigger
      id:
      - closed
      alias: Triggered by door closing
    sequence:
    - action: light.turn_off
      target:
        entity_id:
        - light.master_closet_ceiling
      alias: Turn off closet ceiling light
    alias: Door closed — turn off light
mode: single
category: 01KQA4YGXGDK2DH076K5A7H8YH
