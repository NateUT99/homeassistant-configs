id: '1758548101400'
alias: 'Household: HomeKit Presence Sync'
description: Syncs HomeKit presence input_booleans to MQTT device tracker topics so
  person entities reflect HomeKit's faster geofence detection. Fires when any household
  member's presence boolean changes. Publishes home/not_home to presence/<name> with
  retain=true so tracker state survives HA restarts.
triggers:
- alias: Someone arrived home
  entity_id:
  - input_boolean.nate_home
  from: 'off'
  to: 'on'
  id: arrived
  trigger: state
- alias: Someone left home
  entity_id:
  - input_boolean.nate_home
  from: 'on'
  to: 'off'
  id: departed
  trigger: state
conditions: []
actions:
- alias: Publish presence state to MQTT tracker topic
  choose:
  - alias: Publish home state
    conditions:
    - alias: Triggered by arrival
      condition: trigger
      id: arrived
    sequence:
    - alias: Publish home to MQTT tracker topic
      action: mqtt.publish
      data:
        topic: presence/homekit_{{ person_name }}
        payload: home
        retain: true
        qos: 1
  - alias: Publish not_home state
    conditions:
    - alias: Triggered by departure
      condition: trigger
      id: departed
    sequence:
    - alias: Publish not_home to MQTT tracker topic
      action: mqtt.publish
      data:
        topic: presence/homekit_{{ person_name }}
        payload: not_home
        retain: true
        qos: 1
mode: queued
max: 4
variables:
  person_name: '{{ trigger.to_state.object_id | replace(''_home'', '''') }}'
category: 01KS3AHT8PTYGYCRABF23BFTXH
