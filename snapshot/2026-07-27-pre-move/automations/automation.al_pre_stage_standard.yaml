id: '1779071444854'
alias: 'Adaptive Lighting: Pre-Stage'
description: 'Keeps all pre-stage-compatible bulbs loaded with current Adaptive Lighting
  values whenever they are off. With execute_if_off enabled on the bulbs (set via
  direct MQTT publish), Z2M stores the values without turning the bulb on — so the
  next turn-on, from any source, lands at the correct adapted state instead of the
  last-on values.

  Solves the "flash to previous brightness/color before AL catches up" problem for
  turn-on paths that bypass HA''s light.turn_on service: Zigbee bindings, physical
  power cycles, and any other on-event AL''s intercept doesn''t see.

  Runs on a 10-minute schedule. Standard fixtures receive full payloads (brightness
  + color temp). Color Only fixtures receive color-only payloads — brightness intentionally
  omitted so the bulb retains its user-set value.

  Per-fixture blocks run in series with a 0.5-second stagger to spread the MQTT publish
  burst. Within each fixture, per-bulb publishes run in parallel. Only publishes to
  bulbs that are currently off.'
triggers:
- minutes: /10
  alias: Every 10 minutes
  trigger: time_pattern
actions:
- alias: Pre-stage Office Ceiling bulbs in parallel (brightness & color)
  parallel:
  - alias: Office Ceiling Bulb 1 — pre-stage if currently off
    if:
    - alias: Bulb 1 is off
      condition: state
      entity_id: light.office_ceiling_bulb_1
      state: 'off'
    then:
    - alias: Publish current AL curve values to Office Ceiling Bulb 1
      action: mqtt.publish
      data:
        topic: zigbee2mqtt/Office Ceiling Bulb 1/set
        payload: "{\n  \"state\": null,\n  \"brightness\": {{ brightness }},\n  \"\
          color_temp\": {{ color_temp }}\n}"
  - alias: Office Ceiling Bulb 2 — pre-stage if currently off
    if:
    - alias: Bulb 2 is off
      condition: state
      entity_id: light.office_ceiling_bulb_2
      state: 'off'
    then:
    - alias: Publish current AL curve values to Office Ceiling Bulb 2
      action: mqtt.publish
      data:
        topic: zigbee2mqtt/Office Ceiling Bulb 2/set
        payload: "{\n  \"state\": null,\n  \"brightness\": {{ brightness }},\n  \"\
          color_temp\": {{ color_temp }}\n}"
- alias: Stagger before next fixture
  delay:
    milliseconds: 500
