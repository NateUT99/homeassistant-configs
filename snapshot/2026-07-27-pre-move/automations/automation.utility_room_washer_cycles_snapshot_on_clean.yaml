id: '1781047587356'
alias: 'Utility Room: Washer Cycles Snapshot on Clean'
description: Captures the washer lifetime cycle count at the moment a cleaning is
  recorded. Used to compute cycles-since-cleaned in the laundry pop-up.
triggers:
- alias: Washer cleaning recorded
  entity_id: input_datetime.washer_cleaned
  id: cleaning_recorded
  trigger: state
actions:
- alias: Snapshot current cycle count
  action: input_number.set_value
  target:
    entity_id: input_number.utility_room_washer_cycles_at_last_cleaning
  data:
    value: '{{ states(''sensor.washer_cycles'') | int(0) }}'
mode: single
category: 01KS3AHTTAQVWP6HWNE9CJ207W
