id: "1787579771436"
alias: "Living Room: Turntable Platter Light"
description: Turns the turntable platter light on when the dust cover is opened, off
  when closed. A 5-second delay on the close trigger prevents the light from cutting
  out during brief cover movements.
triggers:
  - alias: Dust cover opened
    trigger: state
    entity_id:
      - binary_sensor.living_room_turntable_cover_opening
    from:
      - "off"
    to:
      - "on"
    id: open
  - alias: Dust cover closed for 5 seconds
    trigger: state
    entity_id:
      - binary_sensor.living_room_turntable_cover_opening
    from:
      - "on"
    to:
      - "off"
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: closed
conditions: []
actions:
  - choose:
      - alias: Cover opened — turn on platter light
        conditions:
          - condition: trigger
            id:
              - open
        sequence:
          - alias: Turn on turntable platter light
            action: light.turn_on
            target:
              entity_id:
                - light.living_room_turntable_platter
      - alias: Cover closed — turn off platter light
        conditions:
          - condition: trigger
            id:
              - closed
        sequence:
          - alias: Turn off turntable platter light
            action: light.turn_off
            target:
              entity_id:
                - light.living_room_turntable_platter
mode: single
