id: '1787054517875'
alias: 'Master Bedroom: Night Lamp'
description: >-
  Controls the master bedroom night lamp based on ambient light, household
  sleep state, and arrivals. Turns on when the room gets dark, when everyone
  goes to sleep (as a fallback in case it's off), or when the first person
  arrives home to a dark room. Turns off when the room gets bright.
triggers:
  - alias: Master bedroom illuminance drops below threshold
    entity_id: sensor.master_bedroom_night_lamp_illuminance
    below: 5
    id: dark
    trigger: numeric_state
  - alias: Master bedroom illuminance rises above threshold
    entity_id: sensor.master_bedroom_night_lamp_illuminance
    above: 5
    for:
      seconds: 15
    id: bright
    trigger: numeric_state
  - alias: First person arrives home
    entity_id: zone.home
    from: '0'
    id: home
    trigger: state
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Master bedroom got dark — turn lamp on
        conditions:
          - alias: Dark trigger
            condition: trigger
            id: dark
        sequence:
          - alias: Turn on night lamp at 65%
            action: light.turn_on
            target:
              entity_id: light.master_bedroom_night_lamp
            data:
              brightness_pct: 65
              color_temp_kelvin: 2350
      - alias: Master bedroom got bright — turn lamp off
        conditions:
          - alias: Bright trigger
            condition: trigger
            id: bright
        sequence:
          - alias: Turn off night lamp
            action: light.turn_off
            target:
              entity_id: light.master_bedroom_night_lamp
      - alias: First person home and master bedroom is dark — turn lamp on
        conditions:
          - alias: Home trigger
            condition: trigger
            id: home
          - alias: Master bedroom is dark
            condition: numeric_state
            entity_id: sensor.master_bedroom_night_lamp_illuminance
            below: 5
        sequence:
          - alias: Turn on night lamp at 65%
            action: light.turn_on
            target:
              entity_id: light.master_bedroom_night_lamp
            data:
              brightness_pct: 65
              color_temp_kelvin: 2350
mode: single
category: 01M08MMBZ719V4GZ2FT10RPTJ2
