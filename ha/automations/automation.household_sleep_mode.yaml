id: "1787696240763"
alias: "Household: Sleep Mode"
description: >-
  Prepares the home when everyone goes to sleep and restores it when
  everyone wakes. Sleep: sets the living room thermostat to Sleep preset,
  turns on the bathroom ambient lamp, master bedroom nightstand lamp, and
  kitchen sink light (dim nav light), turns off lights labeled "Sleeping",
  puts the Standard Adaptive Lighting instance into sleep mode (its
  sleep_brightness owns the master bedroom and office ceiling fan lights
  now), turns on the master bedroom Apple TV, closes the garage door, and
  locks the front door -- these actions are independent of each other and
  run in parallel so the bedroom is ready without waiting on the
  garage/lock actuation time. Wake: sets the thermostat back to Home
  preset, clears Adaptive Lighting sleep mode, and turns off the kitchen
  sink light. Merged from the previously separate Configure
  Home for Sleep / Configure Home for Wake automations, matching the
  pattern already used by Avery's Room: Sleep Mode.
triggers:
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_on
    alias: Everyone goes to sleep
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - choose:
      - alias: Everyone Sleeping turned ON -- prepare the home for night
        conditions:
          - condition: trigger
            id: sleep_on
        sequence:
          - alias: Run night-prep actions in parallel
            note: >-
              Nine independent actions (thermostat, 3 lights, label
              turn-off, AL sleep mode, garage, lock, media player)
              with no ordering dependency -- parallel avoids serializing
              the garage/lock actuation time ahead of the bedroom actions.
              Small, fixed action count; no meaningful HA Green load.
            parallel:
              - alias: Set living room thermostat to Sleep preset
                action: climate.set_preset_mode
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  preset_mode: sleep
              - alias: Turn on bathroom ambient lamp
                action: light.turn_on
                target:
                  entity_id: light.bathroom_ambient_lamp
                data:
                  color_temp_kelvin: 2350
                  brightness_pct: 65
              - alias: Turn off lights labeled "Sleeping"
                action: light.turn_off
                target:
                  label_id: sleeping
                data: {}
              - alias: Put the Standard Adaptive Lighting instance into sleep mode
                note: >-
                  Replaces the old dim-to-25% leg. AL's sleep_brightness
                  now owns the master bedroom and office ceiling fan
                  lights, and AL only commands lights that are already on
                  -- so the old "only if on and above 25%" guard is
                  preserved implicitly. The pre-stage automation writes the
                  sleep level into each fixture's OnLevel off this same
                  switch flip, so a middle-of-the-night wall tap comes on
                  dim.
                action: switch.turn_on
                target:
                  entity_id: switch.adaptive_lighting_standard_sleep_mode
              - alias: Ensure garage door is closed
                action: cover.close_cover
                target:
                  entity_id: cover.garage_door_opener_door
                data: {}
              - alias: Ensure front door is locked
                action: lock.lock
                target:
                  entity_id: lock.entrance_front_door
                data: {}
              - alias: Turn on master bedroom Apple TV
                action: media_player.turn_on
                target:
                  entity_id: media_player.master_bedroom_appletv
              - alias: Turn on master bedroom nightstand lamp
                action: light.turn_on
                target:
                  entity_id: light.master_bedroom_left_nightstand_lamp
                data:
                  brightness_pct: 50
                  color_temp_kelvin: 2000
              - alias: Turn on kitchen sink light as dim nav light
                action: light.turn_on
                target:
                  entity_id: light.kitchen_overhead_sink
                data:
                  color_temp_kelvin: 2000
                  brightness_pct: 10
      - alias: Everyone Sleeping turned OFF -- restore the home for day
        conditions:
          - condition: trigger
            id: sleep_off
        sequence:
          - alias: Run wake-restore actions in parallel
            note: >-
              Three independent actions (thermostat, kitchen nav light, AL
              sleep mode) with no ordering dependency.
            parallel:
              - alias: Set living room thermostat to Home preset
                action: climate.set_preset_mode
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  preset_mode: home
              - alias: Turn off kitchen sink nav light
                action: light.turn_off
                target:
                  entity_id: light.kitchen_overhead_sink
              - alias: Clear Adaptive Lighting sleep mode on the Standard instance
                action: switch.turn_off
                target:
                  entity_id: switch.adaptive_lighting_standard_sleep_mode
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
