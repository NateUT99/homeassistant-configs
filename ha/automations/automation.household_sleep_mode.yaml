id: "1787696240763"
alias: "Household: Sleep Mode"
description: >-
  Prepares the home when everyone goes to sleep and restores it when
  everyone wakes. Sleep: puts the Standard Adaptive Lighting instance
  into sleep mode first (its sleep_brightness owns the master bedroom
  and office ceiling fan lights for any later turn-on), then in
  parallel sets the living room thermostat to Sleep preset, turns on
  the bathroom ambient lamp, master bedroom nightstand lamp, and
  kitchen sink light (dim nav light), turns on the master bedroom
  Apple TV, closes the garage door, and locks the front door, and
  finally turns off every light labeled "Sleeping" (including the
  office ceiling fan light, which stays AL-enrolled for a later
  wall-tap to land dim, but must end up fully off now) -- last, so it
  always wins over AL's own reaction to the sleep-mode flip instead of
  racing it. Wake: sets the thermostat back to Home preset, clears
  Adaptive Lighting sleep mode, and turns off the kitchen sink light.
  Merged from the previously separate Configure Home for Sleep /
  Configure Home for Wake automations, matching the pattern already
  used by Avery's Room: Sleep Mode.
triggers:
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_on
    alias: Everyone goes to sleep
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - choose:
      - alias: Everyone Sleeping turned ON -- prepare the home for night
        conditions:
          - condition: trigger
            id: sleep_on
        sequence:
          - alias: Put the Standard Adaptive Lighting instance into sleep mode
            note: >-
              Runs first, on its own, so it is unambiguously dispatched
              before the "Sleeping"-label turn-off at the end of this
              sequence. AL reacts to this flip by pushing sleep_brightness
              to every currently-on light in the instance -- including the
              office ceiling fan light, which is also labeled "Sleeping"
              and needs to end up OFF, not dimmed. Confirmed via
              trace/logbook that having the label turn-off race this flip
              in the same parallel block loses reliably (no off-transition
              recorded at all). AL still owns the sleep level for any
              later turn-on via pre-staging.
            action: switch.turn_on
            target:
              entity_id: switch.adaptive_lighting_standard_sleep_mode
          - alias: Run independent night-prep actions in parallel
            note: >-
              Seven independent actions (thermostat, 3 lights, garage,
              lock, media player) with no ordering dependency -- parallel
              avoids serializing the garage/lock actuation time ahead of
              the bedroom actions. The "Sleeping"-label turn-off is
              deliberately NOT in here -- see the final step below.
            parallel:
              - alias: Set living room thermostat to Sleep preset
                action: climate.set_preset_mode
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  preset_mode: sleep
              - alias: Turn on bathroom ambient lamp
                action: light.turn_on
                target:
                  entity_id: light.bathroom_ambient_lamp
                data:
                  color_temp_kelvin: 2350
                  brightness_pct: 65
              - alias: Ensure garage door is closed
                action: cover.close_cover
                target:
                  entity_id: cover.garage_door_opener_door
                data: {}
              - alias: Ensure front door is locked
                action: lock.lock
                target:
                  entity_id: lock.entrance_front_door
                data: {}
              - alias: Turn on master bedroom Apple TV
                action: media_player.turn_on
                target:
                  entity_id: media_player.master_bedroom_appletv
              - alias: Turn on master bedroom nightstand lamp
                action: light.turn_on
                target:
                  entity_id: light.master_bedroom_left_nightstand_lamp
                data:
                  brightness_pct: 50
                  color_temp_kelvin: 2000
              - alias: Turn on kitchen sink light as dim nav light
                action: light.turn_on
                target:
                  entity_id: light.kitchen_overhead_sink
                data:
                  color_temp_kelvin: 2000
                  brightness_pct: 10
          - alias: Turn off lights labeled "Sleeping"
            action: light.turn_off
            target:
              label_id: sleeping
            data: {}
            note: >-
              Runs last, after the AL flip and the parallel block, so this
              is always the last word -- wins cleanly over AL's push
              instead of racing it. Covers the office ceiling fan light
              (AL-enrolled but must end up off, not dimmed) plus every
              plain accent/decorative light labeled Sleeping.
      - alias: Everyone Sleeping turned OFF -- restore the home for day
        conditions:
          - condition: trigger
            id: sleep_off
        sequence:
          - alias: Run wake-restore actions in parallel
            note: >-
              Three independent actions (thermostat, kitchen nav light, AL
              sleep mode) with no ordering dependency.
            parallel:
              - alias: Set living room thermostat to Home preset
                action: climate.set_preset_mode
                target:
                  entity_id: climate.living_room_thermostat
                data:
                  preset_mode: home
              - alias: Turn off kitchen sink nav light
                action: light.turn_off
                target:
                  entity_id: light.kitchen_overhead_sink
              - alias: Clear Adaptive Lighting sleep mode on the Standard instance
                action: switch.turn_off
                target:
                  entity_id: switch.adaptive_lighting_standard_sleep_mode
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
