alias: "Household: Clear Stale Sleeping Mode"
description: >-
  Turns off Everyone Sleeping if it's still on at 9:00 AM while someone is
  home — most likely means it was left on by mistake. Fires daily at 9 AM;
  only acts if the mode is still enabled and the home isn't empty.
triggers:
  - trigger: time
    at: "09:00:00"
    alias: 9 AM daily check
conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
    alias: Someone is home
  - condition: state
    entity_id: input_boolean.everyone_sleeping
    state: "on"
    alias: Everyone Sleeping is still on
actions:
  - alias: Turn off Everyone Sleeping
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.everyone_sleeping
mode: single
