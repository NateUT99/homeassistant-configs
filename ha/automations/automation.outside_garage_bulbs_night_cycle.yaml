id: "1787364357549"
alias: "Outside: Garage Bulbs Night Cycle"
description: >-
  Runs the garage bulbs through a nightly brightness cycle: on at 75% at
  sunset, dimmed to 25% when everyone's asleep or by 10pm (whichever
  comes first), off at sunrise. A startup within 2 hours after sunrise
  catches up a sunrise missed while HA was down.
triggers:
  - alias: Sunset
    trigger: sun.sunset
    id: dusk
  - alias: Everyone falls asleep
    trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "on"
    id: sleeping
  - alias: 10pm fallback
    trigger: time
    at: "22:00:00"
    id: ten_pm
  - alias: Sunrise
    trigger: sun.sunrise
    id: sunrise
  - alias: HA started
    trigger: homeassistant
    event: start
    id: startup
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: "Sunset — turn on at 75%"
        conditions:
          - condition: trigger
            id: dusk
        sequence:
          - alias: Turn on garage bulbs at 75%
            action: light.turn_on
            target:
              entity_id:
                - light.outside_garage_bulbs
            data:
              brightness_pct: 75
      - alias: "Sleeping or 10pm — dim to 25%"
        conditions:
          - condition: trigger
            id:
              - sleeping
              - ten_pm
          - alias: "Skip if bulbs already off — don't override a manual off"
            condition: state
            entity_id: light.outside_garage_bulbs
            state: "on"
        sequence:
          - alias: Dim garage bulbs to 25%
            action: light.turn_on
            target:
              entity_id:
                - light.outside_garage_bulbs
            data:
              brightness_pct: 25
      - alias: "Sunrise — turn off"
        conditions:
          - condition: trigger
            id: sunrise
        sequence:
          - alias: Turn off garage bulbs
            action: light.turn_off
            target:
              entity_id:
                - light.outside_garage_bulbs
            data: {}
      - alias: "Startup in the morning — catch up a missed sunrise"
        conditions:
          - condition: trigger
            id: startup
          - alias: Within 2 hours after sunrise
            condition: sun
            after: sunrise
            before: sunrise
            before_offset: "02:00:00"
          - alias: Bulbs are still on
            condition: state
            entity_id: light.outside_garage_bulbs
            state: "on"
        sequence:
          - alias: Turn off garage bulbs
            action: light.turn_off
            target:
              entity_id:
                - light.outside_garage_bulbs
            data: {}
        note: >-
          Sun and time triggers that fire while HA is down are skipped, not
          replayed. The 2-hour window keeps an afternoon restart from turning
          off bulbs switched on by hand.
mode: single
