id: "1788029438768"
alias: "Master Bedroom: Ceiling Fan Speed Control"
description: >-
  Config-button control for the Master Bedroom ceiling fan (VTM36 canopy) from
  the Ceiling Fan Switch (VTM30-SN). Single tap: if the fan is off, resume the
  last speed stored in input_select.master_bedroom_ceiling_fan_last_speed; if
  it's on, advance low -> medium -> high -> low. Double tap: off. Config-button
  holds are deliberately unmapped - a hold opens the switch's local programming
  menu. The fan has no bindable Matter cluster, so this automation is the only
  wall link to it and does not work while HA is down.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
    not_to:
      - unavailable
      - unknown
conditions: []
actions:
  - alias: Route by config-button gesture
    choose:
      - alias: Single tap
        conditions:
          - alias: Gesture was a single tap
            condition: state
            entity_id: event.master_bedroom_ceiling_fan_switch_button_config
            attribute: event_type
            state: multi_press_1
        sequence:
          - alias: Resume last speed if off, otherwise advance the cycle
            if:
              - alias: Fan currently off
                condition: state
                entity_id: fan.master_bedroom_ceiling_fan
                state: "off"
            then:
              - alias: Turn fan on to the remembered speed
                action: fan.set_percentage
                target:
                  entity_id: fan.master_bedroom_ceiling_fan
                data:
                  percentage: "{% set s = states('input_select.master_bedroom_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
            else:
              - alias: Advance low -> medium -> high -> low
                note: "Wide bands absorb Matter fan percentage rounding: low~33, medium~66, high~100."
                action: fan.set_percentage
                target:
                  entity_id: fan.master_bedroom_ceiling_fan
                data:
                  percentage: "{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{{ 66 if p < 45 else (100 if p < 78 else 33) }}"
      - alias: Double tap - off
        conditions:
          - alias: Gesture was a double tap
            condition: state
            entity_id: event.master_bedroom_ceiling_fan_switch_button_config
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the ceiling fan off
            action: fan.turn_off
            target:
              entity_id: fan.master_bedroom_ceiling_fan
mode: single
max_exceeded: silent
category: 01M0BFFGNX30MJNVWS58ZKEH3H
