id: "1789473652797"
alias: "Office: Desk Button Handler"
description: >-
  Handles button presses on the Office Desk Button (Aqara WXKG11LM, ZHA):
  single press toggles the ceiling fan light, hold turns it off. Double
  press is reserved for future use.
triggers:
  - alias: Single press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:02:90:4e:72"
      command: single
    id: single_press
  - alias: Hold
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:02:90:4e:72"
      command: hold
    id: hold
conditions: []
actions:
  - alias: Route by gesture
    choose:
      - alias: "Single press: toggle ceiling fan light"
        conditions:
          - alias: Single press trigger
            condition: trigger
            id: single_press
        sequence:
          - alias: Toggle ceiling fan light
            action: light.toggle
            target:
              entity_id: light.office_ceiling_fan_light
      - alias: "Hold: turn off ceiling fan light"
        conditions:
          - alias: Hold trigger
            condition: trigger
            id: hold
        sequence:
          - alias: Turn off ceiling fan light
            action: light.turn_off
            target:
              entity_id: light.office_ceiling_fan_light
mode: single
