id: "1789515255261"
alias: "Household: Vacuum Mop Weekly Reset"
description: >-
  Clears both weekly mop-completion flags
  (input_boolean.vacuum_mop_common_areas_done_this_week,
  input_boolean.vacuum_mop_master_suite_done_this_week) at 8am Monday,
  opening up the coming week's mop opportunity. 8am matches the daily reset
  boundary for the same reason: an evening mop pass that lands just after
  midnight into Monday must still see last week's flags as done. Mop night
  itself floats to whatever night Avery is away, so this is the only fixed
  schedule point in the weekly mop design.
triggers:
  - trigger: time
    at: "08:00:00"
    alias: 8am Monday
conditions:
  - condition: time
    weekday: [mon]
    alias: Monday
actions:
  - alias: Clear common-area mop done flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
  - alias: Clear master suite mop done flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
