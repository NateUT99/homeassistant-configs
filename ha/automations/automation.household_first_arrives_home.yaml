id: "1787348678512"
alias: "Household: First Arrives Home"
description: >-
  Confirmed-arrival actions -- fires on input_boolean.arrival_confirmed, set by
  automation.household_confirm_arrival, not the raw zone.home geofence (which
  fires ~100m out and can't tell a drive home from a walk around the block).
  Sets the living room thermostat to Home, clears the Immediate Departure and
  vacuum routine-pause flags, and docks the vacuum if it's mid-run. Additional
  arrival actions will be added over time.
triggers:
  - trigger: state
    entity_id: input_boolean.arrival_confirmed
    to: "on"
    alias: Arrival confirmed
conditions: []
actions:
  - alias: Set living room thermostat to Home preset
    action: climate.set_preset_mode
    target:
      entity_id: climate.living_room_thermostat
    data:
      preset_mode: home
  - alias: Clear the Immediate Departure override
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.immediate_departure
    note: >-
      A "next departure is a long one" hint -- must not survive to affect a
      later, possibly brief, departure. automation.household_last_leaves_home
      also clears it on use; this is the safety net for when that automation
      didn't run.
  - alias: Clear the vacuum routine-pause flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacuum_routine_pause
    note: >-
      Folded in from the former automation.household_vacuum_stops_for_occupants.
      "I'm stepping out briefly, don't start" flag -- must not survive to block
      a later real departure.
  - alias: Dock the vacuum if it's mid-run now that someone is home
    note: >-
      Also folded in from automation.household_vacuum_stops_for_occupants. A
      commanded dock cancels the active job on this unit -- expected, see
      guides/vacuum_cleaning_routine.md.
    if:
      - condition: state
        entity_id: vacuum.living_room_vacuum
        state: cleaning
    then:
      - alias: Send the vacuum back to its dock
        action: vacuum.return_to_base
        target:
          entity_id: vacuum.living_room_vacuum
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
