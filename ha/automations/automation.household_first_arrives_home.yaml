id: "1787348678512"
alias: "Household: First Arrives Home"
description: >-
  Confirmed-arrival actions -- fires on input_boolean.arrival_confirmed, set by
  automation.household_confirm_arrival, not the raw zone.home geofence (which
  fires ~100m out and can't tell a drive home from a walk around the block).
  Sets the living room thermostat to Home, clears the Immediate Departure
  flag, clears the vacuum routine-pause flag, and docks the vacuum if it's
  mid-run and not stuck. Additional arrival actions will be added over time.
triggers:
  - trigger: state
    entity_id: input_boolean.arrival_confirmed
    to: "on"
    alias: Arrival confirmed
conditions: []
actions:
  - alias: Set living room thermostat to Home preset
    action: climate.set_preset_mode
    target:
      entity_id: climate.living_room_thermostat
    data:
      preset_mode: home
  - alias: Clear the Immediate Departure override
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.immediate_departure
    note: >-
      A "next departure is a long one" hint -- must not survive to affect a
      later, possibly brief, departure. automation.household_last_leaves_home
      also clears it on use; this is the safety net for when that automation
      didn't run.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacuum_routine_pause
    alias: Clear the vacuum routine-pause flag
  - alias: Dock the vacuum if it's mid-run now that someone is home, and it isn't stuck
    note: >-
      A commanded dock cancels the active job on this unit -- expected, see
      guides/vacuum_cleaning_routine.md. Gated on binary_sensor.vacuum_stuck
      being off, since a fault can clear while the unit is still
      mechanically obstructed and return_to_base would just command more
      movement into whatever it's caught on -- see LESSONS.md -> Vacuum &
      Roborock.
    if:
      - condition: state
        entity_id: vacuum.living_room_vacuum
        state: cleaning
        alias: Vacuum is cleaning
      - condition: state
        entity_id: binary_sensor.vacuum_stuck
        state: "off"
        alias: Vacuum is not actually stuck
    then:
      - alias: Send the vacuum back to its dock
        action: vacuum.return_to_base
        target:
          entity_id: vacuum.living_room_vacuum
    else:
      - alias: If it looked like a dock was due but the vacuum is stuck, say so instead
        if:
          - condition: state
            entity_id: binary_sensor.vacuum_stuck
            state: "on"
            alias: Vacuum is stuck
        then:
          - alias: Tell Nate the vacuum is stuck rather than docking it
            action: notify.send_message
            target:
              entity_id: notify.nates_iphone
            data:
              title: Vacuum
              message: Vacuum looks stuck -- didn't send it to dock automatically. Go check on it.
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
