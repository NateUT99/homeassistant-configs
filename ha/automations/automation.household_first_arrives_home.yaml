id: "1787348678512"
alias: "Household: First Arrives Home"
description: >-
  Sets the living room thermostat to Home preset when the first person
  arrives home. Fires when zone.home rises from 0 to 1. Additional arrival
  actions will be added to this automation over time.
triggers:
  - trigger: state
    entity_id: zone.home
    from: "0"
    to: "1"
    alias: First person arrives home
conditions: []
actions:
  - alias: Set living room thermostat to Home preset
    action: climate.set_preset_mode
    target:
      entity_id: climate.living_room_thermostat
    data:
      preset_mode: home
mode: single
