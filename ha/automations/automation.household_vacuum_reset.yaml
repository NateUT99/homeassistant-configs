id: "1789523181266"
alias: "Household: Vacuum Reset"
description: >-
  Clears both zones' ran-today flags, routine-pause, mop-skip-today, and
  daytime max-progress every day at 08:00; both weekly mop-completion flags
  additionally on Mondays. 08:00, not midnight, since an overnight run must
  still evaluate against yesterday's/last week's flags. Merged from two
  automations that fired at the same boundary. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time
    at: "08:00:00"
    alias: 8am daily
conditions: []
actions:
  - alias: Daily reset -- clear both zones' ran-today flags and related state
    sequence:
      - alias: Reset daytime zone ran-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_ran_daytime
      - alias: Reset evening zone ran-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_ran_evening
      - alias: Clear routine pause flag as a backstop
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_routine_pause
      - alias: Clear the mop-skip-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_skip_today
      - alias: Reset daytime max progress to 0
        action: input_number.set_value
        target:
          entity_id: input_number.vacuum_daytime_max_progress
        data:
          value: 0
  - alias: Monday only -- also open the coming week's mop opportunity
    if:
      - condition: time
        weekday: [mon]
        alias: Monday
    then:
      - alias: Clear common-area mop done flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
      - alias: Clear master suite mop done flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
