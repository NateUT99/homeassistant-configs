id: "1789523181266"
alias: "Household: Vacuum Reset"
description: >-
  Clears the routine's flags at 08:00 -- merged from two automations that
  fired at the identical time and did nothing but flip flags off. Every day:
  resets both zones' ran-today flags, the routine-pause flag (a backstop for
  the rare case where it was set but no arrival followed to clear it
  naturally), the mop-skip-today flag, and the daytime max-progress number.
  8am, not midnight, because an evening or mop run just after midnight must
  still evaluate against yesterday's flags. Mondays only, same 08:00
  boundary for the same reason: also clears both weekly mop-completion
  flags, opening the coming week's mop opportunity -- mop night itself
  floats to whatever night Avery is away, so this is the only fixed schedule
  point in the weekly mop design. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time
    at: "08:00:00"
    alias: 8am daily
conditions: []
actions:
  - alias: Daily reset -- clear both zones' ran-today flags and related state
    sequence:
      - alias: Reset daytime zone ran-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_ran_daytime
      - alias: Reset evening zone ran-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_ran_evening
      - alias: Clear routine pause flag as a backstop
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_routine_pause
      - alias: Clear the mop-skip-today flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_skip_today
      - alias: Reset daytime max progress to 0
        action: input_number.set_value
        target:
          entity_id: input_number.vacuum_daytime_max_progress
        data:
          value: 0
  - alias: Monday only -- also open the coming week's mop opportunity
    if:
      - condition: time
        weekday: [mon]
        alias: Monday
    then:
      - alias: Clear common-area mop done flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
      - alias: Clear master suite mop done flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
