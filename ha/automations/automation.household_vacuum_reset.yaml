id: "1789523181266"
alias: "Household: Vacuum Reset"
description: >-
  Clears both zones' ran-today flags, routine-pause, and mop-skip-today every
  day at 08:00; both weekly mop-completion flags separately at 12:00 every
  Monday -- split off 08:00 so a Sunday-night mop's morning follow-up isn't
  cut short by a late wake clearing vacuum_mop_common_areas_done_this_week out
  from under it. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time
    at: "08:00:00"
    id: daily_reset
    alias: 8am daily
  - trigger: time
    at: "12:00:00"
    id: monday_weekly_reset
    alias: 12pm Monday -- past any plausible wake
conditions: []
actions:
  - choose:
      - alias: 8am daily -- clear both zones' ran-today flags and related state
        conditions:
          - condition: trigger
            id: [daily_reset]
        sequence:
          - alias: Reset daytime zone ran-today flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_ran_daytime
          - alias: Reset evening zone ran-today flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_ran_evening
          - alias: Clear routine pause flag as a backstop
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_routine_pause
          - alias: Clear the mop-skip-today flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_mop_skip_today
      - alias: 12pm Monday only -- open the coming week's mop opportunity
        conditions:
          - condition: trigger
            id: [monday_weekly_reset]
          - condition: time
            weekday: [mon]
            alias: Monday
        sequence:
          - alias: Clear common-area mop done flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
          - alias: Clear master suite mop done flag
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
