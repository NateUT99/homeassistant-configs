id: "1786997164282"
alias: "Household: Configure Home for Sleep and Wake"
description: >-
  Controls night lamps, garage door, and front door lock based on the
  everyone_sleeping state. Turns on entrance and bathroom night lamps at warm
  low brightness, closes the garage door, and locks the front door when
  everyone goes to sleep. Turns off the entrance night lamp when everyone
  wakes up. Fires each time the sleep state toggles.
triggers:
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_on
    alias: Everyone goes to sleep
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - alias: Route by sleep direction
    choose:
      - alias: Going to sleep
        conditions:
          - alias: Sleep-on trigger
            condition: trigger
            id:
              - sleep_on
        sequence:
          - alias: Turn on night lamps
            action: light.turn_on
            metadata: {}
            target:
              entity_id:
                - light.bathroom_night_lamp
                - light.entrance_night_lamp
            data:
              color_temp_kelvin: 2350
              brightness_pct: 65
          - alias: Ensure garage door is closed
            action: cover.close_cover
            metadata: {}
            target:
              entity_id: cover.garage_door_opener_door
            data: {}
          - alias: Ensure front door is locked
            action: lock.lock
            metadata: {}
            target:
              entity_id: lock.entrance_front_door
            data: {}
      - alias: Waking up
        conditions:
          - alias: Sleep-off trigger
            condition: trigger
            id:
              - sleep_off
        sequence:
          - alias: Turn off entrance night lamp
            action: light.turn_off
            metadata: {}
            target:
              entity_id: light.entrance_night_lamp
            data: {}
mode: single
