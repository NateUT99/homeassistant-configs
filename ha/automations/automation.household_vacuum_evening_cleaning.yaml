id: "1787695541380"
alias: "Household: Vacuum Evening Cleaning"
description: >-
  Starts the Roborock on a segment clean of the Common Areas (Kitchen, Living
  room, Pantry, Utility Room -- Kitchen includes the former Dining room, merged
  in the Roborock app) once everyone has been asleep for an hour, at quiet fan
  speed with mopping disabled to avoid a loud dock wash and dry. Runs regardless
  of who is home: every room in this pass cleans well at quiet fan speed and sits
  clear of the bedroom hall, so no presence gate is needed. The Office (carpet,
  needs max suction) and the Entrance (within earshot of the bedrooms) are in the
  daytime clean instead.


  Marks the evening zone done (input_boolean.vacuum_ran_evening) the moment it
  commands the job. Nothing docks this run mid-way, so there is no
  partial-completion case worth tracking -- the flag just records that tonight's
  clean was started, and Vacuum Daily Reset clears it at 8am. It also stops an HA
  restart (which re-primes the 1-hour sleep timer) from kicking off a second
  clean overnight. The daytime Remaining Rooms clean lives in
  automation.household_last_leaves_home and rides the departure trigger; the two
  zones never reference each other's state. See
  guides/vacuum_cleaning_routine.md for the full reasoning.
triggers:
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "on"
    for:
      hours: 1
    alias: Everyone has been asleep for 1 hour
conditions:
  - condition: state
    entity_id: input_boolean.vacuum_ran_evening
    state: "off"
    alias: Evening zone has not run today
  - condition: state
    entity_id: input_boolean.vacuum_routine_pause
    state: "off"
    alias: Vacuum routine is not paused
  - condition: not
    conditions:
      - condition: state
        entity_id: vacuum.living_room_vacuum
        state: cleaning
    alias: Vacuum is not currently cleaning
actions:
  - alias: Set active zone to evening
    action: input_select.select_option
    target:
      entity_id: input_select.vacuum_active_zone
    data:
      option: evening
  - alias: Set quiet fan speed for evening cleaning
    action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.living_room_vacuum
    data:
      fan_speed: quiet
  - alias: Disable mopping in the evening to avoid loud dock wash and dry
    action: select.select_option
    target:
      entity_id: select.living_room_vacuum_mop_intensity
    data:
      option: "off"
  - alias: Start segment clean of common areas
    action: vacuum.send_command
    target:
      entity_id: vacuum.living_room_vacuum
    data:
      command: app_segment_clean
      params:
        - segments: [22, 23, 24, 25]
          repeat: 1
  - alias: Mark evening zone ran today
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vacuum_ran_evening
    note: >-
      Set on command, not on verified completion -- nothing docks the evening run
      mid-way, so there is no partial run to distinguish. Guards against a
      re-primed sleep timer (HA restart) starting a second clean the same night.
      Cleared at 8am by Vacuum Daily Reset.
  - alias: Notify that evening cleaning started
    action: notify.send_message
    target:
      entity_id: notify.nates_iphone
    data:
      title: Vacuum
      message: Started cleaning common areas this evening.
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
