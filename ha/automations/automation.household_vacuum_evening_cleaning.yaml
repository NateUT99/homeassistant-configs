id: "1787695541380"
alias: "Household: Vacuum Evening Cleaning"
description: >-
  Runs the nightly common-area vacuum pass (and, once a week, the mop pass)
  once everyone's been asleep for an hour, plus the next-morning master-suite
  mop follow-up once everyone wakes, with an 11:00 push offering a manual
  start if the follow-up hasn't run -- all in one automation since they are
  the same weekly pad/tank cycle. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "on"
    for:
      hours: 1
    id: bedtime_hold
    alias: Everyone has been asleep for 1 hour
  - trigger: homeassistant
    event: start
    id: ha_restart_recheck
    alias: HA started -- re-check whether tonight's pass was missed
    note: >-
      Backstops a restart during the bedtime_hold trigger's 1-hour wait -- a
      state trigger's `for:` needs the entity to change state while armed,
      and a restart clears that arming, so the pass could otherwise be
      silently skipped for the night.
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    from: "on"
    to: "off"
    for:
      seconds: 20
    id: wake_transition
    alias: Everyone Sleeping cleared for 20 seconds -- someone is up for the day
  - trigger: time
    at: "11:00:00"
    id: master_mop_check
    alias: 11:00 -- check the master suite follow-up ran
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: VACUUM_MASTER_MOP_NOW
    id: master_mop_retry
    alias: Mop master suite now tapped
conditions: []
actions:
  - choose:
      - alias: >-
          Evening common-area pass -- normal bedtime trigger, or a missed-run
          recheck after an HA restart
        conditions:
          - condition: or
            alias: Triggered normally, or HA restarted after sleep had already held for an hour
            conditions:
              - condition: trigger
                id: [bedtime_hold]
              - condition: and
                conditions:
                  - condition: trigger
                    id: [ha_restart_recheck]
                  - condition: state
                    entity_id: input_boolean.everyone_sleeping
                    state: "on"
                    for:
                      hours: 1
        sequence:
          - alias: Start tonight's pass if the routine isn't paused and the vacuum is free
            if:
              - condition: state
                entity_id: input_boolean.vacuum_routine_pause
                state: "off"
                alias: Vacuum routine is not paused
              - condition: not
                conditions:
                  - condition: state
                    entity_id: vacuum.living_room_vacuum
                    state: cleaning
                alias: Vacuum is not currently cleaning
            then:
              - choose:
                  - alias: >-
                      Weekly mop pass -- Avery away tonight, not yet mopped
                      this week, pad on, water module seated, tank not empty
                    conditions:
                      - condition: state
                        entity_id: input_boolean.vacuum_avery_home_tonight
                        state: "off"
                        alias: Avery is not home tonight
                        note: >-
                          Reads the 20:00-latched helper, not the live
                          binary_sensor.avery_home_today -- that sensor is
                          calendar-derived and flips at exactly midnight, and
                          this run can land after it. See LESSONS.md ->
                          Presence & Device Trackers.
                      - condition: state
                        entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
                        state: "off"
                        alias: Common-area mop hasn't run yet this week
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_mop_attached
                        state: "on"
                        alias: Mop pad is clipped on
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_water_box_attached
                        state: "on"
                        alias: 2-in-1 dustbin + water module is seated
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_water_shortage
                        state: "off"
                        alias: Water tank is not empty
                    note: >-
                      Deliberately not gated on vacuum_ran_evening -- a noon
                      whole-house vacuum sets that flag but does not mop, so
                      the weekly mop still runs that night.
                    sequence:
                      - alias: Start the common-area mop
                        action: script.household_vacuum_start_job
                        data:
                          job: common_mop
                        response_variable: start
                        note: >-
                          The script owns the rooms, fan speed, and mop
                          intensity -- see guides/vacuum_cleaning_routine.md.
                      - alias: Continue only if the job started
                        condition: template
                        value_template: "{{ start.started }}"
                        note: >-
                          The script re-checks the hardware itself; if it
                          refused, this branch's flags stay off.
                      - alias: Mark common-area mop done this week
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
                      - alias: Mark evening zone ran today
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_ran_evening
                        note: >-
                          Set here, not by Household: Vacuum Mop Now -- an ad
                          hoc mop must not mark the night's ordinary vacuum
                          pass as done. Tonight's nightly pass is what
                          actually ran.
                      - alias: Flag tonight as a mop night for the 08:00 reset
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_mopped_overnight
                        note: >-
                          Household: Vacuum Reset reads and clears this at
                          08:00, marking both zones ran for the coming day so
                          its daytime and evening vacuum passes skip -- the mop
                          pass vacuums as it mops. Set here rather than by
                          Household: Vacuum Mop Now so an ad hoc mop never
                          skips a day.
                  - alias: Nightly vacuum pass -- evening zone hasn't run today, mop pad off
                    conditions:
                      - condition: state
                        entity_id: input_boolean.vacuum_ran_evening
                        state: "off"
                        alias: Evening zone has not run today
                        note: >-
                          A noon whole-house pass sets this flag, so the nightly
                          vacuum is skipped as redundant.
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_mop_attached
                        state: "off"
                        alias: Mop pad is not attached
                        note: >-
                          With the pad on, the mop pass is the only job this run
                          may start -- a leftover pad, or one prepped on a night
                          the mop branch above cannot run, must not be dragged
                          through the vacuum pass. The start script also
                          refuses a vacuum job with the pad on.
                    sequence:
                      - alias: Start the nightly vacuum
                        action: script.household_vacuum_start_job
                        data:
                          job: nightly
                        response_variable: start
                        note: >-
                          Office, Kitchen, Living Room. The script owns the
                          rooms and fan speed -- see
                          guides/vacuum_cleaning_routine.md.
                      - alias: Continue only if the job started
                        condition: template
                        value_template: "{{ start.started }}"
                        note: >-
                          The script re-checks the hardware itself; if it
                          refused, this branch's flags stay off.
                      - alias: Mark evening zone ran today
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_ran_evening
                        note: >-
                          Set on command, not on verified completion -- nothing
                          docks the evening run mid-way, so there is no partial
                          run to distinguish. Reset at 8am by Household:
                          Vacuum Reset.
                default:
                  - alias: If tonight was skipped for the mop pad, say so quietly
                    note: >-
                      Covers a leftover pad (this week's mop already ran) and a
                      pad prepped on a night the mop branch cannot run (Avery
                      home, tank empty, module out). Only when a pass was
                      actually due -- the night after a mop pass is skipped on
                      purpose and stays silent. Passive so it lands silently
                      overnight, and tagged vacuum_mop_cleanup so Household:
                      Vacuum Mop Pad Reminders clears it when the pad comes
                      off.
                    if:
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_mop_attached
                        state: "on"
                        alias: Mop pad is attached
                      - condition: state
                        entity_id: input_boolean.vacuum_ran_evening
                        state: "off"
                        alias: A nightly pass was due tonight
                    then:
                      - alias: Tell Nate the nightly clean was skipped for the mop pad
                        action: notify.mobile_app_nates_iphone
                        data:
                          title: Vacuum
                          message: Nightly clean skipped -- the mop pad is attached.
                          data:
                            tag: vacuum_mop_cleanup
                            push:
                              interruption-level: passive
      - alias: Master suite mop follow-up -- next morning after a mop night, or the 11:00 push button
        conditions:
          - condition: trigger
            id: [wake_transition, master_mop_retry]
            note: >-
              The push button reuses this branch, warning and 15-minute grace
              included, so a manual start gets the same refill/clear-the-floor
              window and re-checks.
        sequence:
          - alias: Proceed only if last night's mop happened and this week's follow-up hasn't
            if:
              - condition: state
                entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
                state: "on"
                alias: This week's common-area mop pass already ran
              - condition: state
                entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
                state: "off"
                alias: This week's master suite mop hasn't run yet
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_mop_attached
                state: "on"
                alias: Mop pad is still attached from last night
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_water_box_attached
                state: "on"
                alias: 2-in-1 dustbin + water module is seated
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_water_shortage
                state: "off"
                alias: Water tank is not empty
              - condition: state
                entity_id: input_boolean.vacuum_routine_pause
                state: "off"
                alias: Vacuum routine is not paused
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_cleaning
                state: "off"
                alias: Vacuum is not currently mid-job
            then:
              - alias: Announce the master mop pass is coming
                action: script.turn_on
                target:
                  entity_id: script.household_tts_announce
                data:
                  variables:
                    message: Master suite mop in 15 minutes. Refill the tank and clear the floor.
                    target: master_bedroom
                    notification_title: Vacuum Master Mop
                    critical_fallback: false
                note: >-
                  Fire-and-forget via script.turn_on, not a blocking call --
                  a playback failure inside the TTS script would otherwise
                  abort this branch before the delay, and the mop would
                  never start.
              - alias: Push the grace window with a Start now button
                note: >-
                  Sent even when the TTS plays -- a TTS fallback push cannot
                  carry a button, and this reaches whoever is up but out of
                  the bedroom. Legacy notify service for the actionable data.
                action: notify.mobile_app_nates_iphone
                data:
                  title: Vacuum Master Mop
                  message: Master suite mop in 15 minutes. Refill the tank and clear the floor.
                  data:
                    tag: vacuum_master_mop_grace
                    actions:
                      - action: VACUUM_MASTER_MOP_START_NOW
                        title: Start now
              - alias: Wait 15 minutes, or until Start now is tapped
                wait_for_trigger:
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: VACUUM_MASTER_MOP_START_NOW
                    alias: Start now tapped
                timeout:
                  minutes: 15
                continue_on_timeout: true
              - alias: Clear the grace-window push
                action: notify.mobile_app_nates_iphone
                data:
                  message: clear_notification
                  data:
                    tag: vacuum_master_mop_grace
              - alias: Start the follow-up unless the routine was paused during the grace window
                note: >-
                  The script re-checks the pad, water module, tank, and mid-job
                  state itself, since 15 minutes is enough time to pull the
                  module for a refill and not reseat it.
                if:
                  - condition: state
                    entity_id: input_boolean.vacuum_routine_pause
                    state: "off"
                    alias: Vacuum routine is still not paused
                then:
                  - alias: Start the master suite mop
                    action: script.household_vacuum_start_job
                    data:
                      job: master_mop
                    response_variable: start
                    note: >-
                      Master Bedroom and Master Bathroom; the carpeted closet
                      is excluded. The script owns the rooms, fan speed, and
                      mop intensity.
                  - alias: Mark it done, or say why it was skipped
                    if:
                      - condition: template
                        value_template: "{{ start.started }}"
                        alias: The job started
                    then:
                      - alias: Mark master suite mop done this week
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
                    else:
                      - alias: Tell Nate the master mop pass was skipped, and why
                        action: notify.send_message
                        target:
                          entity_id: notify.nates_iphone
                        data:
                          title: Vacuum
                          message: Master mop pass skipped -- {{ start.reason }}.
                else:
                  - alias: Tell Nate the master mop pass was skipped because the routine is paused
                    action: notify.send_message
                    target:
                      entity_id: notify.nates_iphone
                    data:
                      title: Vacuum
                      message: Master mop pass skipped -- the routine is paused.
      - alias: 11:00 backstop -- offer a manual start if this week's master suite follow-up hasn't run
        conditions:
          - condition: trigger
            id: [master_mop_check]
          - condition: state
            entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
            state: "on"
            alias: This week's common-area mop pass already ran
          - condition: state
            entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
            state: "off"
            alias: This week's master suite mop hasn't run yet
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
            alias: Someone is up
            note: On a late wake, the wake_transition branch handles the follow-up itself.
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_mop_attached
            state: "on"
            alias: Mop pad is still attached
        sequence:
          - alias: Push the missed follow-up with a start button
            note: Legacy notify service -- notify.send_message cannot carry actionable data.
            action: notify.mobile_app_nates_iphone
            data:
              title: Vacuum
              message: The master suite mop hasn't run yet this week.
              data:
                tag: vacuum_master_mop_missed
                actions:
                  - action: VACUUM_MASTER_MOP_NOW
                    title: Mop master suite now
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
