id: "1787695541380"
alias: "Household: Vacuum Evening Cleaning"
description: >-
  Runs the nightly common-area vacuum pass (and, once a week, the mop pass)
  once everyone's been asleep for an hour, plus the next-morning master-suite
  mop follow-up once everyone wakes -- two branches in one automation since
  both are the same weekly pad/tank cycle. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "on"
    for:
      hours: 1
    id: bedtime_hold
    alias: Everyone has been asleep for 1 hour
  - trigger: homeassistant
    event: start
    id: ha_restart_recheck
    alias: HA started -- re-check whether tonight's pass was missed
    note: >-
      Backstops a restart during the bedtime_hold trigger's 1-hour wait -- a
      state trigger's `for:` needs the entity to change state while armed,
      and a restart clears that arming, so the pass could otherwise be
      silently skipped for the night.
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    from: "on"
    to: "off"
    for:
      seconds: 20
    id: wake_transition
    alias: Everyone Sleeping cleared for 20 seconds -- someone is up for the day
conditions: []
actions:
  - choose:
      - alias: >-
          Evening common-area pass -- normal bedtime trigger, or a missed-run
          recheck after an HA restart
        conditions:
          - condition: or
            alias: Triggered normally, or HA restarted after sleep had already held for an hour
            conditions:
              - condition: trigger
                id: [bedtime_hold]
              - condition: and
                conditions:
                  - condition: trigger
                    id: [ha_restart_recheck]
                  - condition: state
                    entity_id: input_boolean.everyone_sleeping
                    state: "on"
                    for:
                      hours: 1
        sequence:
          - alias: Start tonight's pass if the zone hasn't run yet, isn't paused, and the vacuum is free
            if:
              - condition: state
                entity_id: input_boolean.vacuum_ran_evening
                state: "off"
                alias: Evening zone has not run today
              - condition: state
                entity_id: input_boolean.vacuum_routine_pause
                state: "off"
                alias: Vacuum routine is not paused
              - condition: not
                conditions:
                  - condition: state
                    entity_id: vacuum.living_room_vacuum
                    state: cleaning
                alias: Vacuum is not currently cleaning
            then:
              - alias: Set active zone to evening
                action: input_select.select_option
                target:
                  entity_id: input_select.vacuum_active_zone
                data:
                  option: evening
              - alias: Set quiet fan speed for evening cleaning
                action: vacuum.set_fan_speed
                target:
                  entity_id: vacuum.living_room_vacuum
                data:
                  fan_speed: quiet
              - choose:
                  - alias: >-
                      Weekly mop pass -- Avery away tonight, not yet mopped
                      this week, pad on, water module seated, tank not empty
                    conditions:
                      - condition: state
                        entity_id: input_boolean.vacuum_avery_home_tonight
                        state: "off"
                        alias: Avery is not home tonight
                        note: >-
                          Reads the 20:00-latched helper, not the live
                          binary_sensor.avery_home_today -- that sensor is
                          calendar-derived and flips at exactly midnight, and
                          this run can land after it. See LESSONS.md ->
                          Presence & Device Trackers.
                      - condition: state
                        entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
                        state: "off"
                        alias: Common-area mop hasn't run yet this week
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_mop_attached
                        state: "on"
                        alias: Mop pad is clipped on
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_water_box_attached
                        state: "on"
                        alias: 2-in-1 dustbin + water module is seated
                      - condition: state
                        entity_id: binary_sensor.living_room_vacuum_water_shortage
                        state: "off"
                        alias: Water tank is not empty
                    sequence:
                      - alias: Start the weekly mop pass via the shared mop script
                        action: script.household_vacuum_mop_now
                        note: >-
                          script.household_vacuum_mop_now owns the six-room
                          segment list, fan speed, and mop-related select
                          settings -- see guides/vacuum_cleaning_routine.md,
                          Ad Hoc Mop Pass. This branch's own conditions above
                          already satisfy the script's hardware interlocks.
                          It also turns on
                          vacuum_mop_common_areas_done_this_week itself.
                      - alias: Mark evening zone ran today
                        action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.vacuum_ran_evening
                        note: >-
                          The script deliberately leaves this flag untouched
                          -- a manual mop pass through the same script must
                          not silently mark the night's ordinary vacuum pass
                          as done too. This branch sets it since tonight's
                          nightly pass is what actually ran.
                default:
                  - alias: Build the vacuum segment list -- add the Entrance only when Avery is away tonight
                    variables:
                      vacuum_segments: "{{ [22, 23, 24, 25] + ([17, 26] if is_state('input_boolean.vacuum_avery_home_tonight', 'off') else []) }}"
                    note: >-
                      Bathroom and Entrance both border Avery's room, so both
                      are safe on any night she isn't home, not just mop
                      night. Household: Last Leaves Home drops segments 17
                      and 26 from that day's daytime pass whenever this gate
                      adds them here, so neither room is cleaned twice.
                  - alias: Start segment clean of common areas
                    action: vacuum.send_command
                    target:
                      entity_id: vacuum.living_room_vacuum
                    data:
                      command: app_segment_clean
                      params:
                        - segments: "{{ vacuum_segments }}"
                          repeat: 1
                  - alias: Mark evening zone ran today
                    action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.vacuum_ran_evening
                    note: >-
                      Set on command, not on verified completion -- nothing
                      docks the evening run mid-way, so there is no partial
                      run to distinguish. Cleared at 8am by Household:
                      Vacuum Reset.
      - alias: Master suite mop follow-up -- next morning after a mop night
        conditions:
          - condition: trigger
            id: [wake_transition]
        sequence:
          - alias: Proceed only if last night's mop happened and this week's follow-up hasn't
            if:
              - condition: state
                entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
                state: "on"
                alias: This week's common-area mop pass already ran
              - condition: state
                entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
                state: "off"
                alias: This week's master suite mop hasn't run yet
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_mop_attached
                state: "on"
                alias: Mop pad is still attached from last night
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_water_box_attached
                state: "on"
                alias: 2-in-1 dustbin + water module is seated
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_water_shortage
                state: "off"
                alias: Water tank is not empty
              - condition: state
                entity_id: input_boolean.vacuum_routine_pause
                state: "off"
                alias: Vacuum routine is not paused
              - condition: state
                entity_id: binary_sensor.living_room_vacuum_cleaning
                state: "off"
                alias: Vacuum is not currently mid-job
            then:
              - alias: Announce the master mop pass is coming
                action: script.household_tts_announce
                data:
                  message: >-
                    Refill the robot's water tank. The master bedroom and
                    master bathroom will be mopped in 15 minutes -- pick
                    anything up off the floor.
                  target: master_bedroom
                  notification_title: Vacuum Master Mop
                  critical_fallback: false
              - alias: Wait 15 minutes for the water tank to be refilled and the floor cleared
                delay:
                  minutes: 15
              - alias: Start the follow-up if the pad, water module, tank, and pause state still allow it
                note: >-
                  Re-checked here, not just before the delay -- 15 minutes is
                  enough time to pull the water module for a refill and not
                  reseat it, or pull the pad off.
                if:
                  - condition: state
                    entity_id: binary_sensor.living_room_vacuum_mop_attached
                    state: "on"
                    alias: Mop pad is still attached
                  - condition: state
                    entity_id: binary_sensor.living_room_vacuum_water_box_attached
                    state: "on"
                    alias: Water module is still seated
                  - condition: state
                    entity_id: binary_sensor.living_room_vacuum_water_shortage
                    state: "off"
                    alias: Water tank is still not empty
                  - condition: state
                    entity_id: input_boolean.vacuum_routine_pause
                    state: "off"
                    alias: Vacuum routine is still not paused
                  - condition: state
                    entity_id: binary_sensor.living_room_vacuum_cleaning
                    state: "off"
                    alias: Vacuum still is not mid-job
                then:
                  - alias: Set active zone to master_mop
                    action: input_select.select_option
                    target:
                      entity_id: input_select.vacuum_active_zone
                    data:
                      option: master_mop
                  - alias: Set balanced fan speed
                    action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.living_room_vacuum
                    data:
                      fan_speed: balanced
                    note: >-
                      Both rooms are hard floor and the house is awake -- max
                      fan (daytime pass) is unnecessary noise here.
                  - alias: Start the segment clean of the master bedroom and bathroom
                    action: vacuum.send_command
                    target:
                      entity_id: vacuum.living_room_vacuum
                    data:
                      command: app_segment_clean
                      params:
                        - segments: [19, 21]
                          repeat: 1
                    note: >-
                      Segment 20 (Master closet, carpeted) is deliberately
                      excluded. Segment 28 (Stairs) never appears in this
                      routine -- fall hazard, backstopped by an app virtual
                      wall.
                  - alias: Mark master suite mop done this week
                    action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
                  - alias: Stamp today as the master suite's last mop date
                    action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.vacuum_master_mop_last_run
                    data:
                      date: "{{ now().strftime('%Y-%m-%d') }}"
                    note: >-
                      Read by Household: Last Leaves Home to drop the master
                      suite from today's daytime pass -- a date compare
                      rather than input_select.vacuum_active_zone, which the
                      next job commanded always overwrites.
                else:
                  - alias: Tell Nate the master mop pass was skipped, and why
                    action: notify.send_message
                    target:
                      entity_id: notify.nates_iphone
                    data:
                      title: Vacuum
                      message: >-
                        Master mop pass skipped -- {{ 'the mop pad came off'
                        if is_state('binary_sensor.living_room_vacuum_mop_attached',
                        'off') else ("the water module isn't seated" if
                        is_state('binary_sensor.living_room_vacuum_water_box_attached',
                        'off') else ('the water tank is empty' if
                        is_state('binary_sensor.living_room_vacuum_water_shortage',
                        'on') else ('the routine is paused' if
                        is_state('input_boolean.vacuum_routine_pause', 'on')
                        else 'the vacuum is already mid-job'))) }}.
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
