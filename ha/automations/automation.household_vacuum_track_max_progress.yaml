id: "1787695599231"
alias: "Household: Vacuum Track Max Progress"
description: >-
  Tracks the highest cleaning progress percentage reached in each zone
  today. A commanded dock resets the live progress sensor to 0, but this
  running maximum survives, so "best coverage achieved in that zone
  today" stays knowable even after an interruption. Split by
  input_select.vacuum_active_zone so a small Evening job can never be
  mistaken for a completed Daytime job or vice versa -- progress is
  relative to job size, not house size.
triggers:
  - trigger: state
    entity_id: sensor.living_room_vacuum_cleaning_progress
    alias: Cleaning progress updated
conditions: []
actions:
  - choose:
      - alias: Evening zone active -- update its max if progress increased
        conditions:
          - condition: state
            entity_id: input_select.vacuum_active_zone
            state: evening
          - condition: numeric_state
            entity_id: sensor.living_room_vacuum_cleaning_progress
            above: input_number.vacuum_evening_max_progress
        sequence:
          - alias: Update stored evening max progress
            action: input_number.set_value
            target:
              entity_id: input_number.vacuum_evening_max_progress
            data:
              value: "{{ states('sensor.living_room_vacuum_cleaning_progress') | float(0) }}"
      - alias: Daytime zone active -- update its max if progress increased
        conditions:
          - condition: state
            entity_id: input_select.vacuum_active_zone
            state: daytime
          - condition: numeric_state
            entity_id: sensor.living_room_vacuum_cleaning_progress
            above: input_number.vacuum_daytime_max_progress
        sequence:
          - alias: Update stored daytime max progress
            action: input_number.set_value
            target:
              entity_id: input_number.vacuum_daytime_max_progress
            data:
              value: "{{ states('sensor.living_room_vacuum_cleaning_progress') | float(0) }}"
mode: single
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
