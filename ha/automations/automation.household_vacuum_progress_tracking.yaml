id: "1789523164009"
alias: "Household: Vacuum Progress Tracking"
description: >-
  Tracks the daytime zone's highest cleaning progress today, and marks it
  done once that maximum clears 65% and the vacuum starts returning to dock.
  Merged from two automations that were tightly coupled -- one wrote the
  number, the other read it. See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: state
    entity_id: sensor.living_room_vacuum_cleaning_progress
    id: progress_tick
    alias: Cleaning progress updated
  - trigger: state
    entity_id: vacuum.living_room_vacuum
    to: returning
    id: returning
    alias: Vacuum starts returning to dock
conditions:
  - condition: state
    entity_id: input_select.vacuum_active_zone
    state: daytime
    alias: Daytime zone commanded the current job
actions:
  - choose:
      - alias: Progress tick -- update the stored max if live progress beats it
        conditions:
          - condition: trigger
            id: [progress_tick]
            alias: Triggered by a progress update
          - condition: numeric_state
            entity_id: sensor.living_room_vacuum_cleaning_progress
            above: input_number.vacuum_daytime_max_progress
            alias: Live progress beats the stored daytime max
        sequence:
          - alias: Update stored daytime max progress
            action: input_number.set_value
            target:
              entity_id: input_number.vacuum_daytime_max_progress
            data:
              value: "{{ states('sensor.living_room_vacuum_cleaning_progress') | float(0) }}"
            note: "Tracks the max, not the live value -- a commanded dock (someone arriving mid-run) resets live progress to 0."
      - alias: Returning to dock -- mark the daytime zone done if its max cleared 65%
        conditions:
          - condition: trigger
            id: [returning]
            alias: Triggered by the vacuum returning to dock
          - condition: numeric_state
            entity_id: input_number.vacuum_daytime_max_progress
            above: 65
            alias: Daytime max progress cleared 65%
            note: Below 100 because several daytime rooms may have a closed door, capping achievable progress in a way retrying won't fix.
        sequence:
          - alias: Mark daytime zone ran today
            action: input_boolean.turn_on
            target:
              entity_id: input_boolean.vacuum_ran_daytime
mode: queued
max: 10
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
