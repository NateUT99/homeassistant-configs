id: "1787695593220"
alias: "Household: Vacuum Stops For Occupants"
description: >-
  Docks the vacuum whenever someone is around to be disturbed by it: a
  confirmed arrival (not just the zone.home geofence, which fires ~100m
  out and can't distinguish a drive home from a walk around the block --
  see automation.household_confirm_arrival), or someone wakes up
  mid-evening-run. Zone-agnostic -- works the same regardless of which
  zone is currently running. Also clears the routine-pause flag on
  confirmed arrival, since that flag means "I'm stepping out briefly,
  don't start" and should never survive to block a later real departure.
triggers:
  - trigger: state
    entity_id: input_boolean.arrival_confirmed
    to: "on"
    id: arrival
    alias: Arrival confirmed
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "off"
    id: someone_woke
    alias: Someone woke up during an evening run
conditions: []
actions:
  - alias: Route by which trigger fired
    choose:
      - alias: Confirmed arrival
        conditions:
          - condition: trigger
            id: [arrival]
            alias: Triggered by confirmed arrival
        sequence:
          - alias: If vacuum is currently cleaning, dock it
            if:
              - condition: state
                entity_id: vacuum.living_room_vacuum
                state: cleaning
            then:
              - alias: Send vacuum back to dock -- this cancels the active job on this unit, which is expected
                action: vacuum.return_to_base
                target:
                  entity_id: vacuum.living_room_vacuum
          - alias: Clear the routine pause flag now that someone is home
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacuum_routine_pause
      - alias: Someone woke mid-run
        conditions:
          - condition: trigger
            id: [someone_woke]
            alias: Triggered by someone waking during an evening run
            note: >-
              Deliberately does not clear vacuum_routine_pause -- that
              flag means "stepping out briefly," which has nothing to do
              with someone waking up. Previously this action ran
              unconditionally after both triggers; moved into this
              branch to fix that.
        sequence:
          - alias: If vacuum is currently cleaning, dock it
            if:
              - condition: state
                entity_id: vacuum.living_room_vacuum
                state: cleaning
            then:
              - alias: Send vacuum back to dock -- this cancels the active job on this unit, which is expected
                action: vacuum.return_to_base
                target:
                  entity_id: vacuum.living_room_vacuum
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
