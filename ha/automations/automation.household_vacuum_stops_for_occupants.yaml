id: "1787695593220"
alias: "Household: Vacuum Stops For Occupants"
description: >-
  Docks the vacuum whenever someone is around to be disturbed by it: the
  first person arrives home, someone wakes up mid-overnight-run, or a
  simulated arrival for testing. Zone-agnostic -- works the same
  regardless of which zone (Common Areas or Remaining Rooms) is currently
  running. Also clears the routine-pause flag on arrival, since that flag
  means "I'm stepping out briefly, don't start" and should never survive
  to block a later real departure.
triggers:
  - trigger: state
    entity_id: zone.home
    from: "0"
    id: arrival
    alias: First person arrives home
  - trigger: state
    entity_id: input_boolean.vacuum_simulate_away
    to: "off"
    id: simulate_arrival
    alias: Simulated arrival (testing)
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "off"
    id: someone_woke
    alias: Someone woke up during an overnight run
conditions: []
actions:
  - alias: If vacuum is currently cleaning, dock it
    if:
      - condition: state
        entity_id: vacuum.living_room_vacuum
        state: cleaning
    then:
      - alias: Send vacuum back to dock -- this cancels the active job on this unit, which is expected
        action: vacuum.return_to_base
        target:
          entity_id: vacuum.living_room_vacuum
  - alias: Clear the routine pause flag now that someone is home
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacuum_routine_pause
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
