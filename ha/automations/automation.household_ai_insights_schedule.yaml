id: '1791227473971'
alias: 'Household: AI Insights Schedule'
description: 'Refreshes the Claude-generated dashboard text on a schedule: the weather briefing at 06:30,
  12:00, and 17:00, and the Climate and Energy insights at 07:00 (with a week-over-week pass on Sundays).
  The scripts are started without waiting so a slow API call never holds the automation. See guides/ai_insights.md.'
triggers:
- alias: Morning briefing
  trigger: time
  at: 06:30:00
  id: briefing
- alias: Midday briefing
  trigger: time
  at: '12:00:00'
  id: briefing
- alias: Evening briefing
  trigger: time
  at: '17:00:00'
  id: briefing
- alias: Daily section insights
  trigger: time
  at: '07:00:00'
  id: insights
conditions: []
actions:
- alias: Start the matching generator
  choose:
  - alias: Briefing
    conditions:
    - alias: Briefing time
      condition: trigger
      id: briefing
    sequence:
    - alias: Start the briefing script
      action: script.turn_on
      target:
        entity_id: script.household_ai_briefing
  - alias: Section insights
    conditions:
    - alias: Insights time
      condition: trigger
      id: insights
    sequence:
    - alias: Start the Climate and Energy insight scripts
      action: script.turn_on
      target:
        entity_id:
        - script.household_ai_climate_insight
        - script.household_ai_energy_insight
mode: queued
