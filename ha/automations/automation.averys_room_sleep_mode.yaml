id: '1787016226204'
alias: 'Avery''s Room: Sleep Mode'
description: 'Reacts to the Avery Sleeping toggle. Turning it on turns on the dresser
  lamp (used as a nightlight) and turns off the Living Room Soundbar subwoofer; turning
  it off turns the dresser lamp back off, turns the subwoofer back on, pauses the HomePod,
  and turns on the Living Room Apple TV.'
triggers:
- trigger: state
  entity_id: input_boolean.avery_sleeping
  from: 'off'
  to: 'on'
  id: sleep_on
  alias: Avery Sleeping turned on
- trigger: state
  entity_id: input_boolean.avery_sleeping
  from: 'on'
  to: 'off'
  id: sleep_off
  alias: Avery Sleeping turned off
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - sleep_on
      alias: Triggered by Avery Sleeping turning on
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.averys_room_dresser_lamp
      alias: Turn on dresser lamp
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_soundbar_subwoofer_enabled
      alias: Turn off Living Room Soundbar subwoofer
    alias: Avery Sleeping turned ON — turn on dresser lamp and turn off Living Room Soundbar subwoofer
  - conditions:
    - condition: trigger
      id:
      - sleep_off
      alias: Triggered by Avery Sleeping turning off
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.averys_room_dresser_lamp
      alias: Turn off dresser lamp
    - action: switch.turn_on
      target:
        entity_id: switch.living_room_soundbar_subwoofer_enabled
      alias: Turn on Living Room Soundbar subwoofer
    - action: media_player.media_pause
      target:
        entity_id: media_player.averys_room_homepod
      alias: Pause HomePod
    - action: media_player.turn_on
      target:
        entity_id: media_player.living_room_appletv
      alias: Turn on Living Room Apple TV
    alias: Avery Sleeping turned OFF — turn off dresser lamp, turn on Living Room Soundbar subwoofer, pause HomePod, and turn on Living Room Apple TV
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
