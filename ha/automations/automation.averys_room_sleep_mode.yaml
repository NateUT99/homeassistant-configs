id: '1787016226204'
alias: 'Avery''s Room: Sleep Mode'
description: >-
  Reacts to the Avery Sleeping toggle. Turning it on turns on the dresser lamp
  (nightlight), fades the ceiling fan light off over ~30s, and turns off the
  Living Room Soundbar subwoofer. Turning it off turns the dresser lamp back off,
  turns the subwoofer back on, pauses the HomePod, turns on the Living Room Apple
  TV, fades the ceiling fan light up to 100% over 120s — snapping straight to
  100% if Avery's door opens mid-fade — and clears the Everyone Sleeping flag if
  the household was still marked all-asleep.
triggers:
- trigger: state
  entity_id: input_boolean.avery_sleeping
  from: 'off'
  to: 'on'
  id: sleep_on
  alias: Avery Sleeping turned on
- trigger: state
  entity_id: input_boolean.avery_sleeping
  from: 'on'
  to: 'off'
  id: sleep_off
  alias: Avery Sleeping turned off
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - sleep_on
      alias: Triggered by Avery Sleeping turning on
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.averys_room_dresser_lamp
      alias: Turn on dresser lamp
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_soundbar_subwoofer_enabled
      alias: Turn off Living Room Soundbar subwoofer
    - if:
      - condition: state
        entity_id: light.averys_room_ceiling_fan_light
        state: 'on'
      then:
      - action: light.turn_on
        target:
          entity_id: light.averys_room_ceiling_fan_light
        data:
          brightness_pct: 1
          transition: 30
        alias: Ramp ceiling fan light down to minimum over 30s
        note: >-
          light.turn_off ignores transition on this Matter device (HA sends a
          bare Off; the module then uses its own ~2.5s off ramp). Ramp down with
          turn_on, then cut at the bottom.
      - delay:
          seconds: 30
        alias: Wait out the 30s ramp-down
      - action: light.turn_off
        target:
          entity_id: light.averys_room_ceiling_fan_light
        alias: Cut the ceiling fan light off at the bottom of the ramp
      alias: Fade the ceiling fan light off, only if it is currently on
    alias: Avery Sleeping turned ON — dresser lamp on, subwoofer off, ceiling fan light
      fades off
  - conditions:
    - condition: trigger
      id:
      - sleep_off
      alias: Triggered by Avery Sleeping turning off
    sequence:
    - if:
      - condition: state
        entity_id: input_boolean.everyone_sleeping
        state: 'on'
        alias: Everyone Sleeping is currently on
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.everyone_sleeping
        alias: Clear the Everyone Sleeping flag
      alias: If the household was still marked all-asleep, Avery waking clears it
    - action: light.turn_off
      target:
        entity_id: light.averys_room_dresser_lamp
      alias: Turn off dresser lamp
    - action: switch.turn_on
      target:
        entity_id: switch.living_room_soundbar_subwoofer_enabled
      alias: Turn on Living Room Soundbar subwoofer
    - action: media_player.media_pause
      target:
        entity_id: media_player.averys_room_homepod
      alias: Pause HomePod
    - action: media_player.turn_on
      target:
        entity_id: media_player.living_room_appletv
      alias: Turn on Living Room Apple TV
    - action: light.turn_on
      target:
        entity_id: light.averys_room_ceiling_fan_light
      data:
        brightness_pct: 100
        transition: 120
      alias: Start 120s fade of the ceiling fan light up to 100%
      note: >-
        Runs last in this branch so the quick actions above aren't held up by the
        wait below.
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.averys_room_door
        from: 'off'
        to: 'on'
        alias: Avery's door opens
      timeout:
        seconds: 120
      continue_on_timeout: true
      alias: Wait for Avery's door to open during the fade-up
      note: >-
        Fires only on a genuine closed->open change, so a door already open when
        sleep mode ends does not cut the fade short.
    - if:
      - '{{ wait.completed }}'
      then:
      - action: light.turn_on
        target:
          entity_id: light.averys_room_ceiling_fan_light
        data:
          brightness_pct: 100
          transition: 0
        alias: Snap ceiling fan light straight to 100%
      alias: If the door opened mid-fade, jump to full brightness now
    alias: Avery Sleeping turned OFF — Everyone Sleeping cleared if still on, dresser
      lamp off, subwoofer on, HomePod paused, Apple TV on, ceiling fan light fades up
      (snaps to 100% if the door opens)
mode: restart
category: 01M08R77W9A83G7DDA33MT8R09
