id: "1789476662654"
alias: "Household: Vacuum Live Activity"
description: >-
  Drives the iOS Live Activity for the Roborock vacuum and marks the daytime
  zone done once live progress clears 65%, on every vacuum state/error/
  stuck-sensor change plus a 5-minute tick -- independent of which automation
  commanded the job, since it watches the vacuum's own state rather than any
  zone-specific helper. Running/returning cards and the done card's
  screen-wake are suppressed while everyone is asleep. The stuck branch keys
  off binary_sensor.vacuum_stuck rather than the raw fault sensor, since a
  fault can clear while the vacuum is still mechanically obstructed -- see
  LESSONS.md -> Vacuum & Roborock. See guides/vacuum_cleaning_routine.md and
  guides/live_activities.md.
triggers:
  - alias: Vacuum entered an active or error state
    trigger: state
    entity_id: vacuum.living_room_vacuum
    to: [cleaning, paused, returning, error]
    id: state_change
  - alias: Vacuum left the cleaning state, for any reason
    id: left_cleaning
    trigger: state
    entity_id: vacuum.living_room_vacuum
    from: cleaning
    note: >-
      No to: filter -- catches every destination, including idle, without
      needing to enumerate one we might not have seen yet. Added 2026-09-28
      after a cleaning -> idle transition (still faulted underneath) went
      unnoticed between coarse ticks.
  - alias: Vacuum job finished
    id: job_finished
    trigger: state
    entity_id: vacuum.living_room_vacuum
    from: [cleaning, returning, paused, error, idle]
    to: docked
    note: >-
      idle is included because the dock's post-mop rinse cycle causes a
      brief returning -> idle -> docked blip; without idle here the done
      card never re-fires and the card is left stuck on whatever the blip
      last showed.
  - alias: Vacuum error changed
    trigger: state
    entity_id: sensor.living_room_vacuum_vacuum_error
    id: error_change
  - alias: Stuck status changed
    id: stuck_change
    trigger: state
    entity_id: binary_sensor.vacuum_stuck
    note: >-
      Catches a silent stall -- state stays cleaning the whole time, so
      nothing else here fires when this flips.
  - alias: Coarse progress tick while a job may be active
    trigger: time_pattern
    minutes: "/5"
    id: coarse_tick
    note: >-
      Sent with periodic_tick: true (lower APNs priority) so the card stays
      current without the Dynamic Island re-expanding every 5 minutes; real
      transitions below still send a normal update.
  - alias: Progress crossed 99% -- job is essentially done
    trigger: numeric_state
    entity_id: sensor.living_room_vacuum_cleaning_progress
    above: 99
    id: progress_complete
    note: >-
      Always non-silent, in case this moment lands before the
      returning-transition -- a real trigger, not coarse_tick, so it's
      never silenced.
actions:
  - alias: Mark daytime zone done once live progress clears 65%
    if:
      - condition: state
        entity_id: input_select.vacuum_active_zone
        state: daytime
        alias: Daytime zone commanded the current job
      - condition: numeric_state
        entity_id: sensor.living_room_vacuum_cleaning_progress
        above: 65
        alias: Live progress has cleared 65%
        note: Below 100 because several daytime rooms may have a closed door, capping achievable progress in a way retrying won't fix.
    then:
      - alias: Mark daytime zone ran today
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuum_ran_daytime
    note: >-
      Merged from Household: Vacuum Progress Tracking, reusing this
      automation's own triggers instead of a dedicated progress-sensor
      trigger. Checking live progress at every status transition and the
      5-minute tick is enough on its own -- no stored max needed -- since
      the reset lags the relevant transition by ~20s (LESSONS.md -> Vacuum
      & Roborock) and the write here is sticky once made. Gated to
      daytime: the evening zone's nightly job would otherwise falsely
      satisfy this threshold on a night the daytime zone fell short
      earlier. See guides/vacuum_cleaning_routine.md.
  - alias: Reconcile vacuum live activity from current state
    choose:
      - alias: Vacuum stuck
        conditions:
          - condition: state
            entity_id: binary_sensor.vacuum_stuck
            state: "on"
        sequence:
          - alias: Show stuck card
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: error
              title: "{{ cleaning_type }}"
              message: >-
                {{ 'Vacuum error — ' ~ (vacuum_error | replace('_', ' ') |
                title) if vacuum_error not in ['none', 'unknown',
                'unavailable'] else 'Vacuum stuck — check on it' }}
              icon: mdi:robot-vacuum-alert
      - alias: Cleaning, everyone awake
        conditions:
          - condition: state
            entity_id: vacuum.living_room_vacuum
            state: cleaning
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
        sequence:
          - alias: Show running card
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: running
              title: "{{ cleaning_type }}"
              message: "{{ 'Cleaning · ' ~ current_room if current_room != '' else 'Cleaning' }}"
              icon: mdi:robot-vacuum
              progress: "{{ states('sensor.living_room_vacuum_cleaning_progress') }}"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
            note: >-
              critical_text (area cleaned) deliberately dropped here --
              paired with progress and no chronometer, it displaced the
              progress bar on the actual Lock Screen card instead of staying
              confined to the Dynamic Island as assumed. See LESSONS.md ->
              Live Activities. Area cleaned still surfaces on the done card
              message. Title carries mop-vs-vacuum type (frozen once the
              card is created); message combines status and room. started_at
              (elapsed-time chronometer) was tried here and reverted -- on
              this card it replaced the room in the message slot instead of
              coexisting with it, and the room is the more useful of the
              two. See LESSONS.md -> iOS Live Activities.
      - alias: Paused
        conditions:
          - condition: state
            entity_id: vacuum.living_room_vacuum
            state: paused
        sequence:
          - alias: Show paused card
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: paused
              title: "{{ cleaning_type }}"
              message: "{{ 'Paused · ' ~ current_room if current_room != '' else 'Paused' }}"
              icon: mdi:robot-vacuum
              progress: "{{ states('sensor.living_room_vacuum_cleaning_progress') }}"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: Returning to dock, everyone awake
        conditions:
          - condition: state
            entity_id: vacuum.living_room_vacuum
            state: returning
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
        sequence:
          - alias: Show running card (returning)
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: running
              title: "{{ cleaning_type }}"
              message: "{{ 'Returning to dock · ' ~ current_room if current_room != '' else 'Returning to dock' }}"
              icon: mdi:robot-vacuum
              progress: "{{ states('sensor.living_room_vacuum_cleaning_progress') }}"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: >-
          Just finished — done, but daytime coverage below threshold (will
          restart)
        conditions:
          - condition: trigger
            id: [job_finished]
          - condition: state
            entity_id: input_select.vacuum_active_zone
            state: daytime
          - condition: state
            entity_id: input_boolean.vacuum_ran_daytime
            state: "off"
        sequence:
          - alias: Show done card, amber -- will restart on next departure
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: done
              title: "{{ cleaning_type }}"
              message: >-
                Cleaning finished · {{ vac_area }} m² in {{ vac_minutes }} min
                — will restart when everyone leaves again
              icon: mdi:robot-vacuum
              color: "#FFA726"
              periodic_tick: "{{ is_state('input_boolean.everyone_sleeping', 'on') }}"
            note: >-
              Daytime zone didn't clear the 65% coverage threshold
              (input_boolean.vacuum_ran_daytime still off), so Household:
              Last Leaves Home will command a fresh daytime job on the next
              departure. Amber (the attention hue) distinguishes this from a
              genuinely finished job without introducing a new status --
              status stays done so the bar still forces to 100 and the
              chronometer still drops. periodic_tick while asleep keeps the
              nightly pass's done card from lighting the screen. See
              guides/vacuum_cleaning_routine.md and guides/live_activities.md
              Design Decisions.
      - alias: Just finished — done
        conditions:
          - condition: trigger
            id: [job_finished]
        sequence:
          - alias: Show done card
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: done
              title: "{{ cleaning_type }}"
              message: Cleaning finished · {{ vac_area }} m² in {{ vac_minutes }} min
              icon: mdi:robot-vacuum
              periodic_tick: "{{ is_state('input_boolean.everyone_sleeping', 'on') }}"
            note: >-
              periodic_tick while asleep keeps the nightly pass's done card
              (the common case -- the automatic evening pass finishes while
              everyone is still asleep) from lighting the screen or
              expanding the Dynamic Island.
      - alias: Long since docked — clear the card
        conditions:
          - condition: state
            entity_id: vacuum.living_room_vacuum
            state: docked
            for:
              minutes: 10
        sequence:
          - alias: Clear activity
            action: script.household_live_activity
            data:
              tag: household-vacuum
              status: clear
    default: []
variables:
  vacuum_error: "{{ states('sensor.living_room_vacuum_vacuum_error') }}"
  vac_area: "{{ states('sensor.living_room_vacuum_cleaning_area') }}"
  vac_minutes: "{{ states('sensor.living_room_vacuum_cleaning_time') | float(0) | round(0) | int }}"
  current_room: >-
    {{ states('sensor.living_room_vacuum_current_room') if
    states('sensor.living_room_vacuum_current_room') not in ['unknown',
    'unavailable'] else '' }}
  cleaning_type: >-
    {{ 'Mop & Vacuum' if
    is_state('binary_sensor.living_room_vacuum_mop_attached', 'on') else
    'Vacuum' }}
mode: queued
max: 10
trace:
  stored_traces: 20
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
