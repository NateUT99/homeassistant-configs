id: "1789910712197"
alias: "Household: HVAC Exterior Open Pause"
description: >-
  Turns off the whole-house thermostat when a window or exterior door has
  been open for 3 minutes, and restores the exact prior mode once
  everything has been closed for 3 minutes. Gives an advance TTS warning
  at 2 minutes when the opening is a door (not a window) so someone has a
  chance to close it before the pause -- doors get left open by accident
  far more than windows, which are a deliberate action. The house<->garage
  interior door only counts when the garage overhead door is open too --
  the garage itself is unconditioned and is routinely left open on its own
  (including by Household: Nate Presence on arrival).


  Announces the warning, pause, and restore via script.household_tts_announce
  with target: broadcast, which fans out to kitchen, master bedroom, and
  Avery's room (skipped while input_boolean.avery_sleeping is on) -- office
  is never part of a broadcast -- falling back to a push on its own
  per-target if TTS truly cannot land.


  Stores the mode being paused from in
  input_select.household_hvac_mode_before_pause rather than inferring it
  from current thermostat state, and clears that flag the moment the
  thermostat leaves off by any other route (a manual change, a preset push
  from one of the presence automations) so a stale stored mode can never
  be replayed later.


  Rebuilt from the old apartment's
  automation.household_thermostat_exterior_open_pause, consolidated into
  one automation instead of two -- see LESSONS.md for the
  restoration-branch guard rationale.
triggers:
  - trigger: state
    entity_id: binary_sensor.household_exterior_doors_open
    from: "off"
    to: "on"
    for:
      minutes: 2
    id: door_warning
    alias: Exterior door held open for 2 minutes
  - trigger: state
    entity_id: binary_sensor.household_exterior_open
    from: "off"
    to: "on"
    for:
      minutes: 3
    id: opened
    alias: Exterior opening held open for 3 minutes
  - trigger: state
    entity_id: binary_sensor.household_exterior_open
    from: "on"
    to: "off"
    for:
      minutes: 3
    id: closed
    alias: Exterior opening held closed for 3 minutes
  - trigger: state
    entity_id: climate.living_room_thermostat
    from: "off"
    not_to:
      - unavailable
      - unknown
    id: hvac_resumed
    alias: Thermostat leaves off through some other path
    note: >-
      Catches a manual override or a preset push resuming HVAC mid-pause.
      not_to excludes a Matter reconnect replay (LESSONS.md) from firing
      this.
conditions: []
actions:
  - alias: Dispatch on which trigger fired
    choose:
      - alias: Door open 2 minutes -- advance warning before the pause
        conditions:
          - condition: trigger
            id: door_warning
            alias: Triggered by the door_warning edge
          - condition: not
            alias: Thermostat is not already off
            conditions:
              - condition: state
                entity_id: climate.living_room_thermostat
                state: "off"
        sequence:
          - alias: Determine which door triggered the warning
            note: >-
              Mirrors the pause branch's open_areas_text macro but scoped to
              the two leaf door sensors plus the garage AND-clause -- only
              doors get this advance warning, since windows are a deliberate
              action rather than an accident.
            variables:
              open_doors_text: |-
                {% macro fmt(a) -%}{{ '' if '’' in a else 'the ' }}{{ a }}{%- endmacro %}
                {%- set areas = [] -%}
                {%- if is_state('binary_sensor.entrance_front_door', 'on') -%}{%- set areas = areas + [area_name('binary_sensor.entrance_front_door')] -%}{%- endif -%}
                {%- if is_state('binary_sensor.kitchen_patio_door', 'on') -%}{%- set areas = areas + [area_name('binary_sensor.kitchen_patio_door')] -%}{%- endif -%}
                {%- if is_state('binary_sensor.garage_interior_door', 'on') and is_state('cover.garage_door_opener_door', 'open') -%}{%- set areas = areas + ['Garage'] -%}{%- endif -%}
                {%- set ns = namespace(formatted=[]) -%}
                {%- for a in areas -%}{%- set ns.formatted = ns.formatted + [fmt(a)] -%}{%- endfor -%}
                {%- if ns.formatted | length == 0 -%}
                the door
                {%- elif ns.formatted | length == 1 -%}
                {{ ns.formatted[0] }}
                {%- else -%}
                {{ ns.formatted[:-1] | join(', ') }} and {{ ns.formatted[-1] }}
                {%- endif -%}
          - alias: Announce the advance warning
            action: script.household_tts_announce
            data:
              message: "Thermostat pausing soon — {{ open_doors_text }} door's open."
              target: broadcast
              notification_title: "🚪 Door Open Warning"
      - alias: Opened 3 minutes ago and thermostat not already off
        conditions:
          - condition: trigger
            id: opened
            alias: Triggered by the opened edge
          - condition: not
            alias: Thermostat is not already off
            conditions:
              - condition: state
                entity_id: climate.living_room_thermostat
                state: "off"
        sequence:
          - alias: Remember the mode being paused
            action: input_select.select_option
            target:
              entity_id: input_select.household_hvac_mode_before_pause
            data:
              option: "{{ states('climate.living_room_thermostat') }}"
          - alias: Determine which rooms triggered the pause
            note: >-
              Expands binary_sensor.household_exterior_openings to its leaf
              sensors so this stays correct as members are added later, and
              mirrors binary_sensor.household_exterior_open's own garage
              AND-clause. Possessive area names (Avery's Room) skip the
              leading the.
            variables:
              open_areas_text: |-
                {% macro fmt(a) -%}{{ '' if '’' in a else 'the ' }}{{ a }}{%- endmacro %}
                {%- set areas = expand('binary_sensor.household_exterior_openings')
                   | selectattr('state', 'eq', 'on') | map(attribute='entity_id')
                   | map('area_name') | unique | list -%}
                {%- if is_state('binary_sensor.garage_interior_door', 'on') and is_state('cover.garage_door_opener_door', 'open') -%}
                {%- set areas = areas + ['Garage'] -%}
                {%- endif -%}
                {%- set ns = namespace(formatted=[]) -%}
                {%- for a in areas -%}{%- set ns.formatted = ns.formatted + [fmt(a)] -%}{%- endfor -%}
                {%- if ns.formatted | length == 0 -%}
                the house
                {%- elif ns.formatted | length == 1 -%}
                {{ ns.formatted[0] }}
                {%- elif ns.formatted | length == 2 -%}
                {{ ns.formatted[0] }} and {{ ns.formatted[1] }}
                {%- else -%}
                {{ ns.formatted[:-1] | join(', ') }}, and {{ ns.formatted[-1] }}
                {%- endif -%}
          - alias: Pause the thermostat
            action: climate.set_hvac_mode
            target:
              entity_id: climate.living_room_thermostat
            data:
              hvac_mode: "off"
          - alias: Announce that HVAC has paused
            note: >-
              target: broadcast fans out to kitchen, master bedroom, and
              Avery's room (if awake) -- office excluded -- and falls back
              to a push on its own per-target if TTS truly cannot land.
            action: script.household_tts_announce
            data:
              message: >-
                Thermostat paused — {{ open_areas_text }} is open.{%- if
                is_state('binary_sensor.outside_air_quality_index_high',
                'on') %} Air quality's poor too — {% if
                states('sensor.erie_ohio_usa_air_quality_index') |
                int(0) > 150 %}please keep{% else %}consider
                keeping{% endif %} things closed.{%- endif %}
              target: broadcast
              notification_title: "❌ Thermostat Paused"
      - alias: Closed 3 minutes ago, thermostat off, and a mode was stored
        conditions:
          - condition: trigger
            id: closed
            alias: Triggered by the closed edge
          - condition: state
            entity_id: climate.living_room_thermostat
            state: "off"
            alias: Thermostat is currently off
          - condition: not
            alias: A prior mode was actually stored
            conditions:
              - condition: state
                entity_id: input_select.household_hvac_mode_before_pause
                state: none
        sequence:
          - alias: Capture the mode to restore
            variables:
              paused_from: >-
                {{ states('input_select.household_hvac_mode_before_pause') }}
          - alias: Restore the thermostat's prior mode
            action: climate.set_hvac_mode
            target:
              entity_id: climate.living_room_thermostat
            data:
              hvac_mode: "{{ paused_from }}"
          - alias: Clear the stored mode
            action: input_select.select_option
            target:
              entity_id: input_select.household_hvac_mode_before_pause
            data:
              option: none
          - alias: Announce that HVAC has resumed
            note: >-
              Same broadcast behavior as the pause announcement -- see that
              step's note.
            action: script.household_tts_announce
            data:
              message: >-
                Thermostat re-enabled to {{
                {'cool': 'cool', 'heat': 'heat', 'heat_cool': 'heat
                and cool'}.get(paused_from, paused_from) }}.
              target: broadcast
              notification_title: "✅ Thermostat Re-Enabled"
      - alias: Thermostat left off through some other path
        conditions:
          - condition: trigger
            id: hvac_resumed
            alias: Triggered by the hvac_resumed edge
        sequence:
          - alias: Clear the stale pause flag
            note: >-
              Prevents a later window close from replaying a mode this
              automation didn't actually pause from.
            action: input_select.select_option
            target:
              entity_id: input_select.household_hvac_mode_before_pause
            data:
              option: none
mode: queued
max: 5
category: 01M0BFFGNX30MJNVWS58ZKEH3H
