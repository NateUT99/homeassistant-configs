id: '1787440235668'
alias: 'Utility Room: Door-Triggered Ceiling Lights'
description: Turns the utility room ceiling lights on to 90% when the door opens;
  turns off once the door has been closed for 5s and no motion is detected, waiting
  for motion to clear otherwise.
triggers:
- trigger: door.opened
  target:
    entity_id: binary_sensor.utility_room_door
  id: door_open
  note: Fires immediately when the door opens.
- trigger: door.closed
  target:
    entity_id: binary_sensor.utility_room_door
  id: door_closed
  note: Fires when the door has been continuously closed for 5s, debouncing momentary
    jostles.
  options:
    behavior: each
    for:
      hours: 0
      minutes: 0
      seconds: 5
- trigger: occupancy.cleared
  target:
    entity_id: binary_sensor.utility_room_motion_occupancy
  id: motion_cleared
  note: Fires when motion clears, respecting the sensor's onboard 30s occupied-to-unoccupied
    delay.
actions:
- choose:
  - conditions:
    - condition: trigger
      id: door_open
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.utility_room_ceiling_lights
      data:
        brightness_pct: 90
      alias: Turn on ceiling lights at 90%
    alias: Door opened
  - conditions:
    - condition: trigger
      id: door_closed
    - condition: occupancy.is_not_detected
      target:
        entity_id: binary_sensor.utility_room_motion_occupancy
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.utility_room_ceiling_lights
      alias: Turn off ceiling lights
    alias: Door closed, no motion
  - conditions:
    - condition: trigger
      id: motion_cleared
    - condition: door.is_closed
      target:
        entity_id: binary_sensor.utility_room_door
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.utility_room_ceiling_lights
      alias: Turn off ceiling lights
    alias: Motion cleared, door already closed
  alias: Route on door/motion state
mode: restart
category: 01M08MMBZ719V4GZ2FT10RPTJ2
