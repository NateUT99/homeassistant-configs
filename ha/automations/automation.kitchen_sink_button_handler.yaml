id: "1787508819081"
alias: "Kitchen: Sink Button Handler"
description: >-
  Handles button presses on the kitchen sink remote. Single press turns
  the overhead sink light on at Adaptive Lighting's level, or hands it
  back to AL if already on. Double press forces full brightness, which AL
  then holds as manual control until autoreset. Long press turns it off,
  except during sleep mode, where it hands the light back to AL's sleep
  level instead.
triggers:
  - alias: Short press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: single
    id: short_press
  - alias: Double press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: double
    id: double_press
  - alias: Long press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: hold
    id: long_press
conditions: []
actions:
  - alias: Handle button press
    choose:
      - alias: "Short press: turn on sink light (adaptive lighting)"
        conditions:
          - alias: Trigger was short press
            condition: trigger
            id: ["short_press"]
        sequence:
          - alias: Re-adapt if on, otherwise turn on
            if:
              - alias: Sink light is on
                condition: light.is_on
                target:
                  entity_id: light.kitchen_overhead_sink
                options:
                  behavior: any
                  for: "00:00:00"
            then:
              - alias: Release Adaptive Lighting manual control
                note: >-
                  Undoes a double-press full-brightness override (or any
                  manual change) so AL takes the light back to its current
                  level.
                action: adaptive_lighting.set_manual_control
                data:
                  entity_id: switch.adaptive_lighting_standard
                  lights:
                    - light.kitchen_overhead_sink
                  manual_control: false
            else:
              - alias: Turn on overhead sink light
                note: >-
                  Bare turn_on with no colour/brightness data so AL's
                  adapt_only_on_bare_turn_on adapts it rather than flagging
                  manual control.
                action: light.turn_on
                target:
                  entity_id: light.kitchen_overhead_sink
                data: {}
      - alias: "Double press: force light on to full brightness"
        conditions:
          - alias: Trigger was double press
            condition: trigger
            id: ["double_press"]
        sequence:
          - alias: Turn on overhead sink light to full brightness
            note: >-
              turn_on, not toggle -- a double tap while the light is
              already on but dim should raise it to full. The explicit
              brightness deliberately trips AL's manual-control flag so
              full brightness holds until autoreset or a single press.
            action: light.turn_on
            target:
              entity_id: light.kitchen_overhead_sink
            data:
              brightness_pct: 100
      - alias: "Long press: turn off light or return to sleep mode"
        conditions:
          - alias: Trigger was long press
            condition: trigger
            id: ["long_press"]
        sequence:
          - alias: Return to sleep level if sleeping, otherwise turn off
            if:
              - alias: Household is in sleep mode
                condition: state
                entity_id: input_boolean.everyone_sleeping
                state: "on"
            then:
              - alias: Release Adaptive Lighting manual control
                note: >-
                  During sleep mode the light stays on; releasing the flag
                  lets AL return it to its sleep-mode level.
                action: adaptive_lighting.set_manual_control
                data:
                  entity_id: switch.adaptive_lighting_standard
                  lights:
                    - light.kitchen_overhead_sink
                  manual_control: false
            else:
              - alias: Turn off overhead sink light
                action: light.turn_off
                target:
                  entity_id: light.kitchen_overhead_sink
mode: single
