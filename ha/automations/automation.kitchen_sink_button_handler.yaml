id: "1787508819081"
alias: "Kitchen: Sink Button Handler"
description: >-
  Handles button presses on the kitchen sink remote: single press toggles
  the overhead sink light at 3000K (brightness is left to Adaptive
  Lighting), double press toggles it at full brightness/3000K, and long
  press turns it off.
triggers:
  - alias: Short press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: single
    id: short_press
  - alias: Double press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: double
    id: double_press
  - alias: Long press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:f3:89:be"
      command: hold
    id: long_press
conditions: []
actions:
  - alias: Handle button press
    choose:
      - alias: "Short press: toggle light at 3000K"
        conditions:
          - alias: Trigger was short press
            condition: trigger
            id: ["short_press"]
        sequence:
          - alias: Toggle overhead sink light
            action: light.toggle
            target:
              entity_id: light.kitchen_overhead_sink
            data:
              color_temp_kelvin: 3000
      - alias: "Double press: toggle light to full brightness at 3000K"
        conditions:
          - alias: Trigger was double press
            condition: trigger
            id: ["double_press"]
        sequence:
          - alias: Toggle overhead sink light to full brightness
            action: light.toggle
            target:
              entity_id: light.kitchen_overhead_sink
            data:
              brightness_pct: 100
              color_temp_kelvin: 3000
      - alias: "Long press: turn off light"
        conditions:
          - alias: Trigger was long press
            condition: trigger
            id: ["long_press"]
        sequence:
          - alias: Turn off overhead sink light
            action: light.turn_off
            target:
              entity_id: light.kitchen_overhead_sink
mode: single
