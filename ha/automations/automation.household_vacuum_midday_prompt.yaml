id: "1788805236629"
alias: "Household: Vacuum Midday Prompt"
description: >-
  At 12:00pm, if no one is home, the daytime zone hasn't run today, and this
  isn't already an extended absence (Household: Vacuum Away Catch-Up owns
  that case from 18 hours onward), sends an actionable notification asking
  whether to start the daytime clean. Starts it unless "No" is explicitly
  tapped within 5 minutes -- timeout counts as Yes. Exists because the
  daytime block in Household: Last Leaves Home only fires on a departure
  edge: a departure before 08:00 is blocked by yesterday's still-set
  ran-flag, and one between 08:00-09:00 falls outside that block's time
  window, so either leaves the daytime zone uncleaned all day with no second
  edge to catch it. Tapping "No" here is also how a longer trip is flagged --
  it skips the partial daytime-only clean so the next morning's whole-house
  Away Catch-Up becomes the day's one cleaning cycle. See
  guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time
    at: "12:00:00"
    alias: 12:00pm daily
conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
    alias: No one is home
  - condition: not
    conditions:
      - condition: state
        entity_id: zone.home
        state: "0"
        for:
          hours: 18
    alias: Not yet an extended absence (Away Catch-Up owns that case)
  - condition: state
    entity_id: input_boolean.vacuum_ran_daytime
    state: "off"
    alias: Daytime zone has not run today
  - condition: state
    entity_id: input_boolean.vacuum_routine_pause
    state: "off"
    alias: Vacuum routine is not paused
  - condition: state
    entity_id: binary_sensor.living_room_vacuum_cleaning
    state: "off"
    alias: Vacuum is not currently cleaning
actions:
  - alias: Send actionable notification to Nate's iPhone
    action: notify.mobile_app_nates_iphone
    data:
      title: Vacuum Has Not Cleaned Today
      message: Do you want to start a cleaning cycle?
      data:
        tag: vacuum_midday_prompt
        actions:
          - action: START_VACUUM
            title: "Yes"
          - action: DISMISS_VACUUM
            title: "No"
  - alias: Wait for response or 5-minute timeout
    wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: START_VACUUM
        alias: Yes tapped
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: DISMISS_VACUUM
        alias: No tapped
    timeout:
      minutes: 5
    continue_on_timeout: true
  - alias: Clear notification
    action: notify.mobile_app_nates_iphone
    data:
      message: clear_notification
      data:
        tag: vacuum_midday_prompt
  - alias: Start daytime clean unless explicitly dismissed
    if:
      - condition: template
        value_template: >-
          {{ wait.trigger is none or wait.trigger.event.data.action ==
          'START_VACUUM' }}
        alias: No was not tapped (yes or timeout)
    then:
      - alias: Set active zone to daytime
        action: input_select.select_option
        target:
          entity_id: input_select.vacuum_active_zone
        data:
          option: daytime
      - alias: Set max fan speed for daytime cleaning
        action: vacuum.set_fan_speed
        target:
          entity_id: vacuum.living_room_vacuum
        data:
          fan_speed: max
      - alias: Set medium mop intensity
        action: select.select_option
        target:
          entity_id: select.living_room_vacuum_mop_intensity
        data:
          option: medium
      - alias: Start segment clean of remaining rooms
        action: vacuum.send_command
        target:
          entity_id: vacuum.living_room_vacuum
        data:
          command: app_segment_clean
          params:
            - segments: [16, 17, 18, 19, 20, 21, 26]
              repeat: 1
      - alias: Notify that daytime cleaning started
        action: notify.send_message
        target:
          entity_id: notify.nates_iphone
        data:
          title: Vacuum
          message: Started cleaning remaining rooms.
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
