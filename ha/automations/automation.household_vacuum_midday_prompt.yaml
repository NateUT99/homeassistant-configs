id: "1788805236629"
alias: "Household: Vacuum Midday Prompt"
description: >-
  At noon daily, if no one's home and the daytime zone hasn't run, prompts to
  start a whole-house clean (5-minute timeout counts as Yes). One check
  covers both a missed departure edge and an extended absence, since nothing
  else clears vacuum_ran_daytime. Skipped while the mop pad is attached. See
  guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time
    at: "12:00:00"
    alias: 12:00pm daily
conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
    alias: No one is home
  - condition: state
    entity_id: input_boolean.vacuum_ran_daytime
    state: "off"
    alias: Daytime zone has not run today
  - condition: state
    entity_id: input_boolean.vacuum_routine_pause
    state: "off"
    alias: Vacuum routine is not paused
  - condition: state
    entity_id: vacuum.living_room_vacuum
    state: docked
    alias: Vacuum is docked
    note: "vacuum.start sends a dock command instead of cleaning if the vacuum is returning -- see LESSONS.md."
  - condition: state
    entity_id: binary_sensor.living_room_vacuum_cleaning
    state: "off"
    alias: Vacuum isn't mid-clean
    note: An autonomous recharge also reads docked; this catches that case.
  - condition: state
    entity_id: binary_sensor.living_room_vacuum_mop_attached
    state: "off"
    alias: Mop pad is not attached
    note: A wet pad must not run the carpeted daytime rooms.
actions:
  - alias: Send actionable notification to Nate's iPhone
    action: notify.mobile_app_nates_iphone
    data:
      title: Vacuum Has Not Cleaned Today
      message: Do you want to start a whole-house cleaning cycle?
      data:
        tag: vacuum_midday_prompt
        actions:
          - action: START_VACUUM
            title: "Yes"
          - action: DISMISS_VACUUM
            title: "No"
  - alias: Wait for response or 5-minute timeout
    wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: START_VACUUM
        alias: Yes tapped
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: DISMISS_VACUUM
        alias: No tapped
    timeout:
      minutes: 5
    continue_on_timeout: true
  - alias: Clear notification
    action: notify.mobile_app_nates_iphone
    data:
      message: clear_notification
      data:
        tag: vacuum_midday_prompt
  - alias: Start the whole-house clean unless explicitly dismissed
    if:
      - condition: template
        value_template: >-
          {{ wait.trigger is none or wait.trigger.event.data.action ==
          'START_VACUUM' }}
        alias: No was not tapped (yes or timeout)
    then:
      - alias: Start the whole-house clean
        action: script.household_vacuum_start_job
        data:
          job: whole_house
        response_variable: start
        note: >-
          The script re-checks the vacuum is docked and free, since the
          5-minute wait can outlast either.
      - alias: Continue only if the job started
        condition: template
        value_template: "{{ start.started }}"
      - alias: Mark both zones ran today
        action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.vacuum_ran_daytime
            - input_boolean.vacuum_ran_evening
        note: A whole-house pass covers the evening zone too -- marking both prevents a redundant pass that night.
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
