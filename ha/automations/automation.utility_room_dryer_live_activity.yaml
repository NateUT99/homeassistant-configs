alias: "Utility Room: Dryer Live Activity"
description: >-
  Drives the iOS Live Activity for the dryer. Reconciles the ThinQ status
  sensor and the retrieval input_select into one of running/paused/done/
  error/clear on every status change and every 5 minutes while a cycle is
  active, so the card always reflects live state rather than the edge that
  triggered it. The 5-minute tick sends a periodic_tick refresh (lower APNs
  priority, no Dynamic Island re-expand) on every branch; a genuine
  transition always alerts normally. A fault latches the card in error until
  the input_select leaves fault (cycle restart, retrieval, or manual clear),
  since the underlying status sensor's own error state only lasts 1-2
  seconds — too brief for the card to catch on its own. The done card
  auto-clears after 8 hours if the appliance is never physically retrieved —
  a level-based state condition on the input_select, independent of the TTS
  nag (guides/laundry_automation.md), which keeps its own sleep/away/
  re-engagement guardrails regardless of how long the card has been showing.
triggers:
  - alias: "Dryer cycle status changed"
    trigger: state
    entity_id: sensor.utility_room_dryer_current_status
  - alias: "Retrieval status changed"
    trigger: state
    entity_id: input_select.utility_room_dryer_status
  - alias: "Coarse progress tick while a cycle may be active"
    trigger: time_pattern
    minutes: "/5"
    id: coarse_tick
    note: >-
      Named so live-update branches below can tell a routine refresh from a
      genuine transition and mark it periodic_tick -- see
      script.household_live_activity's field of the same name.
variables:
  dryer_status: "{{ states('sensor.utility_room_dryer_current_status') }}"
  dryer_phase_labels: >-
    {{ {'cooling': 'Cooling Down', 'wrinkle_care': 'Wrinkle Care',
    'running': 'Drying', 'end': 'Cycle Complete', 'power_off': 'Off',
    'error': 'Error', 'initial': 'Ready', 'pause': 'Paused'} }}
  dryer_phase_message: "{{ dryer_phase_labels.get(dryer_status, dryer_status | replace('_', ' ') | title) }}"
  dryer_ends_at: >-
    {{ states('sensor.utility_room_dryer_remaining_time')
    if states('sensor.utility_room_dryer_remaining_time') not in
    ['unknown', 'unavailable'] else '' }}
actions:
  - alias: "Reconcile dryer live activity from current state"
    choose:
      - alias: "Fault latched — show error card"
        note: >-
          input_select reaching fault holds this branch until it leaves
          fault via one of three existing clearing paths (cycle restart,
          sustained occupancy, door open 1 min) — see
          automation.utility_room_dryer_status_manager. Placed first so a
          fault always wins over a stale 'done' or 'running' read on the
          status sensor.
        conditions:
          - condition: state
            entity_id: input_select.utility_room_dryer_status
            state: "fault"
        sequence:
          - alias: "Show error card"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: error
              title: Dryer
              message: "Check the dryer — error reported"
              icon: mdi:tumble-dryer-alert
              color: "#FF7043"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: "Alerting for 8+ hours — clear the card"
        note: >-
          Mirrors the vacuum consumer's dock-and-hold pattern
          (automation.household_vacuum_live_activity) — a level-based state
          condition with for: re-evaluates from live state on every trigger
          (the reconciler design), rather than an edge trigger needing
          separate bookkeeping to stay cleared across the recurring
          5-minute tick. Deliberately leaves input_select untouched — the
          TTS nag (guides/laundry_automation.md) keeps its own sleep/away/
          re-engagement guardrails, unaffected by how long the card has
          been showing. Applies to alerting only, not fault — an unresolved
          fault keeps its card up until someone actually attends to it.
        conditions:
          - condition: state
            entity_id: input_select.utility_room_dryer_status
            state: "alerting"
            for: "08:00:00"
        sequence:
          - alias: "Clear activity"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: clear
      - alias: "Cycle complete — ready to unload"
        conditions:
          - condition: state
            entity_id: input_select.utility_room_dryer_status
            state: "alerting"
        sequence:
          - alias: "Show done card"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: done
              title: Dryer
              message: "Cycle complete — ready to unload"
              icon: mdi:tumble-dryer
              color: "#FF7043"
              critical_text: "Done"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: "Dryer error"
        conditions:
          - condition: state
            entity_id: sensor.utility_room_dryer_current_status
            state: "error"
        sequence:
          - alias: "Show error card"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: error
              title: Dryer
              message: "Check the dryer — error reported"
              icon: mdi:tumble-dryer-alert
              color: "#FF7043"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: "Dryer paused"
        conditions:
          - condition: state
            entity_id: sensor.utility_room_dryer_current_status
            state: "pause"
        sequence:
          - alias: "Show paused card"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: paused
              title: Dryer
              message: "Paused"
              icon: mdi:tumble-dryer
              color: "#FF7043"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: "Dryer actively cycling"
        conditions:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.utility_room_dryer_current_status
                state: ["end", "pause", "power_off", "error", "initial"]
        sequence:
          - alias: "Show running card"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: running
              title: Dryer
              message: "{{ dryer_phase_message }}"
              icon: mdi:tumble-dryer
              color: "#FF7043"
              progress: "{{ states('sensor.utility_room_dryer_progress') }}"
              ends_at: "{{ dryer_ends_at }}"
              periodic_tick: "{{ trigger.id == 'coarse_tick' }}"
      - alias: "Retrieved — clear the card"
        conditions:
          - condition: state
            entity_id: input_select.utility_room_dryer_status
            state: "idle"
        sequence:
          - alias: "Clear activity"
            action: script.household_live_activity
            data:
              tag: utility-room-dryer
              status: clear
    default: []
mode: queued
max: 10
