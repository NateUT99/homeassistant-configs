id: "1788920021778"
alias: "Household: Ceiling Fan Switch LED Locator"
description: >-
  Keeps the three Inovelli ceiling-fan switch LED bars in sync with
  presence and day/night dimming by recomputing each affected room via
  its script.<prefix>_ceiling_fan_led_state. Every switch shows something
  whenever someone is home (the running fan's speed colour, or a white
  locator glow when idle), dimmer at night than during the day, dark only
  when nobody is home - identically in Office, Master Bedroom, and
  Avery's Room. Household-wide triggers (presence,
  input_boolean.everyone_sleeping) recompute all three rooms. Avery's
  personal input_boolean.avery_sleeping additionally recomputes just her
  room, since her room should dim as soon as she goes to bed even if the
  rest of the household is still awake - binary_sensor.avery_home_today
  plays no part in this feature. Fires 30s after HA start to let Matter
  settle.
triggers:
  - alias: HA started
    trigger: homeassistant
    event: start
    id: ha_started
  - alias: Someone enters the home zone
    trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: someone_home
  - alias: Last person leaves the home zone
    trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: nobody_home
  - alias: Everyone goes to sleep
    trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_on
  - alias: Everyone wakes up
    trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
  - alias: Avery goes to sleep
    trigger: switch.turned_on
    target:
      entity_id: input_boolean.avery_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: avery_sleep_on
  - alias: Avery wakes up
    trigger: switch.turned_off
    target:
      entity_id: input_boolean.avery_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: avery_sleep_off
conditions: []
actions:
  - alias: Delay on startup to let Matter settle
    if:
      - condition: trigger
        id:
          - ha_started
        alias: Triggered by HA start
    then:
      - delay:
          seconds: 30
        alias: Wait 30 seconds for Matter to settle
  - alias: Route by trigger
    choose:
      - alias: Household-wide presence or sleep change - recompute all three rooms
        conditions:
          - condition: trigger
            id:
              - ha_started
              - someone_home
              - nobody_home
              - sleep_on
              - sleep_off
            alias: Triggered by HA start, presence, or everyone-sleeping
        sequence:
          - alias: Office
            action: script.office_ceiling_fan_led_state
          - alias: Master Bedroom
            action: script.master_bedroom_ceiling_fan_led_state
          - alias: Avery's Room
            action: script.averys_room_ceiling_fan_led_state
      - alias: Avery-specific sleep change - recompute her room only
        conditions:
          - condition: trigger
            id:
              - avery_sleep_on
              - avery_sleep_off
            alias: Triggered by Avery's personal sleep flag
        sequence:
          - alias: Avery's Room
            action: script.averys_room_ceiling_fan_led_state
mode: queued
max: 5
category: 01M08MMBZ719V4GZ2FT10RPTJ2
