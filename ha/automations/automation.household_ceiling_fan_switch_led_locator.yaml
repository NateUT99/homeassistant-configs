id: "1788920021778"
alias: "Household: Ceiling Fan Switch LED Locator"
description: >-
  Keeps the four Inovelli ceiling-fan switch RGB Indicator LED bars in
  sync with presence via script.household_ceiling_fan_led_state (shared across all
  four canopy switches). Every switch shows the running fan's speed
  colour, a white locator glow when idle, or dark when nobody's home.
  Household-wide triggers (presence, HA start) recompute all four rooms.
  input_boolean.everyone_sleeping additionally recomputes Master Bedroom
  only, and input_boolean.avery_sleeping recomputes Avery's Room only --
  each bedroom's own sleep flag gates whether its bar settles from the
  speed colour to the locator glow 30s after the last change (see
  script.household_ceiling_fan_led_state). Office and Living Room have no sleep gating. Fires 30s
  after HA start to let Matter settle.
triggers:
  - alias: HA started
    trigger: homeassistant
    event: start
    id: ha_started
  - alias: Someone enters the home zone
    trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: someone_home
  - alias: Last person leaves the home zone
    trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: nobody_home
  - alias: Everyone goes to sleep
    trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_on
  - alias: Everyone wakes up
    trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
  - alias: Avery goes to sleep
    trigger: switch.turned_on
    target:
      entity_id: input_boolean.avery_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: avery_sleep_on
  - alias: Avery wakes up
    trigger: switch.turned_off
    target:
      entity_id: input_boolean.avery_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: avery_sleep_off
conditions: []
actions:
  - alias: Delay on startup to let Matter settle
    if:
      - condition: trigger
        id:
          - ha_started
        alias: Triggered by HA start
    then:
      - delay:
          seconds: 30
        alias: Wait 30 seconds for Matter to settle
  - alias: Route by trigger
    choose:
      - alias: Household-wide presence change - recompute all four rooms
        conditions:
          - condition: trigger
            id:
              - ha_started
              - someone_home
              - nobody_home
            alias: Triggered by HA start or presence
        sequence:
          - alias: Office
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.office_ceiling_fan
              led_bar_entity: light.office_ceiling_fan_switch_led_bar
              light_entity: light.office_ceiling_fan_light
          - alias: Master Bedroom
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.master_bedroom_ceiling_fan
              led_bar_entity: light.master_bedroom_ceiling_fan_switch_led_bar
              sleeping_boolean: input_boolean.everyone_sleeping
              light_entity: light.master_bedroom_ceiling_fan_light
          - alias: Avery's Room
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.averys_room_ceiling_fan
              led_bar_entity: light.averys_room_ceiling_fan_switch_led_bar
              sleeping_boolean: input_boolean.avery_sleeping
              light_entity: light.averys_room_ceiling_fan_light
          - alias: Living Room
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.living_room_ceiling_fan
              led_bar_entity: light.living_room_ceiling_fan_switch_led_bar
              light_entity: light.living_room_ceiling_fan_light
      - alias: Avery-specific sleep change - recompute her room only
        conditions:
          - condition: trigger
            id:
              - avery_sleep_on
              - avery_sleep_off
            alias: Triggered by Avery's personal sleep flag
        sequence:
          - alias: Avery's Room
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.averys_room_ceiling_fan
              led_bar_entity: light.averys_room_ceiling_fan_switch_led_bar
              sleeping_boolean: input_boolean.avery_sleeping
              light_entity: light.averys_room_ceiling_fan_light
      - alias: Master Bedroom sleep change - recompute her room only
        conditions:
          - condition: trigger
            id:
              - sleep_on
              - sleep_off
            alias: Triggered by Master Bedroom's sleep flag
        sequence:
          - alias: Master Bedroom
            action: script.household_ceiling_fan_led_state
            data:
              fan_entity: fan.master_bedroom_ceiling_fan
              led_bar_entity: light.master_bedroom_ceiling_fan_switch_led_bar
              sleeping_boolean: input_boolean.everyone_sleeping
              light_entity: light.master_bedroom_ceiling_fan_light
mode: queued
max: 5
category: 01M08MMBZ719V4GZ2FT10RPTJ2
