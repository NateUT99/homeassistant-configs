id: '1787015780837'
alias: 'Household: Nate Presence'
description: 'Nate-specific arrival and departure actions.


  - **Arrival:** disables guest mode, then opens the garage door only when Nate was
  away for more than 5 minutes AND a driving signal appears within 15 seconds: the
  CarPlay helper (set by an iOS Shortcut), iPhone activity Automotive, or iPhone audio
  output CarPlay. This suppresses brief geofence flaps and walks. The auto-open is a
  convenience, not a guarantee; the garage can always be opened manually from the
  CarPlay button or Apple Home.

  - **Departure:** trigger is wired but disabled — no actions yet. Re-enable and populate
  the sequence when departure logic is needed.'
triggers:
- trigger: state
  entity_id: person.nate
  from: home
  to: not_home
  for:
    seconds: 30
  id: away
  alias: Nate left home
  enabled: false
- trigger: state
  entity_id: person.nate
  from: not_home
  to: home
  id: home
  alias: Nate arrived home
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - away
      alias: Triggered by Nate leaving home
    sequence: []
    alias: Nate left home — no actions
  - conditions:
    - condition: trigger
      id:
      - home
      alias: Triggered by Nate arriving home
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.guest_mode
      alias: Disable Guest Mode
    - condition: template
      value_template: '{{ trigger.from_state is not none and (now() - trigger.from_state.last_changed).total_seconds()
        > 300 }}'
      alias: Nate was away for more than 5 minutes
    - wait_template: '{{ is_state(''input_boolean.nate_carplay'', ''on'') or is_state(''sensor.nates_iphone_activity'',
        ''Automotive'') or is_state(''sensor.nates_iphone_audio_output'', ''CarPlay'') }}'
      timeout:
        seconds: 15
      continue_on_timeout: false
      alias: Wait for a driving signal
      note: Any one of three signals. The CarPlay helper is set by an iOS Shortcut when
        CarPlay connects, so it's usually on before the arrival edge and passes at once.
        Activity and audio output arrive ~100 ms after the zone change (see LESSONS.md),
        which the 15 s wait covers.
    - action: cover.open_cover
      target:
        entity_id: cover.garage_door_opener_door
      alias: Open the Garage Door
    alias: Nate arrived home
mode: single
category: 01M08R77W9A83G7DDA33MT8R09
