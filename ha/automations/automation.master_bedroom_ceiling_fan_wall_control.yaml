id: "1788029698556"
alias: "Master Bedroom: Ceiling Fan Wall Control"
description: >-
  Single wall-control automation for the Master Bedroom ceiling fan (VTM36 canopy
  + VTM30-SN switch), covering the three links that don't run over the Matter
  binding. Config button: single tap resumes the last speed (fan off) or advances
  low->medium->high->low (fan on); double tap turns it off; holds are unmapped.
  Fan speed changes (the percentage attribute, so the value is settled) repaint
  the switch LED bar (hue by speed, off when the fan is off) and store the running
  speed in input_select.master_bedroom_ceiling_fan_last_speed. While everyone is
  sleeping the bar rests dark and only blips to confirm a change - the speed's
  hue for 3s, amber for 1s when the fan is switched off - via
  script.master_bedroom_ceiling_fan_led_blip. None of this works while HA is
  down; paddle -> light on/off is a Matter binding and is independent.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
    not_to:
      - unavailable
      - unknown
    id: config
  - alias: Fan speed settled (percentage attribute changed)
    trigger: state
    entity_id: fan.master_bedroom_ceiling_fan
    attribute: percentage
    id: fan
  - alias: Everyone Sleeping changed
    trigger: state
    entity_id: input_boolean.everyone_sleeping
    not_to:
      - unavailable
      - unknown
    id: sleep
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Config button
        conditions:
          - condition: trigger
            id: config
            alias: Triggered by the config button
          - alias: Ignore the duplicate event the config button fires ~8ms after a tap
            condition: template
            value_template: "{{ trigger.from_state is none or (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() > 0.3 }}"
        sequence:
          - alias: Route by gesture
            choose:
              - alias: Single tap
                conditions:
                  - condition: state
                    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_1
                    alias: Single tap
                sequence:
                  - alias: Resume last speed if off, otherwise advance the cycle
                    if:
                      - condition: state
                        entity_id: fan.master_bedroom_ceiling_fan
                        state: "off"
                        alias: Fan currently off
                    then:
                      - alias: Turn fan on to the remembered speed
                        action: fan.set_percentage
                        target:
                          entity_id: fan.master_bedroom_ceiling_fan
                        data:
                          percentage: "{% set s = states('input_select.master_bedroom_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
                    else:
                      - alias: Advance low -> medium -> high -> low
                        note: "Wide bands absorb Matter fan percentage rounding: low~33, medium~66, high~100."
                        action: fan.set_percentage
                        target:
                          entity_id: fan.master_bedroom_ceiling_fan
                        data:
                          percentage: "{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{{ 66 if p < 45 else (100 if p < 78 else 33) }}"
              - alias: Double tap - off
                conditions:
                  - condition: state
                    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_2
                    alias: Double tap
                sequence:
                  - alias: Turn the ceiling fan off
                    action: fan.turn_off
                    target:
                      entity_id: fan.master_bedroom_ceiling_fan
      - alias: Fan or sleep changed - sync LED bar and speed memory
        conditions:
          - condition: trigger
            id:
              - fan
              - sleep
            alias: Triggered by the fan or the sleep toggle
        sequence:
          - alias: Resolve the current speed band
            variables:
              speed: "{% if is_state('fan.master_bedroom_ceiling_fan', 'off') %}off{% else %}{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{% if p < 45 %}low{% elif p < 78 %}medium{% else %}high{% endif %}{% endif %}"
          - alias: Record the running speed for resume-last-speed
            if:
              - condition: state
                entity_id: fan.master_bedroom_ceiling_fan
                state: "on"
                alias: Fan is on
            then:
              - alias: Store speed name
                action: input_select.select_option
                target:
                  entity_id: input_select.master_bedroom_ceiling_fan_last_speed
                data:
                  option: "{{ speed }}"
          - alias: Sync the LED bar to the fan
            choose:
              - alias: Sleeping - bar rests dark, a fan change only blips it
                conditions:
                  - condition: state
                    entity_id: input_boolean.everyone_sleeping
                    state: "on"
                    alias: Everyone is sleeping
                sequence:
                  - alias: Blip on a fan change, otherwise just make sure the bar is dark
                    choose:
                      - alias: Fan changed (not the sleep toggle) - fire the blip
                        conditions:
                          - condition: trigger
                            id: fan
                            alias: Triggered by the fan, not the sleep toggle
                        sequence:
                          - alias: Blip the bar (hue 3s for a speed, amber 1s for off) and return
                            action: script.turn_on
                            target:
                              entity_id: script.master_bedroom_ceiling_fan_led_blip
                    default:
                      - alias: Sleep just turned on - cancel any pending blip and darken the bar
                        action: script.turn_off
                        target:
                          entity_id: script.master_bedroom_ceiling_fan_led_blip
                      - alias: Turn the LED bar off
                        action: light.turn_off
                        target:
                          entity_id: light.master_bedroom_ceiling_fan_switch_led
              - alias: Awake, fan off - bar dark
                conditions:
                  - condition: state
                    entity_id: fan.master_bedroom_ceiling_fan
                    state: "off"
                    alias: Fan off
                sequence:
                  - alias: Cancel any pending blip so its trailing turn-off cannot land late
                    action: script.turn_off
                    target:
                      entity_id: script.master_bedroom_ceiling_fan_led_blip
                  - alias: Turn the LED bar off
                    action: light.turn_off
                    target:
                      entity_id: light.master_bedroom_ceiling_fan_switch_led
            default:
              - alias: Cancel any pending blip so its trailing turn-off cannot land late
                action: script.turn_off
                target:
                  entity_id: script.master_bedroom_ceiling_fan_led_blip
              - alias: Awake, fan on - colour the bar by speed at full brightness
                note: "Matter exposes the bar as one RGB light (no per-segment control): hue low teal 175, medium blue 220, high violet 265; brightness a flat 50. The old 1%-when-sleeping dim is gone - at night the bar is dark at rest and only blips on a change (see the Sleeping branch)."
                action: light.turn_on
                target:
                  entity_id: light.master_bedroom_ceiling_fan_switch_led
                data:
                  brightness_pct: 50
                  hs_color:
                    - "{{ {'low': 175, 'medium': 220, 'high': 265}.get(speed, 220) }}"
                    - 100
mode: queued
max: 10
category: 01M0BFFGNX30MJNVWS58ZKEH3H
