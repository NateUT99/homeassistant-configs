id: "1788029698556"
alias: "Master Bedroom: Ceiling Fan Wall Control"
description: >-
  Single wall-control automation for the Master Bedroom ceiling fan (VTM36 canopy
  + VTM30-SN switch), covering the links that don't run over the Matter binding.
  Down paddle hold turns the fan and light off; up paddle hold turns the fan on
  to the last speed and the light on; each hold also blips the LED bar. Config
  button: single tap resumes the last speed (fan off) or advances
  low->medium->high->low (fan on); double tap turns it off; triple tap shows the
  current speed without changing it. A settled
  fan-speed change (the percentage attribute) stores the running speed in
  input_select.master_bedroom_ceiling_fan_last_speed and blips the switch LED bar
  via script.master_bedroom_ceiling_fan_led_blip - the speed's hue for 3s, amber
  plus a Fast Falling animation when the fan is switched off. The bar rests dark
  at all times; before each blip the automation snapshots the RGB bar and the
  LED-effect select into scene.master_bedroom_ceiling_fan_led_restore so the blip
  restores whatever it was showing (dark today; a future status colour
  transparently). None of this works while HA is down; paddle tap -> light on/off
  is a Matter binding (cluster 6) and is independent.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
    not_to:
      - unavailable
      - unknown
    id: config
  - alias: Fan speed settled (percentage attribute changed)
    trigger: state
    entity_id: fan.master_bedroom_ceiling_fan
    attribute: percentage
    id: fan
  - alias: Down paddle hold
    trigger: state
    entity_id: event.master_bedroom_ceiling_fan_switch_button_down
    not_to:
      - unavailable
      - unknown
    id: down_hold
  - alias: Up paddle hold
    trigger: state
    entity_id: event.master_bedroom_ceiling_fan_switch_button_up
    not_to:
      - unavailable
      - unknown
    id: up_hold
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Config button
        conditions:
          - condition: trigger
            id: config
            alias: Triggered by the config button
          - alias: Ignore the duplicate event the config button fires ~8ms after a tap
            condition: template
            value_template: "{{ trigger.from_state is none or (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() > 0.3 }}"
        sequence:
          - alias: Route by gesture
            choose:
              - alias: Single tap
                conditions:
                  - condition: state
                    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_1
                    alias: Single tap
                sequence:
                  - alias: Resume last speed if off, otherwise advance the cycle
                    if:
                      - condition: state
                        entity_id: fan.master_bedroom_ceiling_fan
                        state: "off"
                        alias: Fan currently off
                    then:
                      - alias: Turn fan on to the remembered speed
                        action: fan.set_percentage
                        target:
                          entity_id: fan.master_bedroom_ceiling_fan
                        data:
                          percentage: "{% set s = states('input_select.master_bedroom_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
                    else:
                      - alias: Advance low -> medium -> high -> low
                        note: "Wide bands absorb Matter fan percentage rounding: low~33, medium~66, high~100."
                        action: fan.set_percentage
                        target:
                          entity_id: fan.master_bedroom_ceiling_fan
                        data:
                          percentage: "{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{{ 66 if p < 45 else (100 if p < 78 else 33) }}"
              - alias: Double tap - off
                conditions:
                  - condition: state
                    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_2
                    alias: Double tap
                sequence:
                  - alias: Turn the ceiling fan off
                    action: fan.turn_off
                    target:
                      entity_id: fan.master_bedroom_ceiling_fan
              - alias: Triple tap - show the current speed without changing it
                conditions:
                  - condition: state
                    entity_id: event.master_bedroom_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_3
                    alias: Triple tap
                sequence:
                  - alias: Snapshot the bar's resting state, unless a blip is already in flight
                    note: >-
                      Guarded because the blip script is mode:restart - snapshotting
                      mid-burst would capture the blip's own colour as the resting
                      state and leave the bar stuck lit.
                    if:
                      - alias: No blip in flight
                        condition: state
                        entity_id: script.master_bedroom_ceiling_fan_led_blip
                        state: "off"
                    then:
                      - alias: Snapshot the LED bar so the blip can put it back
                        action: scene.create
                        data:
                          scene_id: master_bedroom_ceiling_fan_led_restore
                          snapshot_entities:
                            - light.master_bedroom_ceiling_fan_switch_led
                            - select.master_bedroom_ceiling_fan_switch_led_effect
                  - alias: Blip the bar to show the current speed (no fan change)
                    action: script.turn_on
                    target:
                      entity_id: script.master_bedroom_ceiling_fan_led_blip
      - alias: Down paddle held - turn the fan and light off
        conditions:
          - condition: trigger
            id: down_hold
            alias: Triggered by the down paddle
          - alias: Gesture was a hold, not a tap
            condition: state
            entity_id: event.master_bedroom_ceiling_fan_switch_button_down
            attribute: event_type
            state: long_press
        sequence:
          - alias: Turn the ceiling fan off
            action: fan.turn_off
            target:
              entity_id: fan.master_bedroom_ceiling_fan
          - alias: Turn the fan light off
            action: light.turn_off
            target:
              entity_id: light.master_bedroom_ceiling_fan_light
          - alias: Blip the bar amber when the fan was already off
            note: >-
              If the fan was running, fan.turn_off drives the percentage trigger
              and that branch blips amber; if it was already off there is no fan
              change to blip on, so acknowledge here. The fan entity still reads
              its pre-call state here (Matter round-trip lag), which is exactly
              the "was it already off?" test wanted. Snapshot guarded like the
              other branches so a burst snapshots once.
            if:
              - alias: Fan was already off - no percentage blip coming
                condition: state
                entity_id: fan.master_bedroom_ceiling_fan
                state: "off"
            then:
              - alias: Snapshot the bar's resting state, unless a blip is already in flight
                if:
                  - alias: No blip in flight
                    condition: state
                    entity_id: script.master_bedroom_ceiling_fan_led_blip
                    state: "off"
                then:
                  - alias: Snapshot the LED bar so the blip can put it back
                    action: scene.create
                    data:
                      scene_id: master_bedroom_ceiling_fan_led_restore
                      snapshot_entities:
                        - light.master_bedroom_ceiling_fan_switch_led
                        - select.master_bedroom_ceiling_fan_switch_led_effect
              - alias: Blip the bar (fan off -> amber + Fast Falling)
                action: script.turn_on
                target:
                  entity_id: script.master_bedroom_ceiling_fan_led_blip
      - alias: Up paddle held - turn the fan and light on
        conditions:
          - condition: trigger
            id: up_hold
            alias: Triggered by the up paddle
          - alias: Gesture was a hold, not a tap
            condition: state
            entity_id: event.master_bedroom_ceiling_fan_switch_button_up
            attribute: event_type
            state: long_press
        sequence:
          - alias: Turn the fan on to the remembered speed
            action: fan.set_percentage
            target:
              entity_id: fan.master_bedroom_ceiling_fan
            data:
              percentage: "{% set s = states('input_select.master_bedroom_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
          - alias: Turn the fan light on
            action: light.turn_on
            target:
              entity_id: light.master_bedroom_ceiling_fan_light
          - alias: Blip the bar with the speed hue when the fan was already running
            note: >-
              If the fan was off, spinning it up drives the percentage trigger
              and that branch blips the speed hue; if it was already on there is
              no reliable percentage change, so acknowledge here. The fan entity
              still reads its pre-call state (Matter lag), which is the "was it
              already on?" test wanted. Snapshot guarded so a burst snapshots
              once.
            if:
              - alias: Fan was already on - no percentage blip coming
                condition: state
                entity_id: fan.master_bedroom_ceiling_fan
                state: "on"
            then:
              - alias: Snapshot the bar's resting state, unless a blip is already in flight
                if:
                  - alias: No blip in flight
                    condition: state
                    entity_id: script.master_bedroom_ceiling_fan_led_blip
                    state: "off"
                then:
                  - alias: Snapshot the LED bar so the blip can put it back
                    action: scene.create
                    data:
                      scene_id: master_bedroom_ceiling_fan_led_restore
                      snapshot_entities:
                        - light.master_bedroom_ceiling_fan_switch_led
                        - select.master_bedroom_ceiling_fan_switch_led_effect
              - alias: Blip the bar (speed hue for 3s)
                action: script.turn_on
                target:
                  entity_id: script.master_bedroom_ceiling_fan_led_blip
      - alias: Fan speed settled - record it and blip the LED bar
        conditions:
          - condition: trigger
            id: fan
            alias: Triggered by the fan
        sequence:
          - alias: Resolve the current speed band
            variables:
              speed: "{% if is_state('fan.master_bedroom_ceiling_fan', 'off') %}off{% else %}{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{% if p < 45 %}low{% elif p < 78 %}medium{% else %}high{% endif %}{% endif %}"
          - alias: Record the running speed for resume-last-speed
            if:
              - condition: state
                entity_id: fan.master_bedroom_ceiling_fan
                state: "on"
                alias: Fan is on
            then:
              - alias: Store speed name
                action: input_select.select_option
                target:
                  entity_id: input_select.master_bedroom_ceiling_fan_last_speed
                data:
                  option: "{{ speed }}"
          - alias: Snapshot the bar's resting state, unless a blip is already in flight
            note: >-
              Guarded because the blip script is mode:restart - snapshotting
              mid-burst would capture the blip's own colour as the resting state
              and leave the bar stuck lit.
            if:
              - alias: No blip in flight
                condition: state
                entity_id: script.master_bedroom_ceiling_fan_led_blip
                state: "off"
            then:
              - alias: Snapshot the LED bar so the blip can put it back
                action: scene.create
                data:
                  scene_id: master_bedroom_ceiling_fan_led_restore
                  snapshot_entities:
                    - light.master_bedroom_ceiling_fan_switch_led
                    - select.master_bedroom_ceiling_fan_switch_led_effect
          - alias: Blip the bar (speed hue 3s, amber + fall for off), then it restores itself
            action: script.turn_on
            target:
              entity_id: script.master_bedroom_ceiling_fan_led_blip
mode: queued
max: 10
category: 01M0BFFGNX30MJNVWS58ZKEH3H
