alias: "Household: Configure Home for Wake"
description: >-
  Restores the home when everyone wakes up: sets the living room thermostat
  back to Home preset. Fires when Everyone Sleeping turns off. Mirrors
  Household: Configure Home for Sleep, which prepares the home at bedtime;
  wake-time actions land here as they come up.
triggers:
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: "00:00:00"
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - alias: Set living room thermostat to Home preset
    action: climate.set_preset_mode
    target:
      entity_id: climate.living_room_thermostat
    data:
      preset_mode: home
mode: single
