id: "1787749813103"
alias: "Utility Room: Washer Status Manager"
description: >-
  Tracks the washer's alerting/idle/acknowledged/fault state. Sets alerting
  when a cycle ends (state or event trigger, whichever arrives first), fault
  when the washer reports an error (typed error event or the generic error
  notification, whichever arrives first), idle when a new cycle starts, and
  idle when the washer is retrieved (utility room occupancy detected, or a
  door left open a full minute as backup). A fault overrides an existing
  alerting status; either clears the same way.
triggers:
  - trigger: state
    entity_id: sensor.utility_room_washer_current_status
    to: end
    id: cycle_end_state
    alias: "Cycle ended (status sensor)"
  - trigger: state
    entity_id: event.utility_room_washer_notification
    id: cycle_end_event
    alias: "Washer notification event fired"
    note: >-
      Backup for the state trigger — sensor.utility_room_washer_current_status
      sits in 'end' for only ~30-45s before moving to power_off, a narrow
      window to catch. Also carries the error_during_washing branch below,
      since this same event entity fires on both washing_is_complete and
      error_during_washing. Guarded by a recency condition since event
      entities re-fire this trigger on every HA restart with their last
      (possibly stale) value.
  - trigger: state
    entity_id: sensor.utility_room_washer_current_status
    to: running
    id: cycle_start
    alias: "New cycle started"
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.utility_room_motion_sensor_occupancy
    id: retrieved
    alias: "Sustained occupancy (retrieved)"
    note: >-
      15s filters PIR noise (pet, glitch, HVAC draft) without the gap a
      stricter door-open+occupancy AND would have: this door gets left open
      for hours at a stretch in this house, so requiring a fresh door-open
      edge to pair with occupancy would miss a retrieval where the door was
      already open when someone walked in. Kept as an independent OR with the
      door-open backup below, not combined with it. Also clears an unrelated
      appliance's alert if only one is alerting and someone tends the other,
      since both status managers watch the same door/occupancy sensors — see
      guides/laundry_automation.md.
    options:
      for: "00:00:15"
  - trigger: door.opened
    target:
      entity_id: binary_sensor.utility_room_door
    options:
      for: "00:01:00"
    id: retrieved
    alias: "Door left open a full minute (retrieved)"
    note: >-
      Backup for when the PIR is unavailable. Also closes a gap the old
      door-edge design missed: a cycle finishing while the door happens to
      already be open never produced an edge.
  - trigger: event.received
    target:
      entity_id: event.utility_room_washer_error
    options:
      event_type:
        - power_fail_error
        - door_open_error
        - locked_motor_error
        - water_supply_error
        - water_level_sensor_error
        - unable_to_lock_error
        - water_drain_error
        - overfill_error
        - out_of_balance_error
        - temperature_sensor_error
    id: fault_error
    alias: "Washer reported a typed fault"
    note: >-
      Filter lists every event_type this entity currently exposes
      (options.event_type is required by the trigger schema, so "catch
      everything" means enumerating the full list rather than omitting the
      filter) — all of them are faults. A firmware-added code would need this
      list extended; see LESSONS.md if diagnosing a fault that never
      announced. event.received does not fire on the unavailable/unknown
      transitions a raw state trigger would, but still replays its last value
      across a restart like any event entity, so it's guarded by the same
      5-minute recency condition as the notification-event branches below.
conditions: []
actions:
  - alias: "Route on trigger and current status"
    choose:
      - alias: "Cycle ended (state), currently idle"
        conditions:
          - condition: trigger
            id: cycle_end_state
          - condition: state
            entity_id: input_select.utility_room_washer_status
            state: idle
        sequence:
          - alias: "Set status to alerting"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: alerting
          - alias: "Stamp cycle ended time"
            action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.utility_room_washer_cycle_ended
            data:
              datetime: "{{ now() }}"
      - alias: "Cycle ended (event), currently idle, event is recent"
        conditions:
          - condition: trigger
            id: cycle_end_event
          - condition: state
            entity_id: event.utility_room_washer_notification
            attribute: event_type
            state: washing_is_complete
          - condition: state
            entity_id: input_select.utility_room_washer_status
            state: idle
          - condition: template
            value_template: >-
              {{ (now() -
              (states('event.utility_room_washer_notification') |
              as_datetime)).total_seconds() < 300 }}
            alias: "Event happened within the last 5 minutes, not a restart-restore"
        sequence:
          - alias: "Set status to alerting"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: alerting
          - alias: "Stamp cycle ended time"
            action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.utility_room_washer_cycle_ended
            data:
              datetime: "{{ now() }}"
      - alias: "Fault reported (generic notification event), event is recent"
        conditions:
          - condition: trigger
            id: cycle_end_event
          - condition: state
            entity_id: event.utility_room_washer_notification
            attribute: event_type
            state: error_during_washing
          - condition: template
            value_template: >-
              {{ (now() -
              (states('event.utility_room_washer_notification') |
              as_datetime)).total_seconds() < 300 }}
            alias: "Event happened within the last 5 minutes, not a restart-restore"
        sequence:
          - alias: "Set status to fault"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: fault
      - alias: "Fault reported (typed error event), event is recent"
        conditions:
          - condition: trigger
            id: fault_error
          - condition: template
            value_template: >-
              {{ (now() - (states('event.utility_room_washer_error') |
              as_datetime)).total_seconds() < 300 }}
            alias: "Event happened within the last 5 minutes, not a restart-restore"
        sequence:
          - alias: "Set status to fault"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: fault
      - alias: "New cycle started"
        conditions:
          - condition: trigger
            id: cycle_start
        sequence:
          - alias: "Set status to idle"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: idle
          - alias: "Stamp cycle started time"
            action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.utility_room_washer_cycle_started
            data:
              datetime: "{{ now() }}"
      - alias: "Washer retrieved"
        conditions:
          - condition: trigger
            id: retrieved
        sequence:
          - alias: "Set status to idle"
            action: input_select.select_option
            target:
              entity_id: input_select.utility_room_washer_status
            data:
              option: idle
mode: single
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
