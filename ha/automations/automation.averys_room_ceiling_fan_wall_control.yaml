id: "1788029757102"
alias: "Avery's Room: Ceiling Fan Wall Control"
description: >-
  Single wall-control automation for the Avery's Room ceiling fan (VTM36 canopy +
  VTM30-SN switch), covering the links that don't run over the Matter binding.
  Down paddle double tap turns the fan and light off; up paddle double tap turns
  the fan on to the last speed and the light on. Config button: single tap resumes
  the last speed (fan off) or advances low->medium->high->low (fan on); double tap
  turns it off; triple tap peeks at the current LED state without changing the
  fan. Fan-percentage and ceiling-light changes each recompute the switch's LED
  bar via script.averys_room_ceiling_fan_led_state (persistent speed colour at
  50% while home and awake, a faint white locator glow when the fan and light are
  both off, dark otherwise) - or script.averys_room_ceiling_fan_led_blip_dim
  instead when the fan is running but nobody is home and awake. Avery's Room is
  a bedroom room (see guides/inovelli_switches.md); home-awake here also requires
  Avery not to be asleep, unless binary_sensor.avery_home_today has been off for
  at least 8 hours - an instantaneous off would fire at the midnight day-boundary
  while she's still physically asleep, so the 8h minimum protects her through the
  night and her school-day wake time while still catching the multi-day-away case
  this exists for. None of this works while HA is down; paddle tap -> light on/off
  (cluster 6) and paddle hold -> dim (cluster 8) are Matter bindings and are
  independent.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_config
    not_to:
      - unavailable
      - unknown
    id: config
  - alias: Fan speed settled (percentage attribute changed)
    trigger: state
    entity_id: fan.averys_room_ceiling_fan
    attribute: percentage
    id: fan
  - alias: Down paddle double tap
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_down
    not_to:
      - unavailable
      - unknown
    id: down_double
  - alias: Up paddle double tap
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_up
    not_to:
      - unavailable
      - unknown
    id: up_double
  - alias: Ceiling light changed (paddle-bound)
    trigger: state
    entity_id: light.averys_room_ceiling_fan_light
    id: light
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Config button
        conditions:
          - condition: trigger
            id: config
            alias: Triggered by the config button
          - alias: Ignore the duplicate event the config button fires ~8ms after a tap
            condition: template
            value_template: "{{ trigger.from_state is none or (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() > 0.3 }}"
        sequence:
          - alias: Route by gesture
            choose:
              - alias: Single tap
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_1
                    alias: Single tap
                sequence:
                  - alias: Resume last speed if off, otherwise advance the cycle
                    if:
                      - condition: state
                        entity_id: fan.averys_room_ceiling_fan
                        state: "off"
                        alias: Fan currently off
                    then:
                      - alias: Turn fan on to the remembered speed
                        action: fan.set_percentage
                        target:
                          entity_id: fan.averys_room_ceiling_fan
                        data:
                          percentage: "{% set s = states('input_select.averys_room_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
                    else:
                      - alias: Advance low -> medium -> high -> low
                        note: "Wide bands absorb Matter fan percentage rounding: low~33, medium~66, high~100."
                        action: fan.set_percentage
                        target:
                          entity_id: fan.averys_room_ceiling_fan
                        data:
                          percentage: "{% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}{{ 66 if p < 45 else (100 if p < 78 else 33) }}"
              - alias: Double tap - off
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_2
                    alias: Double tap
                sequence:
                  - alias: Turn the ceiling fan off
                    action: fan.turn_off
                    target:
                      entity_id: fan.averys_room_ceiling_fan
              - alias: Triple tap - peek at the current LED state without changing the fan
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_3
                    alias: Triple tap
                sequence:
                  - alias: Dispatch the LED update
                    if:
                      - condition: state
                        entity_id: fan.averys_room_ceiling_fan
                        state: "on"
                        alias: Fan is on
                      - condition: not
                        alias: Nobody home and awake
                        conditions:
                          - condition: and
                            alias: Currently home and awake
                            conditions:
                              - condition: numeric_state
                                entity_id: zone.home
                                above: 0
                                alias: Someone home
                              - condition: state
                                entity_id: input_boolean.everyone_sleeping
                                state: "off"
                                alias: Everyone awake
                              - condition: or
                                alias: Avery's flag doesn't apply
                                conditions:
                                  - condition: state
                                    entity_id: input_boolean.avery_sleeping
                                    state: "off"
                                    alias: Avery is not asleep
                                  - condition: state
                                    entity_id: binary_sensor.avery_home_today
                                    state: "off"
                                    for: "08:00:00"
                                    alias: Avery has not been home today for at least 8 hours
                    then:
                      - alias: Flash the dim acknowledgement
                        action: script.averys_room_ceiling_fan_led_blip_dim
                    else:
                      - alias: Recompute the steady LED state
                        action: script.averys_room_ceiling_fan_led_state
      - alias: Down paddle double-tapped - turn the fan and light off
        conditions:
          - condition: trigger
            id: down_double
            alias: Triggered by the down paddle
          - alias: Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_down
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the ceiling fan off
            action: fan.turn_off
            target:
              entity_id: fan.averys_room_ceiling_fan
          - alias: Turn the fan light off
            action: light.turn_off
            target:
              entity_id: light.averys_room_ceiling_fan_light
      - alias: Up paddle double-tapped - turn the fan and light on
        conditions:
          - condition: trigger
            id: up_double
            alias: Triggered by the up paddle
          - alias: Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_up
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the fan on to the remembered speed
            action: fan.set_percentage
            target:
              entity_id: fan.averys_room_ceiling_fan
            data:
              percentage: "{% set s = states('input_select.averys_room_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
          - alias: Turn the fan light on
            action: light.turn_on
            target:
              entity_id: light.averys_room_ceiling_fan_light
      - alias: Fan speed settled - record it and update the LED bar
        conditions:
          - condition: trigger
            id: fan
            alias: Triggered by the fan
        sequence:
          - alias: Resolve the current speed band
            variables:
              speed: "{% if is_state('fan.averys_room_ceiling_fan', 'off') %}off{% else %}{% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}{% if p < 45 %}low{% elif p < 78 %}medium{% else %}high{% endif %}{% endif %}"
          - alias: Record the running speed for resume-last-speed
            if:
              - condition: state
                entity_id: fan.averys_room_ceiling_fan
                state: "on"
                alias: Fan is on
            then:
              - alias: Store speed name
                action: input_select.select_option
                target:
                  entity_id: input_select.averys_room_ceiling_fan_last_speed
                data:
                  option: "{{ speed }}"
          - alias: Dispatch the LED update
            if:
              - condition: state
                entity_id: fan.averys_room_ceiling_fan
                state: "on"
                alias: Fan is on
              - condition: not
                alias: Nobody home and awake
                conditions:
                  - condition: and
                    alias: Currently home and awake
                    conditions:
                      - condition: numeric_state
                        entity_id: zone.home
                        above: 0
                        alias: Someone home
                      - condition: state
                        entity_id: input_boolean.everyone_sleeping
                        state: "off"
                        alias: Everyone awake
                      - condition: or
                        alias: Avery's flag doesn't apply
                        conditions:
                          - condition: state
                            entity_id: input_boolean.avery_sleeping
                            state: "off"
                            alias: Avery is not asleep
                          - condition: state
                            entity_id: binary_sensor.avery_home_today
                            state: "off"
                            for: "08:00:00"
                            alias: Avery has not been home today for at least 8 hours
            then:
              - alias: Flash the dim acknowledgement
                action: script.averys_room_ceiling_fan_led_blip_dim
            else:
              - alias: Recompute the steady LED state
                action: script.averys_room_ceiling_fan_led_state
      - alias: Ceiling light changed - recompute the LED bar
        conditions:
          - condition: trigger
            id: light
            alias: Triggered by the ceiling light
        sequence:
          - alias: Recompute the steady LED state
            action: script.averys_room_ceiling_fan_led_state
mode: queued
max: 10
category: 01M0BFFGNX30MJNVWS58ZKEH3H
