id: "1788029757102"
alias: "Avery's Room: Ceiling Fan Wall Control"
description: >-
  Single wall-control automation for the Avery's Room ceiling fan (VTM36 canopy
  + VTM30-SN switch), covering the links that don't run over the Matter binding.
  Down paddle double tap turns the fan and light off; up paddle double tap turns
  the fan on to the last speed and the light on if the light is off; if the light
  is already on, it instead releases Adaptive Lighting manual control on the ceiling
  light if it was left manually controlled. Config button: single tap resumes
  the last speed (fan off) or advances low->medium->high->low (fan on); double
  tap turns it off; triple tap peeks at the current LED state without changing
  the fan. Fan speed changes recompute the switch's RGB Indicator LED bar via
  script.household_ceiling_fan_led_state (shared across all four canopy switches)
  -- the running fan's speed colour, a white locator glow when idle, or dark when
  nobody's home. While input_boolean.avery_sleeping is on, the speed colour settles
  to the locator glow 30s after the last change; the boolean turning off restores
  the correct state immediately. See guides/inovelli_switches.md. None of this
  works while HA is down; paddle tap -> light on/off (cluster 6) and paddle hold
  -> dim (cluster 8) are Matter bindings that run regardless. On the hold's start
  (not its release) HA marks the ceiling light manually controlled, so Adaptive
  Lighting leaves the wall-set brightness alone for the whole gesture; any observed
  turn-off (single-tap, double-tap, HA) hands it back to Adaptive Lighting, and
  the 30-min autoreset is the backstop. Any observed turn-on that is not manually
  controlled gets snapped to the current Adaptive Lighting target over 2s -- OnLevel
  pre-staging is not reliably honored for every turn-on path (confirmed here:
  this light has landed at full brightness even with a correctly pre-staged OnLevel),
  so this is a fast backstop rather than a redundant check.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_config
    not_to:
      - unavailable
      - unknown
    id: config
    not_from:
      - unavailable
      - unknown
  - alias: Fan speed changed (preset_mode attribute changed)
    trigger: state
    entity_id: fan.averys_room_ceiling_fan
    attribute: preset_mode
    id: fan
  - alias: Down paddle gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_down
    not_to:
      - unavailable
      - unknown
    id: down_paddle
    not_from:
      - unavailable
      - unknown
  - alias: Up paddle gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_up
    not_to:
      - unavailable
      - unknown
    id: up_paddle
    not_from:
      - unavailable
      - unknown
  - alias: Ceiling light changed (paddle-bound)
    trigger: state
    entity_id: light.averys_room_ceiling_fan_light
    id: light
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Config button
        conditions:
          - condition: trigger
            id: config
            alias: Triggered by the config button
          - alias: >-
              Ignore the duplicate event the config button fires ~8ms after a
              tap
            condition: template
            value_template: >-
              {{ trigger.from_state is none or (trigger.to_state.last_changed
              - trigger.from_state.last_changed).total_seconds() > 0.3 }}
        sequence:
          - alias: Route by gesture
            choose:
              - alias: Single tap
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_1
                    alias: Single tap
                sequence:
                  - alias: Resume last speed if off, otherwise advance the cycle
                    if:
                      - condition: state
                        entity_id: fan.averys_room_ceiling_fan
                        state: "off"
                        alias: Fan currently off
                    then:
                      - alias: Turn fan on to the remembered speed
                        action: fan.set_preset_mode
                        target:
                          entity_id: fan.averys_room_ceiling_fan
                        data:
                          preset_mode: >-
                            {{ states('input_select.averys_room_ceiling_fan_last_speed')
                            }}
                    else:
                      - alias: Advance low -> medium -> high -> low
                        choose:
                          - alias: Low - go to medium
                            conditions:
                              - alias: Fan is at low
                                condition: state
                                entity_id: fan.averys_room_ceiling_fan
                                attribute: preset_mode
                                state: low
                            sequence:
                              - alias: Set medium
                                action: fan.set_preset_mode
                                target:
                                  entity_id: fan.averys_room_ceiling_fan
                                data:
                                  preset_mode: medium
                          - alias: Medium - go to high
                            conditions:
                              - alias: Fan is at medium
                                condition: state
                                entity_id: fan.averys_room_ceiling_fan
                                attribute: preset_mode
                                state: medium
                            sequence:
                              - alias: Set high
                                action: fan.set_preset_mode
                                target:
                                  entity_id: fan.averys_room_ceiling_fan
                                data:
                                  preset_mode: high
                        default:
                          - alias: High - wrap to low
                            action: fan.set_preset_mode
                            target:
                              entity_id: fan.averys_room_ceiling_fan
                            data:
                              preset_mode: low
              - alias: Double tap - off
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_2
                    alias: Double tap
                sequence:
                  - alias: Turn the ceiling fan off
                    action: fan.turn_off
                    target:
                      entity_id: fan.averys_room_ceiling_fan
              - alias: >-
                  Triple tap - peek at the current LED state without changing
                  the fan
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_3
                    alias: Triple tap
                sequence:
                  - alias: Recompute the LED state
                    action: script.turn_on
                    target:
                      entity_id: script.household_ceiling_fan_led_state
                    data:
                      variables:
                        fan_entity: fan.averys_room_ceiling_fan
                        led_bar_entity: light.averys_room_ceiling_fan_switch_led_bar
                        sleeping_boolean: input_boolean.avery_sleeping
                        light_entity: light.averys_room_ceiling_fan_light
                    note: >-
                      script.turn_on, not a direct call: the script waits 30s
                      to settle while the room is asleep, and a blocking call
                      would stall this queued automation (config-button taps included)
                      behind that wait.
      - alias: Down paddle double-tapped - turn the fan and light off
        conditions:
          - condition: trigger
            id: down_paddle
            alias: Triggered by the down paddle
          - alias: >-
              Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_down
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the ceiling fan off
            action: fan.turn_off
            target:
              entity_id: fan.averys_room_ceiling_fan
          - alias: Turn the fan light off
            action: light.turn_off
            target:
              entity_id: light.averys_room_ceiling_fan_light
      - alias: >-
          Up paddle double-tapped - turn on if off, else restore Adaptive Lighting
        conditions:
          - condition: trigger
            id: up_paddle
            alias: Triggered by the up paddle
          - alias: >-
              Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_up
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: >-
              If the light is off, turn the fan and light on; otherwise restore
              Adaptive Lighting if manually controlled
            note: >-
              Turning everything on only applies when the light (and with it,
              normally, the fan) is off -- if the light is already on, double-tap
              up is a manual-control release instead of a redundant re-command.
            if:
              - alias: Ceiling light is off
                condition: state
                entity_id: light.averys_room_ceiling_fan_light
                state: "off"
            then:
              - alias: Turn the fan on to the remembered speed
                action: fan.set_preset_mode
                target:
                  entity_id: fan.averys_room_ceiling_fan
                data:
                  preset_mode: >-
                    {{ states('input_select.averys_room_ceiling_fan_last_speed')
                    }}
              - alias: Turn the fan light on
                action: light.turn_on
                target:
                  entity_id: light.averys_room_ceiling_fan_light
            else:
              - alias: >-
                  If the light was manually controlled, restore it to Adaptive
                  Lighting
                if:
                  - alias: Light is manually controlled
                    condition: template
                    value_template: >-
                      {{ 'light.averys_room_ceiling_fan_light' in (state_attr('switch.adaptive_lighting_avery_schedule',
                      'manual_control_brightness') or []) }}
                then:
                  - alias: Release Adaptive Lighting manual control
                    action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: switch.adaptive_lighting_avery_schedule
                      lights:
                        - light.averys_room_ceiling_fan_light
                      manual_control: false
      - alias: >-
          Paddle hold started - mark the ceiling light manually controlled
        conditions:
          - condition: trigger
            id:
              - up_paddle
              - down_paddle
            alias: Triggered by either paddle
          - alias: Gesture is a hold-start (long_press), not a tap or a release
            condition: template
            value_template: >-
              {{ trigger.to_state.attributes.event_type == 'long_press' }}
        sequence:
          - alias: >-
              Mark the ceiling light manually controlled so AL stops adapting
              its brightness
            action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_avery_schedule
              lights:
                - light.averys_room_ceiling_fan_light
              manual_control: true
      - alias: Fan speed changed - record it and update the LED bar
        conditions:
          - condition: trigger
            id: fan
            alias: Triggered by the fan
        sequence:
          - alias: Record the running speed for resume-last-speed
            if:
              - alias: Fan is at a named speed (off reads as no preset)
                condition: state
                entity_id: fan.averys_room_ceiling_fan
                attribute: preset_mode
                state:
                  - low
                  - medium
                  - high
            then:
              - alias: Store speed name
                action: input_select.select_option
                target:
                  entity_id: input_select.averys_room_ceiling_fan_last_speed
                data:
                  option: >-
                    {{ state_attr('fan.averys_room_ceiling_fan', 'preset_mode')
                    }}
          - alias: Recompute the LED state
            action: script.turn_on
            target:
              entity_id: script.household_ceiling_fan_led_state
            data:
              variables:
                fan_entity: fan.averys_room_ceiling_fan
                led_bar_entity: light.averys_room_ceiling_fan_switch_led_bar
                sleeping_boolean: input_boolean.avery_sleeping
                light_entity: light.averys_room_ceiling_fan_light
            note: >-
              script.turn_on, not a direct call: the script waits 30s to settle
              while the room is asleep, and a blocking call would stall this queued
              automation (config-button taps included) behind that wait.
      - alias: >-
          Ceiling light changed - recompute the LED bar, release AL if off, snap
          AL if on
        conditions:
          - condition: trigger
            id: light
            alias: Triggered by the ceiling light
        sequence:
          - alias: Recompute the LED state
            action: script.turn_on
            target:
              entity_id: script.household_ceiling_fan_led_state
            data:
              variables:
                fan_entity: fan.averys_room_ceiling_fan
                light_entity: light.averys_room_ceiling_fan_light
                led_bar_entity: light.averys_room_ceiling_fan_switch_led_bar
                sleeping_boolean: input_boolean.avery_sleeping
                light_just_turned_off: >-
                  {{ is_state('light.averys_room_ceiling_fan_light', 'off') }}
            note: >-
              script.turn_on, not a direct call: the script waits 30s to settle
              while the room is asleep, and a blocking call would stall this queued
              automation (config-button taps included) behind that wait.
          - alias: >-
              If the light is now off, hand its brightness back to Adaptive Lighting
            note: >-
              A single paddle tap turns the light off via the cluster-6 Matter
              binding, which AL does not see as a light.turn_off service call,
              so a light wall-dimmed earlier would stay manually controlled through
              an off/on. HA does see the resulting off state, so clear AL manual
              control here. Harmless no-op when the light was not manually controlled.
            if:
              - alias: Ceiling light is now off
                condition: state
                entity_id: light.averys_room_ceiling_fan_light
                state: "off"
            then:
              - alias: Release Adaptive Lighting manual control
                action: adaptive_lighting.set_manual_control
                data:
                  entity_id: switch.adaptive_lighting_avery_schedule
                  lights:
                    - light.averys_room_ceiling_fan_light
                  manual_control: false
          - alias: >-
              If the light just turned on and is not manually controlled, snap
              it to the curve
            note: >-
              Closes the gap for a turn-on that lands away from the current Adaptive
              Lighting target -- confirmed on this light turning on to full brightness
              even with a correctly pre-staged OnLevel, then only fading down
              over AL's normal ~45s cycle. Forces a fast 2s correction instead
              of waiting on that cycle. Gated on trigger.from_state being off
              (not just the current state being on) -- without that guard this
              step also fires on Adaptive Lighting's own periodic brightness-only
              attribute updates while the light is already on, and each apply
              call is itself a light change that retriggers this same branch,
              creating a continuous feedback loop with Adaptive Lighting.
            if:
              - alias: >-
                  This is a real off-to-on transition, not an attribute-only change
                condition: template
                value_template: >-
                  {{ trigger.from_state is not none and trigger.from_state.state
                  == 'off' }}
              - alias: Ceiling light is now on
                condition: state
                entity_id: light.averys_room_ceiling_fan_light
                state: "on"
              - alias: Not manually controlled
                condition: template
                value_template: >-
                  {{ 'light.averys_room_ceiling_fan_light' not in (state_attr('switch.adaptive_lighting_avery_schedule',
                  'manual_control_brightness') or []) }}
            then:
              - alias: Snap to the current Adaptive Lighting target over 2s
                action: adaptive_lighting.apply
                data:
                  entity_id: switch.adaptive_lighting_avery_schedule
                  lights:
                    - light.averys_room_ceiling_fan_light
                  transition: 2
                  turn_on_lights: false
                  adapt_brightness: true
                  adapt_color: false
mode: queued
max: 10
category: 01M0BFFGNX30MJNVWS58ZKEH3H
