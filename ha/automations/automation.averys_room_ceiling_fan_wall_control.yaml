id: "1788029757102"
alias: "Avery's Room: Ceiling Fan Wall Control"
description: >-
  Single wall-control automation for the Avery's Room ceiling fan (VTM36 canopy +
  VTM30-SN switch), covering the links that don't run over the Matter binding.
  Down paddle double tap turns the fan and light off; up paddle double tap turns
  the fan on to the last speed and the light on. Config button: single tap resumes
  the last speed (fan off) or advances low->medium->high->low (fan on); double tap
  turns it off; triple tap peeks at the current LED state without changing the
  fan. Fan-percentage and ceiling-light changes each recompute the switch's LED
  bar via script.averys_room_ceiling_fan_led_state - the running fan's speed
  colour, a white locator glow when idle, or dark when nobody's home, dimmer at
  night in every case. The bar always shows something whenever someone's home,
  day or night, identically to Office and Master Bedroom - no person-specific
  exception any more. See guides/inovelli_switches.md. None of this works while
  HA is down; paddle tap -> light on/off (cluster 6) and paddle hold -> dim
  (cluster 8) are Matter bindings that run regardless. On the hold's release HA
  marks the ceiling light manually controlled so Adaptive Lighting leaves the
  wall-set brightness alone; any observed turn-off (single-tap, double-tap, HA)
  hands it back to Adaptive Lighting, and the 30-min autoreset is the backstop.
triggers:
  - alias: Config button gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_config
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: config
  - alias: Fan speed settled (percentage attribute changed)
    trigger: state
    entity_id: fan.averys_room_ceiling_fan
    attribute: percentage
    not_from:
      - unavailable
      - unknown
    id: fan
  - alias: Down paddle gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_down
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: down_paddle
  - alias: Up paddle gesture
    trigger: state
    entity_id: event.averys_room_ceiling_fan_switch_button_up
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: up_paddle
  - alias: Ceiling light changed (paddle-bound)
    trigger: state
    entity_id: light.averys_room_ceiling_fan_light
    not_from:
      - unavailable
      - unknown
    id: light
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: Config button
        conditions:
          - condition: trigger
            id: config
            alias: Triggered by the config button
          - alias: Ignore the duplicate event the config button fires ~8ms after a tap
            condition: template
            value_template: "{{ trigger.from_state is none or (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() > 0.3 }}"
        sequence:
          - alias: Route by gesture
            choose:
              - alias: Single tap
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_1
                    alias: Single tap
                sequence:
                  - alias: Resume last speed if off, otherwise advance the cycle
                    if:
                      - condition: state
                        entity_id: fan.averys_room_ceiling_fan
                        state: "off"
                        alias: Fan currently off
                    then:
                      - alias: Turn fan on to the remembered speed
                        action: fan.set_percentage
                        target:
                          entity_id: fan.averys_room_ceiling_fan
                        data:
                          percentage: "{% set s = states('input_select.averys_room_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
                    else:
                      - alias: Advance low -> medium -> high -> low
                        note: "Wide bands absorb Matter fan percentage rounding: low~33, medium~66, high~100."
                        action: fan.set_percentage
                        target:
                          entity_id: fan.averys_room_ceiling_fan
                        data:
                          percentage: "{% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}{{ 66 if p < 45 else (100 if p < 78 else 33) }}"
              - alias: Double tap - off
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_2
                    alias: Double tap
                sequence:
                  - alias: Turn the ceiling fan off
                    action: fan.turn_off
                    target:
                      entity_id: fan.averys_room_ceiling_fan
              - alias: Triple tap - peek at the current LED state without changing the fan
                conditions:
                  - condition: state
                    entity_id: event.averys_room_ceiling_fan_switch_button_config
                    attribute: event_type
                    state: multi_press_3
                    alias: Triple tap
                sequence:
                  - alias: Recompute the LED state
                    action: script.averys_room_ceiling_fan_led_state
      - alias: Down paddle double-tapped - turn the fan and light off
        conditions:
          - condition: trigger
            id: down_paddle
            alias: Triggered by the down paddle
          - alias: Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_down
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the ceiling fan off
            action: fan.turn_off
            target:
              entity_id: fan.averys_room_ceiling_fan
          - alias: Turn the fan light off
            action: light.turn_off
            target:
              entity_id: light.averys_room_ceiling_fan_light
      - alias: Up paddle double-tapped - turn the fan and light on
        conditions:
          - condition: trigger
            id: up_paddle
            alias: Triggered by the up paddle
          - alias: Gesture was a double tap (multi_press_2), not a single tap or hold
            condition: state
            entity_id: event.averys_room_ceiling_fan_switch_button_up
            attribute: event_type
            state: multi_press_2
        sequence:
          - alias: Turn the fan on to the remembered speed
            action: fan.set_percentage
            target:
              entity_id: fan.averys_room_ceiling_fan
            data:
              percentage: "{% set s = states('input_select.averys_room_ceiling_fan_last_speed') %}{{ {'low': 33, 'medium': 66, 'high': 100}.get(s, 66) }}"
          - alias: Turn the fan light on
            action: light.turn_on
            target:
              entity_id: light.averys_room_ceiling_fan_light
      - alias: Paddle held then released - hand the ceiling light's brightness to Adaptive Lighting
        conditions:
          - condition: trigger
            id:
              - up_paddle
              - down_paddle
            alias: Triggered by either paddle
          - alias: Gesture was a hold-release (long_release), not a tap
            condition: template
            value_template: "{{ trigger.to_state.attributes.event_type == 'long_release' }}"
        sequence:
          - alias: Mark the ceiling light manually controlled so AL stops adapting its brightness
            action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_avery_schedule
              lights:
                - light.averys_room_ceiling_fan_light
              manual_control: true
      - alias: Fan speed settled - record it and update the LED bar
        conditions:
          - condition: trigger
            id: fan
            alias: Triggered by the fan
        sequence:
          - alias: Resolve the current speed band
            variables:
              speed: "{% if is_state('fan.averys_room_ceiling_fan', 'off') %}off{% else %}{% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}{% if p < 45 %}low{% elif p < 78 %}medium{% else %}high{% endif %}{% endif %}"
          - alias: Record the running speed for resume-last-speed
            if:
              - condition: state
                entity_id: fan.averys_room_ceiling_fan
                state: "on"
                alias: Fan is on
            then:
              - alias: Store speed name
                action: input_select.select_option
                target:
                  entity_id: input_select.averys_room_ceiling_fan_last_speed
                data:
                  option: "{{ speed }}"
          - alias: Recompute the LED state
            action: script.averys_room_ceiling_fan_led_state
      - alias: Ceiling light changed - recompute the LED bar, release AL if it turned off
        conditions:
          - condition: trigger
            id: light
            alias: Triggered by the ceiling light
        sequence:
          - alias: Recompute the steady LED state
            action: script.averys_room_ceiling_fan_led_state
          - alias: If the light is now off, hand its brightness back to Adaptive Lighting
            note: >-
              A single paddle tap turns the light off via the cluster-6 Matter
              binding, which AL does not see (detect_non_ha_changes is off), so a
              light wall-dimmed earlier would stay manually controlled through an
              off/on. HA does see the resulting off state, so clear AL manual
              control here. Harmless no-op when the light was not manually
              controlled.
            if:
              - alias: Ceiling light is now off
                condition: state
                entity_id: light.averys_room_ceiling_fan_light
                state: "off"
            then:
              - alias: Release Adaptive Lighting manual control
                action: adaptive_lighting.set_manual_control
                data:
                  entity_id: switch.adaptive_lighting_avery_schedule
                  lights:
                    - light.averys_room_ceiling_fan_light
                  manual_control: false
mode: queued
max: 10
category: 01M0BFFGNX30MJNVWS58ZKEH3H
