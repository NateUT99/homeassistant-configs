id: "1789261066375"
alias: "Living Room: TV Accent Off-TV Guard"
description: >-
  If the accent light is on while the AppleTV is off (or unavailable), turn
  it back off. This lighting has no off-TV use case, so this catches
  manual turn-ons (Hue app, voice command, etc.) and acts as a backstop if
  the Accent Controller ever misses the AppleTV's own off-transition.


  Targets `media_player.living_room_appletv` rather than
  `media_player.living_room_tv` — the AppleTV is the sole source connected
  to the TV and its state reporting is far more reliable than the LG
  WebOS integration's assumed-state, flaky on/off detection.


  Kept as a separate automation from the Accent Controller so it cannot
  create a feedback loop with the controller's own actions — it only acts
  when the AppleTV is off, so it never fires during TV sessions.
triggers:
  - alias: Accent light turned on
    trigger: state
    entity_id: light.living_room_tv_accent
    to: "on"
  - alias: AppleTV turned off or became unavailable
    trigger: state
    entity_id: media_player.living_room_appletv
    to:
      - "off"
      - unavailable
    note: >-
      Raw `state` used instead of the purpose-specific
      media_player.turned_off trigger -- that trigger excludes
      unavailable/unknown from counting as off, but this guard
      deliberately treats AppleTV going unavailable the same as off
      (matches automation.living_room_tv_accent_controller's tv_off
      trigger).
conditions:
  - alias: AppleTV is off or unavailable
    condition: state
    entity_id: media_player.living_room_appletv
    state:
      - "off"
      - unavailable
    note: >-
      Raw `state` used instead of media_player.is_off for the same reason
      as this automation's trigger -- that condition also excludes
      unavailable/unknown.
actions:
  - alias: Turn off accent light
    action: light.turn_off
    target:
      entity_id: light.living_room_tv_accent
mode: single
category: 01M2C49AVVEG94R66QZA8BTV2Y
