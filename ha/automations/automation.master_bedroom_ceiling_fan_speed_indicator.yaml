id: "1788029454312"
alias: "Master Bedroom: Ceiling Fan Speed Indicator"
description: >-
  Mirrors the Master Bedroom ceiling fan's speed onto the Ceiling Fan Switch LED
  bar - colour carries the speed (teal low / blue medium / violet high, dim blue
  when off), brightness drops when input_boolean.everyone_sleeping is on. Also
  records the running speed in input_select.master_bedroom_ceiling_fan_last_speed
  so the config-button 'resume last speed' tap works. Triggered on the fan and on
  the sleep toggle so it reflects changes from the wall button, the app, or
  bedtime.
triggers:
  - alias: Ceiling fan changed
    trigger: state
    entity_id: fan.master_bedroom_ceiling_fan
    not_to:
      - unavailable
      - unknown
  - alias: Everyone Sleeping changed
    trigger: state
    entity_id: input_boolean.everyone_sleeping
    not_to:
      - unavailable
      - unknown
conditions: []
actions:
  - alias: Let the Matter fan settle
    note: "The VTM36 reports state 'on' before 'percentage' populates - reading immediately on the off->on edge sees percentage 0. mode restart means only the final settled change paints."
    delay:
      seconds: 1
  - alias: Resolve the current speed band
    variables:
      speed: "{% if is_state('fan.master_bedroom_ceiling_fan', 'off') %}off{% else %}{% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}{% if p < 45 %}low{% elif p < 78 %}medium{% else %}high{% endif %}{% endif %}"
  - alias: Record the running speed for resume-last-speed
    if:
      - alias: Fan is on
        condition: state
        entity_id: fan.master_bedroom_ceiling_fan
        state: "on"
    then:
      - alias: Store speed name
        action: input_select.select_option
        target:
          entity_id: input_select.master_bedroom_ceiling_fan_last_speed
        data:
          option: "{{ speed }}"
  - alias: Paint the LED bar - colour by speed, dimmer when everyone is sleeping
    note: "Matter exposes the bar as one RGB light (no per-segment control), so speed is shown by hue: off/medium blue 220, low teal 175, high violet 265. brightness_pct: sleeping 5/20, awake 12/55 for off/on."
    action: light.turn_on
    target:
      entity_id: light.master_bedroom_ceiling_fan_switch_led
    data:
      brightness_pct: "{% if speed == 'off' %}{{ 5 if is_state('input_boolean.everyone_sleeping', 'on') else 12 }}{% else %}{{ 20 if is_state('input_boolean.everyone_sleeping', 'on') else 55 }}{% endif %}"
      hs_color:
        - "{{ {'off': 220, 'low': 175, 'medium': 220, 'high': 265}.get(speed, 220) }}"
        - 100
mode: restart
category: 01M0BFFGNX30MJNVWS58ZKEH3H
