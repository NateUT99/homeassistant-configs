id: "1786996640211"
alias: "Bathroom: Ambient Lamp"
description: >-
  Controls the bathroom ambient lamp based on ambient light and arrivals. Turns
  on when the bathroom gets dark (only if someone is home), or when the first
  person arrives home to a dark bathroom. Turns off when the bathroom gets
  bright, or when the last person leaves home (see
  automation.household_last_leaves_home). Dark/bright thresholds are
  asymmetric (10/15 lux) to avoid an on/off feedback loop from the lamp's own
  glow.
triggers:
  - alias: Bathroom illuminance drops below threshold
    entity_id: sensor.bathroom_ambient_lamp_illuminance
    below: 10
    id: dark
    trigger: numeric_state
  - alias: Bathroom illuminance rises above threshold
    entity_id: sensor.bathroom_ambient_lamp_illuminance
    above: 15
    for:
      seconds: 15
    id: bright
    trigger: numeric_state
  - alias: First person arrives home
    entity_id: zone.home
    from: "0"
    id: home
    trigger: state
conditions: []
actions:
  - alias: Route by trigger
    choose:
      - alias: "Bathroom got dark — turn lamp on"
        conditions:
          - alias: Dark trigger
            condition: trigger
            id: dark
          - alias: Someone is home
            condition: numeric_state
            entity_id: zone.home
            above: 0
        sequence:
          - alias: Turn on ambient lamp at 65%
            action: light.turn_on
            target:
              entity_id: light.bathroom_ambient_lamp
            data:
              brightness_pct: 65
              color_temp_kelvin: 2000
      - alias: "Bathroom got bright — turn lamp off"
        conditions:
          - alias: Bright trigger
            condition: trigger
            id: bright
        sequence:
          - alias: Turn off ambient lamp
            action: light.turn_off
            target:
              entity_id: light.bathroom_ambient_lamp
      - alias: "First person home and bathroom is dark — turn lamp on"
        conditions:
          - alias: Home trigger
            condition: trigger
            id: home
          - alias: Bathroom is dark
            condition: numeric_state
            entity_id: sensor.bathroom_ambient_lamp_illuminance
            below: 10
        sequence:
          - alias: Turn on ambient lamp at 65%
            action: light.turn_on
            target:
              entity_id: light.bathroom_ambient_lamp
            data:
              brightness_pct: 65
              color_temp_kelvin: 2000
mode: single
category: 01M08MMBZ719V4GZ2FT10RPTJ2
