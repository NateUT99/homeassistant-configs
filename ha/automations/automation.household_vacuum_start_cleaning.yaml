id: "1787695541380"
alias: "Household: Vacuum Start Cleaning"
description: >-
  Starts the Roborock in one of two fixed, non-overlapping zones. Common
  Areas (Office, Dining room, Living room, Entrance, Kitchen) clean in
  the evening once everyone has been asleep for an hour, adults-only.
  Remaining Rooms (Bedroom, Bathroom, Master bedroom, Master Bathroom,
  Utility Room, Pantry) clean in the daytime when the last person leaves
  for the day.

  The two zones are fixed and never reference each other's progress or
  completion state -- a commanded dock always cancels the active job on
  this unit, and cleaning progress is relative to job size, not house
  size, so cross-zone comparisons or leftover-tracking don't work
  reliably. See guides/vacuum_cleaning_routine.md for the full reasoning.
triggers:
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    to: "on"
    for:
      hours: 1
    id: evening_sleeping
    alias: Everyone has been asleep for 1 hour
  - trigger: state
    entity_id: zone.home
    to: "0"
    for:
      minutes: 2
      seconds: 30
    id: daytime_departure
    alias: Last person leaves home for 2 minutes 30 seconds
conditions: []
actions:
  - alias: Route to the correct zone based on which trigger fired
    choose:
      - alias: "Evening: clean common areas"
        conditions:
          - condition: trigger
            id: evening_sleeping
          - condition: state
            entity_id: input_boolean.vacuum_ran_evening
            state: "off"
            alias: Evening zone has not run today
          - condition: state
            entity_id: input_boolean.vacuum_routine_pause
            state: "off"
            alias: Vacuum routine is not paused
          - condition: state
            entity_id: binary_sensor.avery_home_today
            state: "off"
            alias: Avery is not home today
          - condition: not
            conditions:
              - condition: state
                entity_id: vacuum.living_room_vacuum
                state: cleaning
            alias: Vacuum is not currently cleaning
        sequence:
          - alias: Set active zone to evening
            action: input_select.select_option
            target:
              entity_id: input_select.vacuum_active_zone
            data:
              option: evening
          - alias: Set quiet fan speed for evening cleaning
            action: vacuum.set_fan_speed
            target:
              entity_id: vacuum.living_room_vacuum
            data:
              fan_speed: quiet
          - alias: Disable mopping in the evening to avoid loud dock wash and dry
            action: select.select_option
            target:
              entity_id: select.living_room_vacuum_mop_intensity
            data:
              option: "off"
          - alias: Start segment clean of common areas
            action: vacuum.send_command
            target:
              entity_id: vacuum.living_room_vacuum
            data:
              command: app_segment_clean
              params:
                - segments: [18, 22, 25, 26, 27]
                  repeat: 1
          - alias: Notify that evening cleaning started
            action: notify.send_message
            target:
              entity_id: notify.nates_iphone
            data:
              title: Vacuum
              message: Started cleaning common areas this evening.
      - alias: "Daytime: clean remaining rooms"
        conditions:
          - condition: trigger
            id: daytime_departure
          - condition: state
            entity_id: input_boolean.vacuum_ran_daytime
            state: "off"
            alias: Daytime zone has not run today
          - condition: state
            entity_id: input_boolean.vacuum_routine_pause
            state: "off"
            alias: Vacuum routine is not paused
          - condition: time
            after: "09:00:00"
            before: "19:00:00"
            alias: Within daytime cleaning hours (9am-7pm), keeps school drop-off window clear
          - condition: not
            conditions:
              - condition: state
                entity_id: vacuum.living_room_vacuum
                state: cleaning
            alias: Vacuum is not currently cleaning
        sequence:
          - alias: Set active zone to daytime
            action: input_select.select_option
            target:
              entity_id: input_select.vacuum_active_zone
            data:
              option: daytime
          - alias: Set max fan speed for daytime cleaning
            action: vacuum.set_fan_speed
            target:
              entity_id: vacuum.living_room_vacuum
            data:
              fan_speed: max
          - alias: Set medium mop intensity
            action: select.select_option
            target:
              entity_id: select.living_room_vacuum_mop_intensity
            data:
              option: medium
          - alias: Start segment clean of remaining rooms
            action: vacuum.send_command
            target:
              entity_id: vacuum.living_room_vacuum
            data:
              command: app_segment_clean
              params:
                - segments: [16, 17, 19, 21, 23, 24]
                  repeat: 1
          - alias: Notify that daytime cleaning started
            action: notify.send_message
            target:
              entity_id: notify.nates_iphone
            data:
              title: Vacuum
              message: Started cleaning remaining rooms.
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
