id: "1789070771813"
alias: "Household: Vacuum Mop Pad Reminders"
description: >-
  Brackets the weekly mop pass (folded into Household: Vacuum Evening
  Cleaning, along with its next-morning master-suite follow-up) with two
  human-in-the-loop reminders, since the Roborock's mop pad and 350 ml water
  tank are both filled and fitted by hand. Also latches tonight's Avery-home
  answer: every prep_check tick between 19:55 and 23:59,
  input_boolean.vacuum_avery_home_tonight is snapshotted from
  binary_sensor.avery_home_today -- since that sensor is calendar-derived and
  flips at midnight, a post-midnight evening pass needs the pre-midnight
  answer, not the live one. Re-snapshotting every 30 minutes in that window
  (rather than a single fixed-time trigger) makes it self-healing across an
  HA restart landing on any one tick. Prep: every 30 minutes from 20:00
  onward, on any night that's mop-eligible (Avery away tonight, week not yet
  mopped) and someone is home, a TTS-only reminder repeats until the pad
  goes on -- no push, no banner, since attaching the pad is what stops the
  loop. input_boolean.vacuum_mop_skip_today cancels it for the rest of the
  day; Household: Vacuum Reset clears that flag at 8am. Cleanup: once the
  vacuum re-docks after the master-suite follow-up finishes (gated on
  input_boolean.vacuum_mop_master_suite_done_this_week rather than a fixed
  weekday), with a daily 17:00 backstop that repeats until the pad comes
  off, announce that the pad should come off to rinse and the tank be
  emptied. Attaching or removing the pad clears the matching state on its
  own -- binary_sensor.living_room_vacuum_mop_attached is the
  acknowledgement, so there are no action buttons for either half. TTS runs
  through script.household_tts_announce; the prep nudge auto-targets
  whoever's home, the post-mop cleanup nudge auto-resolves (kitchen, since
  everyone is awake by then), and the 17:00 backstop nudges the kitchen. See
  guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: time_pattern
    minutes: "/30"
    id: prep_check
    alias: >-
      Every 30 minutes -- checks whether tonight's prep reminder should
      fire, and re-latches the Avery-tonight snapshot in the evening window
  - trigger: state
    entity_id: vacuum.living_room_vacuum
    to: docked
    for:
      minutes: 1
    id: cleanup_docked
    alias: Vacuum re-docked -- possibly the master-suite follow-up finishing
  - trigger: time
    at: "17:00:00"
    id: cleanup_nag
    alias: 17:00 daily backstop -- pad still attached
  - trigger: state
    entity_id: binary_sensor.living_room_vacuum_mop_attached
    from: "on"
    to: "off"
    id: cleanup_done
    alias: Mop pad was removed
conditions: []
actions:
  - alias: Latch tonight's Avery-home answer before the calendar date rolls over at midnight
    if:
      - condition: trigger
        id: [prep_check]
      - condition: time
        after: "19:55:00"
        before: "23:59:59"
    then:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.avery_home_today
                state: "on"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.vacuum_avery_home_tonight
          - conditions:
              - condition: state
                entity_id: binary_sensor.avery_home_today
                state: "off"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.vacuum_avery_home_tonight
  - choose:
      - alias: Prep nudge -- mop-eligible night, someone home, pad not yet on, not skipped
        conditions:
          - condition: trigger
            id: prep_check
          - condition: time
            after: "20:00:00"
            alias: 20:00 or later
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
            alias: Not bedtime yet
          - condition: state
            entity_id: input_boolean.vacuum_avery_home_tonight
            state: "off"
            alias: Avery is not home tonight
          - condition: state
            entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
            state: "off"
            alias: Common-area mop hasn't run yet this week
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_mop_attached
            state: "off"
            alias: Mop pad is not already attached
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone is home
          - condition: state
            entity_id: input_boolean.vacuum_mop_skip_today
            state: "off"
            alias: Not canceled for today
          - condition: state
            entity_id: input_boolean.vacuum_routine_pause
            state: "off"
            alias: Vacuum routine is not paused
        sequence:
          - alias: Announce the prep reminder
            action: script.household_tts_announce
            data:
              message: Tonight is mop night. Fill the robot's water tank and clip on the mop pad.
              target: auto
              notification_title: Vacuum Mop Prep
              critical_fallback: false
      - alias: Cleanup nudge -- re-docked after the master-suite follow-up, or 17:00 backstop, pad still on
        conditions:
          - condition: trigger
            id: [cleanup_docked, cleanup_nag]
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_mop_attached
            state: "on"
            alias: Mop pad is still attached
          - condition: state
            entity_id: input_boolean.vacuum_mop_master_suite_done_this_week
            state: "on"
            alias: This week's master suite mop already ran
        sequence:
          - alias: Announce the cleanup reminder
            action: script.household_tts_announce
            data:
              message: Pull the mop pad off the robot to rinse it, and empty the water tank.
              target: "{{ 'auto' if (trigger is defined and trigger.id == 'cleanup_docked') else 'kitchen' }}"
              notification_title: Vacuum Mop Cleanup
              critical_fallback: false
          - alias: Push the cleanup reminder
            action: notify.mobile_app_nates_iphone
            data:
              title: Vacuum Mop Cleanup
              message: Pull the mop pad off to rinse it, and empty the water tank.
              data:
                tag: vacuum_mop_cleanup
      - alias: Cleanup done -- clear the cleanup banner
        conditions:
          - condition: trigger
            id: cleanup_done
        sequence:
          - alias: Clear the cleanup push
            action: notify.mobile_app_nates_iphone
            data:
              message: clear_notification
              data:
                tag: vacuum_mop_cleanup
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
