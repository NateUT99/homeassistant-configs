id: "1787578256156"
alias: "Office: Camera Lighting"
description: >-
  Turns off the ceiling light and monitor light bar and activates the desk
  key light at a video-call preset when the Studio Display Camera turns on
  on the MacBook Pro. When the camera turns off, waits for the microphone
  to also release before treating the call as ended (tolerates a
  video-only pause, e.g. stepping away briefly with audio still
  connected), capped at a 3-minute safety timeout, then restores the
  ceiling light and monitor light bar and turns off the key light.
triggers:
  - alias: Studio Display Camera becomes active on the MacBook Pro
    trigger: state
    entity_id: sensor.nates_work_laptop_active_camera
    to: Studio Display Camera
    id: "on"
  - alias: Studio Display Camera inactive for a few seconds on the MacBook Pro
    trigger: state
    entity_id: sensor.nates_work_laptop_active_camera
    from: Studio Display Camera
    id: "off"
    for:
      seconds: 3
conditions: []
actions:
  - choose:
      - alias: Camera turned on
        conditions:
          - alias: Triggered by camera turning on
            condition: trigger
            id: "on"
        sequence:
          - alias: Remember whether the ceiling light was on before this call
            if:
              - alias: Ceiling light is currently on
                condition: state
                entity_id: light.office_ceiling_fan_light
                state: "on"
            then:
              - alias: Record ceiling light was on
                action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.office_ceiling_light_was_on
            else:
              - alias: Record ceiling light was off
                action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.office_ceiling_light_was_on
          - alias: Check Litra availability before applying camera preset
            choose:
              - alias: Litra unavailable, skip preset and notify
                conditions:
                  - alias: Litra Glow status sensor is unavailable or disconnected
                    condition: state
                    entity_id: sensor.office_key_light_status
                    state:
                      - unavailable
                      - unknown
                sequence:
                  - alias: Notify Litra unavailable
                    action: notify.mobile_app_nates_iphone
                    data:
                      title: Camera Lighting Unavailable
                      message: >-
                        Litra Glow status sensor is unavailable - check the
                        Mac Mini's SSH connection or the light's USB cable.
            default:
              - alias: Turn off ceiling light and monitor light bar
                action: light.turn_off
                target:
                  entity_id:
                    - light.office_ceiling_fan_light
                    - light.office_monitor_light_bar
              - alias: Turn on desk key light for camera
                action: light.turn_on
                target:
                  entity_id: light.office_desk_key_light
                data:
                  brightness_pct: 45
                  color_temp_kelvin: 4500
      - alias: Camera turned off
        conditions:
          - alias: Triggered by camera turning off
            condition: trigger
            id: "off"
        sequence:
          - alias: >-
              Hold off if the microphone is still connected (call likely
              still active, just video-paused)
            if:
              - alias: Microphone still in use
                condition: state
                entity_id: binary_sensor.nates_work_laptop_audio_input_in_use
                state: "on"
            then:
              - alias: Wait for the microphone to release, or give up after 3 minutes
                wait_for_trigger:
                  - trigger: state
                    entity_id: binary_sensor.nates_work_laptop_audio_input_in_use
                    to: "off"
                timeout:
                  minutes: 3
                continue_on_timeout: true
          - alias: Turn off desk key light
            action: light.turn_off
            target:
              entity_id: light.office_desk_key_light
          - alias: MacBook Pro is currently active
            condition: state
            entity_id: binary_sensor.nates_work_laptop_active
            state: "on"
          - alias: Restore monitor light bar
            action: light.turn_on
            target:
              entity_id: light.office_monitor_light_bar
          - alias: Restore ceiling light if it was on before the call
            if:
              - alias: Ceiling light was on before the call
                condition: state
                entity_id: input_boolean.office_ceiling_light_was_on
                state: "on"
            then:
              - alias: Turn ceiling light back on
                action: light.turn_on
                target:
                  entity_id: light.office_ceiling_fan_light
mode: restart
category: 01M08MMBZ719V4GZ2FT10RPTJ2
