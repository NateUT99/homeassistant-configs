id: "1787695604769"
alias: "Household: Vacuum Mark Area Complete"
description: >-
  Marks the daytime zone as cleaned for the day once its max progress clears 65%,
  when the vacuum starts returning to dock. Covers both natural completion
  (progress near 100, then returning) and an arrival-cancelled run that had
  already cleared the threshold -- status passes through returning before
  progress resets to 0, so the max helper is already correct when this fires. The
  threshold sits below 100 because several daytime rooms have doors that may be
  closed, capping achievable progress in a way retrying won't fix; progress is
  area-weighted, so a closed small room costs only a few points. The evening zone
  is not handled here -- nothing docks it mid-run, so Vacuum Evening Cleaning
  marks it done when it commands the job.
triggers:
  - trigger: state
    entity_id: vacuum.living_room_vacuum
    to: returning
    alias: Vacuum starts returning to dock
conditions: []
actions:
  - alias: Daytime zone returning and cleared its threshold
    if:
      - condition: state
        entity_id: input_select.vacuum_active_zone
        state: daytime
        alias: Daytime zone commanded the current job
      - condition: numeric_state
        entity_id: input_number.vacuum_daytime_max_progress
        above: 65
        alias: Daytime max progress cleared 65%
    then:
      - alias: Mark daytime zone ran today
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuum_ran_daytime
mode: single
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
