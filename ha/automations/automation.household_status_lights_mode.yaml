id: '1787020051576'
alias: 'Household: Status Lights Mode'
description: >-
  Keeps the entrance, kitchen, and living room night lamps in sync with
  guest mode and sleep state, in priority order: guest mode (green)
  overrides everyone sleeping (warm white), which overrides off.


  - Guest mode is the visual indicator that a non-household member is
  present; it takes priority since it's the state most useful to see while
  people are awake and moving through the house.

  - Everyone sleeping falls back to the same warm white/low brightness look
  used for night navigation, so these lights still work as nav lights
  overnight even without guest mode active.

  - Targets these three lights by literal entity_id (not the former Status
  Light label) so the color/brightness pickers remain usable in the
  automation editor's GUI — label/area targets can't be resolved to a fixed
  entity set at design time, so the editor can't inspect supported color
  modes and falls back to YAML-only for that action's data. Adding a new
  status light requires manually adding it to entity_id here.

  - Owns light.entrance_night_lamp for this purpose — Household: Configure
  Home for Sleep no longer targets it, so exactly one automation writes to
  any of these entities.
triggers:
  - trigger: homeassistant
    event: start
    id: ha_started
    alias: HA started
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.guest_mode
    options:
      behavior: each
      for: '00:00:00'
    id: guest_on
    alias: Guest mode turns on
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.guest_mode
    options:
      behavior: each
      for: '00:00:00'
    id: guest_off
    alias: Guest mode turns off
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: '00:00:00'
    id: sleep_on
    alias: Everyone goes to sleep
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: '00:00:00'
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - alias: Delay on startup to let integrations initialize
    if:
      - condition: trigger
        id:
          - ha_started
        alias: Triggered by HA start
    then:
      - delay:
          seconds: 30
        alias: Wait 30 seconds for integrations to initialize
  - alias: Determine status light state
    choose:
      - alias: Guest mode is on
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: 'on'
            alias: Guest mode is on
        sequence:
          - alias: Set status lights to green (guest mode)
            action: light.turn_on
            target:
              entity_id:
                - light.entrance_night_lamp
                - light.kitchen_night_lamp
                - light.living_room_night_lamp
            data:
              rgb_color:
                - 0
                - 249
                - 0
              brightness_pct: 65
      - alias: Everyone is sleeping
        conditions:
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: 'on'
            alias: Everyone is sleeping
        sequence:
          - alias: Set status lights to warm white (sleeping)
            action: light.turn_on
            target:
              entity_id:
                - light.entrance_night_lamp
                - light.kitchen_night_lamp
                - light.living_room_night_lamp
            data:
              color_temp_kelvin: 2350
              brightness_pct: 65
    default:
      - alias: Turn off status lights
        action: light.turn_off
        target:
          entity_id:
            - light.entrance_night_lamp
            - light.kitchen_night_lamp
            - light.living_room_night_lamp
mode: single
category: 01M08MMBZ719V4GZ2FT10RPTJ2
