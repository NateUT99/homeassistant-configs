id: '1787020051576'
alias: 'Household: Status Lights Mode'
description: >-
  Keeps the entrance and all three living room status lamps in sync with
  guest mode and sleep state, in priority order: guest mode (green)
  overrides everyone sleeping (warm white), which overrides off. Guest mode
  takes priority since it's the most useful indicator to see while people
  are awake; sleeping mode doubles as a warm-white nav light overnight.
triggers:
  - trigger: homeassistant
    event: start
    id: ha_started
    alias: HA started
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.guest_mode
    options:
      behavior: each
      for: '00:00:00'
    id: guest_on
    alias: Guest mode turns on
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.guest_mode
    options:
      behavior: each
      for: '00:00:00'
    id: guest_off
    alias: Guest mode turns off
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: '00:00:00'
    id: sleep_on
    alias: Everyone goes to sleep
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.everyone_sleeping
    options:
      behavior: each
      for: '00:00:00'
    id: sleep_off
    alias: Everyone wakes up
conditions: []
actions:
  - alias: Delay on startup to let integrations initialize
    if:
      - condition: trigger
        id:
          - ha_started
        alias: Triggered by HA start
    then:
      - delay:
          seconds: 30
        alias: Wait 30 seconds for integrations to initialize
  - alias: Determine status light state
    choose:
      - alias: Guest mode is on
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: 'on'
            alias: Guest mode is on
        sequence:
          - alias: Set status lights to green (guest mode)
            action: light.turn_on
            target:
              entity_id:
                - light.entrance_status_lamp
                - light.living_room_status_lamp_2
                - light.living_room_status_lamp_1
                - light.living_room_mantle_status_light
            data:
              rgb_color:
                - 0
                - 249
                - 0
              brightness_pct: 50
      - alias: Everyone is sleeping
        conditions:
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: 'on'
            alias: Everyone is sleeping
        sequence:
          - alias: Set status lights to warm white (sleeping)
            action: light.turn_on
            target:
              entity_id:
                - light.entrance_status_lamp
                - light.living_room_status_lamp_2
                - light.living_room_status_lamp_1
                - light.living_room_mantle_status_light
            data:
              color_temp_kelvin: 2000
              brightness_pct: 50
    default:
      - alias: Turn off status lights
        action: light.turn_off
        target:
          entity_id:
            - light.entrance_status_lamp
            - light.living_room_status_lamp_2
            - light.living_room_status_lamp_1
            - light.living_room_mantle_status_light
mode: single
category: 01M08MMBZ719V4GZ2FT10RPTJ2
