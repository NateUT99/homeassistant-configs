id: "1789947413384"
alias: "Household: Trash Pickup"
description: >-
  Trash is a persistent oneshot chore on calendar.household_chores (summary:
  Take Out Trash & Recycling; found by its uid, so a rename never breaks this), synced from calendar.family. Three jobs, split by trigger
  id.


  **Sync** (18:00 daily, HA start, manual run): only acts when the chore is
  unscheduled or completed -- finds the first calendar.family event matching
  Trash past the chore's current due (or today, if unscheduled), and writes
  it via chore_calendar.update_item (oneshot.due_datetime plus description
  carrying the matched event's exact summary, e.g. Trash & Recycling
  Pickup). An open chore is left untouched, which makes this restart-safe
  with no floor/bump logic needed. If the search finds nothing, pushes a
  one-time tag-replaced warning; clears it once a match is found again.


  **Escalate** (every 30 minutes, 19:00-23:30, if due today -- due is the
  evening-before deadline, not the truck's arrival time): announces via
  script.household_tts_announce only while someone is home and nobody is
  asleep (everyone_sleeping and avery_sleeping both off). The chore's own
  description (written by Sync) tells a trash-only week from a Trash &
  Recycling week apart -- no separate helper. On a trash-only week the
  chore is marked complete right after the first successful announcement,
  silencing every later tick the same way the card's own mark-done does; a
  Trash & Recycling week keeps escalating every 30 minutes until marked
  done by hand.


  **Wake-up** (on the household waking up, if due yesterday -- the
  deadline was missed overnight): the same announcement and week-type
  auto-complete, targeted explicitly at the master bedroom since
  everyone_sleeping has just gone off.


  No push from this automation -- marking the chore done (by hand, or
  automatically on a trash-only week) silences every remaining reminder
  for that cycle, and chore_calendar.update_item's due edit reopens it
  automatically at the next sync.
triggers:
  - trigger: time
    at: "18:00:00"
    id: sync_evening
    alias: "18:00 daily calendar sync"
  - trigger: homeassistant
    event: start
    id: sync_recover
    alias: "HA start recovery sync"
  - trigger: time
    at:
      - "19:00:00"
      - "19:30:00"
      - "20:00:00"
      - "20:30:00"
      - "21:00:00"
      - "21:30:00"
      - "22:00:00"
      - "22:30:00"
      - "23:00:00"
      - "23:30:00"
    id: escalate
    alias: "Every 30 minutes, 19:00-23:30"
  - trigger: state
    entity_id: input_boolean.everyone_sleeping
    from: "on"
    to: "off"
    id: wakeup
    alias: "Household wakes up"
  - trigger: event
    event_type: household_task_debug
    event_data:
      branch: escalate
    id: escalate
    alias: "Debug: evening reminder"
  - trigger: event
    event_type: household_task_debug
    event_data:
      branch: wakeup
    id: wakeup
    alias: "Debug: wake-up reminder"
  - trigger: event
    event_type: household_task_debug
    event_data:
      branch: sync
    id: sync_evening
    alias: "Debug: sync"
conditions:
  - condition: not
    alias: "Chore list is available"
    conditions:
      - condition: state
        entity_id: todo.household_chores
        state:
          - unavailable
          - unknown
        alias: "Chore list is unavailable or unknown"
actions:
  - action: todo.get_items
    alias: "Read the trash chore"
    target:
      entity_id: todo.household_chores
    data:
      status:
        - needs_action
        - completed
    response_variable: all_result
  - alias: "Isolate it by uid"
    note: >-
      Matched on the chore's uid rather than its summary, so renaming the chore
      on the card cannot silently orphan this automation.
    variables:
      trash: "{{ (all_result.get('todo.household_chores', {}).get('items', []) | selectattr('uid', 'eq', 'ab02f24c-f9f8-4def-9085-706634af2ef4') | list | first) | default(none) }}"
  - alias: "Classify the week from the chore's description"
    note: >-
      The sync writes the matched calendar event's exact summary here, so
      no separate helper is needed. Polarity is deliberate: only a
      positively identified trash-only week auto-completes. A missing or
      unparseable description falls through to the full recycling-week
      escalation, which is the safe failure -- it over-reminds rather than
      silently closing a cycle that was never handled.
    variables:
      trash_only: "{{ trash is not none and (trash.get('description','') ~ '') != '' and 'recycl' not in ((trash.get('description','') ~ '') | lower) }}"
  - alias: "Route by trigger"
    choose:
      - alias: "Escalate -- due today (evening deadline)"
        conditions:
          - condition: trigger
            id: escalate
            alias: "Triggered by an evening tick"
        sequence:
          - alias: "Announce if due today, not done, home, and awake"
            if:
              - condition: template
                value_template: "{{ trash is not none and trash.get('status') != 'completed' and (trash.get('due','') ~ '')[:10] == now().date() | string }}"
                alias: "Due today and not yet completed"
              - condition: numeric_state
                entity_id: zone.home
                above: 0
                alias: "Someone is home"
              - condition: state
                entity_id: input_boolean.everyone_sleeping
                state: "off"
                alias: "Nobody is asleep"
                note: >-
                  The escalate branch fires on a fixed clock regardless of
                  household sleep state, unlike the wake-up branch below
                  (which only fires on the asleep-to-awake edge and so
                  never needs this gate). Without it, a 30-minute tick
                  would announce into a sleeping house.
              - condition: state
                entity_id: input_boolean.avery_sleeping
                state: "off"
                alias: "Avery is not asleep"
                note: >-
                  script.household_tts_announce only drops Avery's room
                  from a broadcast target when she's asleep -- an auto
                  target still resolves to kitchen or the living room
                  AppleTV, both audible from her room, so the suppression
                  has to happen here instead.
            then:
              - action: script.household_tts_announce
                alias: "Speak the evening reminder"
                data:
                  message: "Don't forget, {{ trash.get('description') or trash.summary }} is tomorrow."
                  target: auto
                  notification_title: "Pickup Tomorrow"
                  critical_fallback: false
              - alias: "Assume it's handled on a trash-only week"
                note: >-
                  Runs only after the announcement action returns, so the
                  chore closes once a reminder has actually been
                  delivered. Completing it is the same silencer the
                  card's mark-done uses -- every later tick no-ops on the
                  status check above, which is what makes this the single
                  reminder for the cycle. The next sync reopens it
                  (update_item's due edit clears the completed oneshot's
                  terminal flag).
                if:
                  - condition: template
                    value_template: "{{ trash_only }}"
                    alias: "Trash-only week"
                then:
                  - action: todo.update_item
                    alias: "Mark the trash chore complete"
                    target:
                      entity_id: todo.household_chores
                    data:
                      item: "{{ trash.uid }}"
                      status: completed
      - alias: "Wake-up -- due yesterday (pickup morning)"
        conditions:
          - condition: trigger
            id: wakeup
            alias: "Triggered by everyone waking up"
        sequence:
          - alias: "Announce if due yesterday and not done"
            if:
              - condition: template
                value_template: "{{ trash is not none and trash.get('status') != 'completed' and (trash.get('due','') ~ '')[:10] == (now().date() - timedelta(days=1)) | string }}"
                alias: "Due yesterday and not yet completed"
            then:
              - action: script.household_tts_announce
                alias: "Speak the wake-up reminder"
                note: >-
                  target explicit master_bedroom, not auto --
                  everyone_sleeping has just gone off.
                data:
                  message: "Today is {{ trash.get('description') or trash.summary }}. It still needs to go out."
                  target: master_bedroom
                  notification_title: "Pickup Today"
                  critical_fallback: false
              - alias: "Assume it's handled on a trash-only week"
                note: >-
                  Same auto-complete as the evening branch -- see that
                  branch's note. Reached here on the morning-of safety
                  net rather than the evening tick, e.g. nobody was home
                  the evening before.
                if:
                  - condition: template
                    value_template: "{{ trash_only }}"
                    alias: "Trash-only week"
                then:
                  - action: todo.update_item
                    alias: "Mark the trash chore complete"
                    target:
                      entity_id: todo.household_chores
                    data:
                      item: "{{ trash.uid }}"
                      status: completed
      - alias: "Sync -- scheduled 18:00 or HA start"
        conditions:
          - condition: trigger
            id:
              - sync_evening
              - sync_recover
            alias: "Triggered by scheduled sync or HA start"
        sequence:
          - alias: "Delay only on the HA-start path"
            if:
              - condition: trigger
                id: sync_recover
                alias: "Triggered by HA start"
            then:
              - delay: "00:02:00"
                alias: "Let Remote Calendar settle after a restart"
          - alias: "Only search when the chore is unscheduled or completed"
            if:
              - condition: template
                value_template: "{{ trash is not none and (trash.get('status') == 'completed' or (trash.get('due','') ~ '') == '') }}"
                alias: "Chore is unscheduled or already completed"
            then:
              - alias: "Compute the search floor"
                note: >-
                  +2 days, not +1 -- cur_due is now the evening-before
                  deadline date, so the actual pickup day is cur_due+1;
                  the floor must clear that pickup day too, or the search
                  re-matches the cycle that was just completed.
                variables:
                  cur_due: "{{ (trash.get('due','') ~ '')[:10] }}"
                  floor: "{{ (as_datetime(cur_due).date() + timedelta(days=2)) | string if cur_due != '' else now().date() | string }}"
              - action: calendar.get_events
                alias: "Query calendar.family"
                target:
                  entity_id: calendar.family
                data:
                  start_date_time: "{{ today_at('00:00') }}"
                  duration:
                    days: 21
                response_variable: cal_result
              - alias: "Find the first matching event past the floor"
                variables:
                  hit: "{{ (cal_result.get('calendar.family', {}).get('events', []) | selectattr('start', 'ge', floor) | selectattr('summary', 'search', 'Trash') | list | first) | default(none) }}"
              - alias: "Update the chore if a match was found, else warn"
                if:
                  - condition: template
                    value_template: "{{ hit is not none }}"
                    alias: "A matching pickup event was found"
                then:
                  - action: chore_calendar.update_item
                    alias: "Write the matched pickup date"
                    note: >-
                      entity_id goes in data:, not target: -- this
                      service's schema wants a plain string, and
                      target: always expands to a list, which this
                      service rejects.
                    data:
                      item: "{{ trash.uid }}"
                      oneshot:
                        due_datetime: "{{ (as_datetime(hit.start[:10]).replace(hour=19, minute=0, second=0) - timedelta(days=1)).isoformat() }}"
                      description: "{{ hit.summary }}"
                      entity_id: calendar.household_chores
                  - action: notify.mobile_app_nates_iphone
                    alias: "Clear any stale not-found warning"
                    data:
                      message: clear_notification
                      data:
                        tag: trash_sync_warning
                else:
                  - action: notify.mobile_app_nates_iphone
                    alias: "Warn that no pickup event was found"
                    data:
                      title: "Trash Pickup Not Found"
                      message: "No upcoming pickup event matched in calendar.family within 21 days. Check the iCloud subscription."
                      data:
                        tag: trash_sync_warning
mode: single
category: 01M0XF7RJK5EX3A4YPNEX7X3DG
