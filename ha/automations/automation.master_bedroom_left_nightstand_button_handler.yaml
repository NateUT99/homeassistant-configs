id: "1787368091654"
alias: "Master Bedroom: Left Nightstand Button Handler"
description: >-
  Handles button presses on the left nightstand remote: short press toggles
  the nightstand lamp, long press turns it off. Double press is reserved for
  future use.
triggers:
  - alias: Short press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:d8:e7:98"
      command: single
    id: short_press
  - alias: Double press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:d8:e7:98"
      command: double
    id: double_press
  - alias: Long press
    trigger: event
    event_type: zha_event
    event_data:
      device_ieee: "00:15:8d:00:0a:d8:e7:98"
      command: hold
    id: long_press
conditions: []
actions:
  - alias: Handle button press
    choose:
      - alias: "Short press: toggle lamp"
        conditions:
          - alias: Trigger was short press
            condition: trigger
            id: ["short_press"]
        sequence:
          - alias: Toggle left nightstand lamp
            action: light.toggle
            target:
              entity_id: light.master_bedroom_left_nightstand_lamp
      - alias: "Long press: turn off lamp"
        conditions:
          - alias: Trigger was long press
            condition: trigger
            id: ["long_press"]
        sequence:
          - alias: Turn off left nightstand lamp
            action: light.turn_off
            target:
              entity_id: light.master_bedroom_left_nightstand_lamp
mode: single
