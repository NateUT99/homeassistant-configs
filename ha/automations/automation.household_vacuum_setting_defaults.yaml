id: "1790625034812"
alias: "Household: Vacuum Setting Defaults"
description: >-
  Restores device defaults after each relevant event so no job-starting
  automation needs to manage them: fan speed resets to max whenever the
  vacuum docks (undoing the nightly quiet pass or the master-suite mop's
  balanced speed), and mop intensity resets to high whenever the pad clips
  on (undoing any manual drop to medium). See guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: state
    entity_id: vacuum.living_room_vacuum
    to: docked
    id: docked
    alias: Vacuum returns to the dock
  - trigger: state
    entity_id: binary_sensor.living_room_vacuum_mop_attached
    to: "on"
    id: mop_attached
    alias: Mop pad clips on
conditions: []
actions:
  - choose:
      - alias: Vacuum docked -- reset fan speed to max
        conditions:
          - condition: trigger
            id: [docked]
        sequence:
          - alias: Reset fan speed to max
            action: vacuum.set_fan_speed
            target:
              entity_id: vacuum.living_room_vacuum
            data:
              fan_speed: max
      - alias: Mop pad clipped on -- set high mop intensity
        conditions:
          - condition: trigger
            id: [mop_attached]
        sequence:
          - alias: Set high mop intensity
            action: select.select_option
            target:
              entity_id: select.living_room_vacuum_mop_intensity
            data:
              option: high
mode: queued
max: 3
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
