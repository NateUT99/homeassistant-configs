id: "1790625034812"
alias: "Household: Vacuum Setting Defaults"
description: >-
  Restores mop intensity to high whenever the pad clips on, undoing any
  manual drop to medium. Fan speed used to be reset here on every dock too,
  but each job-starting automation now sets its own fan speed explicitly at
  start (matching Evening Cleaning's and the master-suite follow-up's own
  pattern), so that responsibility moved out -- see
  guides/vacuum_cleaning_routine.md.
triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_vacuum_mop_attached
    to: "on"
    id: mop_attached
    alias: Mop pad clips on
conditions: []
actions:
  - alias: Set high mop intensity
    action: select.select_option
    target:
      entity_id: select.living_room_vacuum_mop_intensity
    data:
      option: high
mode: single
category: 01M0SZBV5BGDGY2BQ2GBB5NA4C
