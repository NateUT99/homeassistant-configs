alias: "Household: Vacuum Mop Now"
description: >-
  Ad hoc button for an immediate mop pass over the six common-area rooms
  (Kitchen, Utility Room, Pantry, Living Room, Bathroom, Entrance) -- the
  same rooms and settings as the automatic weekly mop branch in Household:
  Vacuum Evening Cleaning. Skips with a push notification, naming the
  reason, if the pad isn't on, the water module isn't seated, the tank is
  empty, or the vacuum is already cleaning. Counts as this week's
  common-area mop, so the automatic evening pass won't try to mop again
  this week. See guides/vacuum_cleaning_routine.md.
sequence:
  - alias: Run only if the pad, water module, tank, and vacuum all allow it
    if:
      - condition: state
        entity_id: binary_sensor.living_room_vacuum_mop_attached
        state: "on"
        alias: Mop pad is clipped on
      - condition: state
        entity_id: binary_sensor.living_room_vacuum_water_box_attached
        state: "on"
        alias: 2-in-1 dustbin + water module is seated
      - condition: state
        entity_id: binary_sensor.living_room_vacuum_water_shortage
        state: "off"
        alias: Water tank is not empty
      - condition: not
        alias: Vacuum is not currently cleaning
        conditions:
          - condition: state
            entity_id: vacuum.living_room_vacuum
            state: cleaning
    then:
      - alias: Set active zone to evening
        action: input_select.select_option
        target:
          entity_id: input_select.vacuum_active_zone
        data:
          option: evening
      - alias: Set quiet fan speed
        action: vacuum.set_fan_speed
        target:
          entity_id: vacuum.living_room_vacuum
        data:
          fan_speed: quiet
      - alias: Set high mop intensity
        action: select.select_option
        target:
          entity_id: select.living_room_vacuum_mop_intensity
        data:
          option: high
      - alias: Vacuum and mop in a single pass
        action: select.select_option
        target:
          entity_id: select.living_room_vacuum_cleaning_mode
        data:
          option: vac_and_mop
      - alias: Start the vac-and-mop segment clean of all six common-area rooms
        action: vacuum.send_command
        target:
          entity_id: vacuum.living_room_vacuum
        data:
          command: app_segment_clean
          params:
            - segments: [17, 22, 23, 24, 25, 26]
              repeat: 1
        note: >-
          Kitchen, Utility Room, Pantry, Living Room, Bathroom, Entrance.
          Segment 28 (Stairs) is never included -- fall hazard, backstopped
          by an app virtual wall. See LESSONS.md before editing segment IDs.
      - alias: Mark common-area mop done this week
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
        note: >-
          Counts this ad hoc run as the week's mop -- the automatic evening
          pass checks this flag and won't mop again this week. Deliberately
          does not touch vacuum_ran_evening, so tonight's ordinary
          common-area vacuum pass still runs on its own schedule.
    else:
      - alias: Tell Nate the mop pass was skipped, and why
        action: notify.send_message
        target:
          entity_id: notify.nates_iphone
        data:
          title: Vacuum
          message: >-
            Mop pass skipped -- {{ 'the mop pad is off' if
            is_state('binary_sensor.living_room_vacuum_mop_attached', 'off')
            else ("the water module isn't seated" if
            is_state('binary_sensor.living_room_vacuum_water_box_attached',
            'off') else ('the water tank is empty' if
            is_state('binary_sensor.living_room_vacuum_water_shortage', 'on')
            else 'the vacuum is already cleaning')) }}.
mode: single
