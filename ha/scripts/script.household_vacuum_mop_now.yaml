alias: "Household: Vacuum Mop Now"
description: >-
  Ad hoc button for an immediate mop pass over the six common-area rooms,
  through Household: Vacuum Start Job (job common_mop). Pushes the reason if
  the start script refuses. Counts as this week's common-area mop, so the
  automatic evening pass won't try to mop again this week. See
  guides/vacuum_cleaning_routine.md.
sequence:
  - alias: Start the common-area mop
    action: script.household_vacuum_start_job
    data:
      job: common_mop
    response_variable: start
    note: >-
      The start script owns the rooms, settings, and hardware checks (pad,
      water module, tank, mid-job).
  - alias: Count it as this week's mop, or say why it was skipped
    if:
      - condition: template
        value_template: "{{ start.started }}"
        alias: The job started
    then:
      - alias: Mark common-area mop done this week
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuum_mop_common_areas_done_this_week
        note: >-
          The automatic evening pass checks this flag and won't mop again this
          week. Deliberately does not touch vacuum_ran_evening, so tonight's
          ordinary vacuum pass still runs.
    else:
      - alias: Tell Nate the mop pass was skipped, and why
        action: notify.send_message
        target:
          entity_id: notify.nates_iphone
        data:
          title: Vacuum
          message: Mop pass skipped -- {{ start.reason }}.
mode: single
