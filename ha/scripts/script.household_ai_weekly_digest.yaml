alias: 'Household: AI Weekly Digest'
description: 'Sunday-evening week in review. The numbers are computed here, not by Claude: electricity
  this week vs the week before (long-term statistics, cost at the $0.2033/kWh rate in the Energy settings),
  heating and cooling runtime, vacuum coverage (day and night cycles from the this-week counters, Monday
  08:05 onward, plus this week''s mop and master-suite follow-up flags), and chores completed or overdue.
  Claude (ai_task.claude_haiku_ai_task) writes only a one-line headline. Fired as household_ai_weekly_digest_ready
  and stored by sensor.household_ai_weekly_digest. Runs on the AI Insights Schedule. See guides/ai_insights.md.'
icon: mdi:calendar-week
mode: single
max_exceeded: silent
sequence:
- alias: Get two weeks of daily statistics
  action: recorder.get_statistics
  data:
    start_time: '{{ (now() - timedelta(days=14)).strftime(''%Y-%m-%d %H:%M:%S'') }}'
    statistic_ids:
    - sensor.household_energy_monitor_total_energy_delivered
    - sensor.household_hvac_heating_runtime_today
    - sensor.household_hvac_cooling_runtime_today
    period: day
    types:
    - change
  response_variable: stats
- alias: Compute the week
  variables:
    cutoff: '{{ (now() - timedelta(days=7)).isoformat() }}'
    energy_kwh: '{{ stats.statistics.get(''sensor.household_energy_monitor_total_energy_delivered'', [])
      | selectattr(''start'', ''ge'', cutoff) | map(attribute=''change'') | map(''float'', 0) | sum |
      round(1) }}'
    energy_prev_kwh: '{{ stats.statistics.get(''sensor.household_energy_monitor_total_energy_delivered'',
      []) | selectattr(''start'', ''lt'', cutoff) | map(attribute=''change'') | map(''float'', 0) | sum
      | round(1) }}'
    energy_cost: '{{ (energy_kwh * 0.2033) | round(2) }}'
    heating_h: '{{ stats.statistics.get(''sensor.household_hvac_heating_runtime_today'', []) | selectattr(''start'',
      ''ge'', cutoff) | map(attribute=''change'') | map(''float'', 0) | sum | round(1) }}'
    cooling_h: '{{ stats.statistics.get(''sensor.household_hvac_cooling_runtime_today'', []) | selectattr(''start'',
      ''ge'', cutoff) | map(attribute=''change'') | map(''float'', 0) | sum | round(1) }}'
    vacuum_day_runs: '{{ states(''sensor.household_vacuum_day_runs_this_week'') | int(0) }}'
    vacuum_night_runs: '{{ states(''sensor.household_vacuum_night_runs_this_week'') | int(0) }}'
    mop_common_done: '{{ is_state(''input_boolean.vacuum_mop_common_areas_done_this_week'', ''on'') }}'
    mop_master_done: '{{ is_state(''input_boolean.vacuum_mop_master_suite_done_this_week'', ''on'') }}'
    chores_done: '{{ expand(integration_entities(''chore_calendar'') | select(''match'', ''sensor\\.'')
      | list) | selectattr(''attributes.last_completed'', ''defined'') | selectattr(''attributes.last_completed'',
      ''ne'', none) | selectattr(''attributes.last_completed'', ''ge'', cutoff) | map(attribute=''name'')
      | map(''replace'', ''Household Chores '', '''') | list }}'
    chores_overdue: '{{ expand(integration_entities(''chore_calendar'') | select(''match'', ''sensor\\.'')
      | list) | selectattr(''state'', ''eq'', ''overdue'') | map(attribute=''name'') | map(''replace'',
      ''Household Chores '', '''') | list }}'
- alias: Ask Claude for a one-line headline
  action: ai_task.generate_data
  data:
    task_name: household_ai_weekly_digest
    entity_id: ai_task.claude_haiku_ai_task
    instructions: |-
      Write a one-line headline for a family's weekly home recap. The numbers are shown separately; your line sums up the week in a few words.

      Voice: friendly and a little playful, like a sharp, good-humored house manager. A light touch of wit, or a bit of attitude when something was clearly neglected. Never snarky about people, never cutesy, no emoji.

      Rules:
      - headline: 70 characters or fewer.
      - Use only the facts below. Don't explain why numbers changed. Never invent anything.

      Facts:
      Electricity: {{ energy_kwh }} kWh this week (about ${{ energy_cost }}), {{ energy_prev_kwh }} kWh the week before.
      Heating: {{ heating_h }} h. Cooling: {{ cooling_h }} h.
      Vacuum: {{ vacuum_day_runs }} daytime and {{ vacuum_night_runs }} night cycles; mop pass {{ 'done' if mop_common_done else 'not done' }}; master suite follow-up {{ 'done' if mop_master_done else 'not done' }}.
      Chores completed: {{ chores_done | join(', ') if chores_done else 'none' }}. Overdue: {{ chores_overdue | join(', ') if chores_overdue else 'none' }}.
    structure:
      headline:
        description: One line, 70 characters or fewer
        required: true
        selector:
          text: {}
  response_variable: result
- alias: Store the digest
  event: household_ai_weekly_digest_ready
  event_data:
    headline: '{{ (result.data.headline | default('''') | string)[:80] }}'
    energy_kwh: '{{ energy_kwh }}'
    energy_prev_kwh: '{{ energy_prev_kwh }}'
    energy_cost: '{{ energy_cost }}'
    heating_h: '{{ heating_h }}'
    cooling_h: '{{ cooling_h }}'
    vacuum_day_runs: '{{ vacuum_day_runs }}'
    vacuum_night_runs: '{{ vacuum_night_runs }}'
    mop_common_done: '{{ mop_common_done }}'
    mop_master_done: '{{ mop_master_done }}'
    chores_done: '{{ chores_done }}'
    chores_overdue: '{{ chores_overdue }}'
