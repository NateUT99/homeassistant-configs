alias: "Office: Ceiling Fan LED State"
description: >-
  Sets the Office ceiling-fan switch LED bar to its correct steady state:
  the running fan's speed colour (Cyan/Blue/Violet) at intensity 25 by day
  / 5 at night while someone is home, a white locator glow at intensity 3
  by day / 5 at night when the fan and the ceiling light are both off and
  someone is home, or dark when nobody is home. Night uses one shared
  intensity (5) for both states - simpler than two different night values,
  and it makes the locator glow brighter at night than by day for
  findability. Day vs night is input_boolean.everyone_sleeping - identical
  rule in every room (Office, Master Bedroom, Avery's Room); sleep no
  longer turns the bar off anywhere, it only dims it. Recomputed entirely
  from live state on every call - no snapshot, no timers, no animation.
  Every write is skipped when the target already holds the desired value.
  Called by Office: Ceiling Fan Wall Control on fan-speed and
  ceiling-light changes, and by Household: Ceiling Fan Switch LED Locator
  on presence/sleep changes and HA start.
mode: restart
sequence:
  - alias: Resolve the current speed's colour and the day/night intensities
    variables:
      speed_colour: >-
        {% set p = state_attr('fan.office_ceiling_fan', 'percentage') | int(0) %}
        {{ 'Cyan' if p < 45 else ('Violet' if p >= 78 else 'Blue') }}
      fan_intensity: "{{ '5' if is_state('input_boolean.everyone_sleeping', 'on') else '25' }}"
      locator_intensity: "{{ '5' if is_state('input_boolean.everyone_sleeping', 'on') else '3' }}"
  - alias: Effect channel always stays Solid - skip if already set
    note: >-
      A same-value write can still trigger the switch's own transition ramp
      and costs a Matter round-trip for nothing, since nothing in this
      design ever selects an animation.
    if:
      - condition: not
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: select.office_ceiling_fan_switch_led_effect
                state: "Solid"
    then:
      - action: select.select_option
        target:
          entity_id: select.office_ceiling_fan_switch_led_effect
        data:
          option: "Solid"
  - alias: Apply the resting state
    choose:
      - alias: Fan running and someone home - persistent speed colour, dimmer at night
        conditions:
          - condition: state
            entity_id: fan.office_ceiling_fan
            state: "on"
            alias: Fan is on
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
        sequence:
          - alias: Speed colour on the native LED channel - skip if already correct
            if:
              - condition: template
                value_template: "{{ states('select.office_ceiling_fan_switch_led_color') != speed_colour }}"
                alias: Colour needs to change
            then:
              - action: select.select_option
                target:
                  entity_id: select.office_ceiling_fan_switch_led_color
                data:
                  option: "{{ speed_colour }}"
          - alias: Set both intensities together at the day/night fan level - skip if already correct
            note: >-
              Intensity(On) and (Off) always move together - the switch's
              internal relay toggles on every paddle press and picks between
              them, so a split value would make the bar blink.
            if:
              - condition: template
                value_template: "{{ states('select.office_ceiling_fan_switch_led_intensity_on') != fan_intensity }}"
                alias: Intensity needs to change
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.office_ceiling_fan_switch_led_intensity_on
                    - select.office_ceiling_fan_switch_led_intensity_off
                data:
                  option: "{{ fan_intensity }}"
      - alias: Fan and light both off, someone home - locator glow, brighter at night
        conditions:
          - condition: state
            entity_id: fan.office_ceiling_fan
            state: "off"
            alias: Fan is off
          - condition: state
            entity_id: light.office_ceiling_fan_light
            state: "off"
            alias: Ceiling light is off
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
        sequence:
          - alias: Resting colour is white - skip if already correct
            if:
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: select.office_ceiling_fan_switch_led_color
                        state: "White"
            then:
              - action: select.select_option
                target:
                  entity_id: select.office_ceiling_fan_switch_led_color
                data:
                  option: "White"
          - alias: Set both intensities together at the day/night locator level - skip if already correct
            if:
              - condition: template
                value_template: "{{ states('select.office_ceiling_fan_switch_led_intensity_on') != locator_intensity }}"
                alias: Intensity needs to change
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.office_ceiling_fan_switch_led_intensity_on
                    - select.office_ceiling_fan_switch_led_intensity_off
                data:
                  option: "{{ locator_intensity }}"
    default:
      - alias: Otherwise dark - ceiling light is on, or nobody home
        if:
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: select.office_ceiling_fan_switch_led_intensity_on
                    state: "0"
        then:
          - action: select.select_option
            target:
              entity_id:
                - select.office_ceiling_fan_switch_led_intensity_on
                - select.office_ceiling_fan_switch_led_intensity_off
            data:
              option: "0"
