alias: "Avery's Room: Ceiling Fan LED State"
description: >-
  Sets the Avery's Room ceiling-fan switch LED bar to its correct steady
  state: the running fan's speed colour (Cyan/Blue/Violet) at intensity 25
  by day / 3 at night while someone is home, a white locator glow at
  intensity 3 (same day or night) when the fan and the ceiling light are
  both off and someone is home, or dark when nobody is home. Night is
  input_boolean.everyone_sleeping OR input_boolean.avery_sleeping - her
  room dims as soon as she goes to bed, even if the rest of the household
  is still awake, not just when everyone_sleeping catches up.
  binary_sensor.avery_home_today does not factor into this feature at
  all - presence (zone.home) alone gates dark vs lit, so a stale personal
  flag can only ever affect which of two dim brightness levels is picked,
  never leave the room fully dark. Recomputed entirely from live state on
  every call - no snapshot, no timers, no animation. Every write is
  skipped when the target already holds the desired value. Called by
  Avery's Room: Ceiling Fan Wall Control on fan-speed and ceiling-light
  changes, and by Household: Ceiling Fan Switch LED Locator on
  presence/sleep changes and HA start.
mode: restart
sequence:
  - alias: Resolve the current speed's colour and the day/night fan intensity
    variables:
      speed_colour: >-
        {% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}
        {{ 'Cyan' if p < 45 else ('Violet' if p >= 78 else 'Blue') }}
      fan_intensity: "{{ '3' if is_state('input_boolean.everyone_sleeping', 'on') or is_state('input_boolean.avery_sleeping', 'on') else '25' }}"
  - alias: Effect channel always stays Solid - skip if already set
    note: >-
      A same-value write can still trigger the switch's own transition ramp
      and costs a Matter round-trip for nothing, since nothing in this
      design ever selects an animation.
    if:
      - condition: not
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: select.averys_room_ceiling_fan_switch_led_effect
                state: "Solid"
    then:
      - action: select.select_option
        target:
          entity_id: select.averys_room_ceiling_fan_switch_led_effect
        data:
          option: "Solid"
  - alias: Apply the resting state
    choose:
      - alias: Fan running and someone home - persistent speed colour, dimmer at night
        conditions:
          - condition: state
            entity_id: fan.averys_room_ceiling_fan
            state: "on"
            alias: Fan is on
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
        sequence:
          - alias: Speed colour on the native LED channel - skip if already correct
            if:
              - condition: template
                value_template: "{{ states('select.averys_room_ceiling_fan_switch_led_color') != speed_colour }}"
                alias: Colour needs to change
            then:
              - action: select.select_option
                target:
                  entity_id: select.averys_room_ceiling_fan_switch_led_color
                data:
                  option: "{{ speed_colour }}"
          - alias: Set both intensities together at the day/night fan level - skip if already correct
            note: >-
              Intensity(On) and (Off) always move together - the switch's
              internal relay toggles on every paddle press and picks between
              them, so a split value would make the bar blink.
            if:
              - condition: template
                value_template: "{{ states('select.averys_room_ceiling_fan_switch_led_intensity_on') != fan_intensity }}"
                alias: Intensity needs to change
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.averys_room_ceiling_fan_switch_led_intensity_on
                    - select.averys_room_ceiling_fan_switch_led_intensity_off
                data:
                  option: "{{ fan_intensity }}"
      - alias: Fan and light both off, someone home - locator glow
        conditions:
          - condition: state
            entity_id: fan.averys_room_ceiling_fan
            state: "off"
            alias: Fan is off
          - condition: state
            entity_id: light.averys_room_ceiling_fan_light
            state: "off"
            alias: Ceiling light is off
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
        sequence:
          - alias: Resting colour is white - skip if already correct
            if:
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: select.averys_room_ceiling_fan_switch_led_color
                        state: "White"
            then:
              - action: select.select_option
                target:
                  entity_id: select.averys_room_ceiling_fan_switch_led_color
                data:
                  option: "White"
          - alias: Set both intensities together at the locator level - skip if already correct
            if:
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: select.averys_room_ceiling_fan_switch_led_intensity_on
                        state: "3"
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.averys_room_ceiling_fan_switch_led_intensity_on
                    - select.averys_room_ceiling_fan_switch_led_intensity_off
                data:
                  option: "3"
    default:
      - alias: Otherwise dark - ceiling light is on, or nobody home
        if:
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: select.averys_room_ceiling_fan_switch_led_intensity_on
                    state: "0"
        then:
          - action: select.select_option
            target:
              entity_id:
                - select.averys_room_ceiling_fan_switch_led_intensity_on
                - select.averys_room_ceiling_fan_switch_led_intensity_off
            data:
              option: "0"
