alias: "Avery's Room: Ceiling Fan LED State"
description: >-
  Sets the Avery's Room ceiling-fan switch LED bar to its correct steady
  state: the running fan's speed colour (Cyan/Blue/Violet) at intensity 50
  while someone is home and awake, a faint white locator glow at intensity
  3 when the fan and the ceiling light are both off and someone is home and
  awake, or dark otherwise. Home-awake also requires Avery not to be
  asleep, unless binary_sensor.avery_home_today has been off for at least
  8 hours - a plain instantaneous off would fire at the midnight
  day-boundary rollover while she's still physically asleep, so the 8h
  minimum keeps her personal flag protecting her through the night and her
  school-day wake time (the stale-flag case this exists for is her being
  away for days, which easily clears an 8h bar). Recomputed entirely from
  live state on every call - no snapshot, no timers, no animation. Every
  write is skipped when the target already holds the desired value. Called
  by Avery's Room: Ceiling Fan Wall Control on fan-speed and ceiling-light
  changes (a fan-on change while nobody is home and awake defers to
  script.averys_room_ceiling_fan_led_blip_dim instead), and by Household:
  Ceiling Fan Switch LED Locator on presence/sleep changes and HA start.
mode: restart
sequence:
  - alias: Resolve the current speed's colour
    variables:
      speed_colour: >-
        {% set p = state_attr('fan.averys_room_ceiling_fan', 'percentage') | int(0) %}
        {{ 'Cyan' if p < 45 else ('Violet' if p >= 78 else 'Blue') }}
  - alias: Effect channel always stays Solid - skip if already set
    note: >-
      A same-value write can still trigger the switch's own transition ramp
      and costs a Matter round-trip for nothing, since nothing in this
      design ever selects an animation.
    if:
      - condition: not
        conditions:
          - condition: state
            entity_id: select.averys_room_ceiling_fan_switch_led_effect
            state: "Solid"
    then:
      - action: select.select_option
        target:
          entity_id: select.averys_room_ceiling_fan_switch_led_effect
        data:
          option: "Solid"
  - alias: Apply the resting state
    choose:
      - alias: Fan running and someone home and awake - persistent speed colour
        conditions:
          - condition: state
            entity_id: fan.averys_room_ceiling_fan
            state: "on"
            alias: Fan is on
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
            alias: Everyone awake
          - condition: or
            alias: Avery's flag doesn't apply - she's off, or hasn't been home today for 8+ hours
            conditions:
              - condition: state
                entity_id: input_boolean.avery_sleeping
                state: "off"
                alias: Avery is not asleep
              - condition: state
                entity_id: binary_sensor.avery_home_today
                state: "off"
                for: "08:00:00"
                alias: Avery has not been home today for at least 8 hours
        sequence:
          - alias: Speed colour on the native LED channel - skip if already correct
            if:
              - condition: template
                value_template: "{{ states('select.averys_room_ceiling_fan_switch_led_color') != speed_colour }}"
                alias: Colour needs to change
            then:
              - action: select.select_option
                target:
                  entity_id: select.averys_room_ceiling_fan_switch_led_color
                data:
                  option: "{{ speed_colour }}"
          - alias: Set both intensities together at the awake level - skip if already correct
            note: >-
              Intensity(On) and (Off) always move together - the switch's
              internal relay toggles on every paddle press and picks between
              them, so a split value would make the bar blink.
            if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: select.averys_room_ceiling_fan_switch_led_intensity_on
                    state: "50"
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.averys_room_ceiling_fan_switch_led_intensity_on
                    - select.averys_room_ceiling_fan_switch_led_intensity_off
                data:
                  option: "50"
      - alias: Fan and light both off, someone home and awake - faint locator glow
        conditions:
          - condition: state
            entity_id: fan.averys_room_ceiling_fan
            state: "off"
            alias: Fan is off
          - condition: state
            entity_id: light.averys_room_ceiling_fan_light
            state: "off"
            alias: Ceiling light is off
          - condition: numeric_state
            entity_id: zone.home
            above: 0
            alias: Someone home
          - condition: state
            entity_id: input_boolean.everyone_sleeping
            state: "off"
            alias: Everyone awake
          - condition: or
            alias: Avery's flag doesn't apply - she's off, or hasn't been home today for 8+ hours
            conditions:
              - condition: state
                entity_id: input_boolean.avery_sleeping
                state: "off"
                alias: Avery is not asleep
              - condition: state
                entity_id: binary_sensor.avery_home_today
                state: "off"
                for: "08:00:00"
                alias: Avery has not been home today for at least 8 hours
        sequence:
          - alias: Resting colour is white - skip if already correct
            if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: select.averys_room_ceiling_fan_switch_led_color
                    state: "White"
            then:
              - action: select.select_option
                target:
                  entity_id: select.averys_room_ceiling_fan_switch_led_color
                data:
                  option: "White"
          - alias: Set both intensities together at the locator level - skip if already correct
            if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: select.averys_room_ceiling_fan_switch_led_intensity_on
                    state: "3"
            then:
              - action: select.select_option
                target:
                  entity_id:
                    - select.averys_room_ceiling_fan_switch_led_intensity_on
                    - select.averys_room_ceiling_fan_switch_led_intensity_off
                data:
                  option: "3"
    default:
      - alias: Otherwise dark - skip if already correct
        if:
          - condition: not
            conditions:
              - condition: state
                entity_id: select.averys_room_ceiling_fan_switch_led_intensity_on
                state: "0"
        then:
          - action: select.select_option
            target:
              entity_id:
                - select.averys_room_ceiling_fan_switch_led_intensity_on
                - select.averys_room_ceiling_fan_switch_led_intensity_off
            data:
              option: "0"
