alias: 'Household: AI Climate Insight'
description: 'Daily climate note for the Climate view: yesterday''s indoor temperature, humidity and heating/cooling
  against recent home days, with a week-over-week pass on Sundays. Fixed rules in climate_insight() (/config/custom_templates/ai_insights.jinja)
  decide what is notable; with nothing flagged it stores "Nothing notable" without calling Claude, otherwise
  Claude writes a headline and a short story: Haiku (ai_task.claude_haiku_ai_task) on daily runs, Sonnet
  (ai_task.claude_sonnet_ai_task) on the Sunday weekly pass, which has more to weigh. Fired as household_ai_climate_insight_ready
  and stored by sensor.household_ai_climate_insight. Runs on the AI Insights Schedule. See guides/ai_insights.md
  and issue #18.'
icon: mdi:home-thermometer
mode: single
max_exceeded: silent
fields:
  weekly:
    name: Weekly pass
    description: Add the week-over-week comparison (on by default on Sundays); for testing.
    required: false
    selector:
      boolean: {}
sequence:
- alias: Get five weeks of daily statistics
  action: recorder.get_statistics
  data:
    start_time: '{{ (today_at() - timedelta(days=36)).isoformat() }}'
    statistic_ids:
    - sensor.outside_temperature
    - sensor.household_hvac_heating_runtime_today
    - sensor.household_hvac_cooling_runtime_today
    - sensor.household_occupied_today
    - sensor.living_room_thermostat_temperature
    - sensor.living_room_thermostat_humidity
    - sensor.kitchen_climate_temperature
    - sensor.kitchen_climate_humidity
    - sensor.family_room_climate_temperature
    - sensor.family_room_climate_humidity
    - sensor.office_climate_temperature
    - sensor.office_climate_humidity
    - sensor.master_bedroom_climate_temperature
    - sensor.master_bedroom_climate_humidity
    - sensor.averys_room_climate_temperature
    - sensor.averys_room_climate_humidity
    period: day
    types:
    - mean
    - min
    - max
    - change
  response_variable: stats
- alias: Build the facts and flags
  variables:
    is_weekly: '{{ weekly | default(now().weekday() == 6) | bool }}'
    insight: '{% from ''ai_insights.jinja'' import climate_insight %}{{ climate_insight(stats.statistics,
      1, is_weekly) }}'
    report_date: '{{ (today_at() - timedelta(days=1)).date() | string }}'
    earlier: '{% set h = state_attr(''sensor.household_ai_climate_insight'', ''history'') or [] %}{% set
      week = (today_at() - timedelta(days=7)).date() | string %}{% for e in h if e.date != report_date
      and e.date >= week %}{{ e.date }}: {{ e.headline }} {{ e.story }}

      {% else %}none{% endfor %}'
- alias: Write it up if anything was flagged
  if:
  - alias: Something was flagged
    condition: template
    value_template: '{{ insight.flags | count > 0 }}'
  then:
  - alias: Ask Claude for the climate note
    action: ai_task.generate_data
    data:
      task_name: household_ai_climate_insight
      entity_id: '{{ ''ai_task.claude_sonnet_ai_task'' if is_weekly else ''ai_task.claude_haiku_ai_task''
        }}'
      instructions: 'You write the climate note on a family''s home dashboard in Waterville, Ohio: what
        in yesterday''s{{ '' and this week\''s'' if is_weekly }} indoor temperature, humidity and heating/cooling
        is worth a look, and what it likely means.


        Voice: a sharp, good-humored house manager. Plain and specific, a light touch of wit, never cutesy,
        no emoji.


        The notable items were picked by fixed rules; write about those. Everything else in the facts
        is context: use it to explain, never as news of its own.

        - Lead with the most important item. Connect items only when the facts connect them (both bedrooms
        humid on the same rainy day); otherwise cover the top one or two.

        - Explain only what the facts support: the weather, time away, which rooms the thermostat follows.
        A room the thermostat follows that still drifts points to something in that room (a closed vent
        or door, an open window); offer it as a possibility, never as fact.

        - If an item continues from an earlier note this week, say so ("third humid day in Avery''s room")
        instead of repeating that note.

        - The comparisons in the facts are already worked out; use them as given and never reverse a direction.
        Round numbers. Use only the facts below; never invent a cause.


        Rules:

        - headline: 70 characters or fewer.

        - story: two or three sentences, 300 characters or fewer.


        Notable:

        {% for f in insight.flags %}- {{ f }}

        {% endfor %}

        Facts:

        {{ insight.facts }}


        Earlier notes this week:

        {{ earlier }}'
      structure:
        headline:
          description: One line, 70 characters or fewer
          required: true
          selector:
            text: {}
        story:
          description: Two or three sentences, 300 characters or fewer
          required: true
          selector:
            text: {}
    response_variable: result
  - alias: Store the note
    event: household_ai_climate_insight_ready
    event_data:
      date: '{{ report_date }}'
      flagged: true
      flags: '{{ insight.flags }}'
      weekly: '{{ is_weekly }}'
      headline: '{{ (result.data.headline | default('''') | string)[:80] }}'
      story: '{{ (result.data.story | default('''') | string)[:320] }}'
  else:
  - alias: Store nothing notable
    event: household_ai_climate_insight_ready
    event_data:
      date: '{{ report_date }}'
      flagged: false
      flags: []
      weekly: '{{ is_weekly }}'
