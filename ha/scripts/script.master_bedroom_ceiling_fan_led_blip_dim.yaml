alias: "Master Bedroom: Ceiling Fan LED Blip (dim)"
description: >-
  Brief low-intensity acknowledgement for a fan change (turned on or speed
  changed) while nobody is home and awake - the new speed's colour at
  intensity 8 for ~2s, then dark. No animation. Every write is skipped when
  the target already holds the desired value. Called instead of
  script.master_bedroom_ceiling_fan_led_state by Master Bedroom: Ceiling
  Fan Wall Control's fan-settled trigger when the home-awake gate is
  currently false, and by Household: Ceiling Fan Switch LED Locator when a
  sleep/away trigger fires while the fan is already running (one flash to
  acknowledge entering sleep mode, then dark for the night). Fan-off is not
  acknowledged here - that transition goes straight to dark via
  script.master_bedroom_ceiling_fan_led_state.
mode: restart
sequence:
  - alias: Resolve the current speed's colour
    variables:
      speed_colour: >-
        {% set p = state_attr('fan.master_bedroom_ceiling_fan', 'percentage') | int(0) %}
        {{ 'Cyan' if p < 45 else ('Violet' if p >= 78 else 'Blue') }}
  - alias: Effect channel always stays Solid - skip if already set
    if:
      - condition: not
        conditions:
          - condition: state
            entity_id: select.master_bedroom_ceiling_fan_switch_led_effect
            state: "Solid"
    then:
      - action: select.select_option
        target:
          entity_id: select.master_bedroom_ceiling_fan_switch_led_effect
        data:
          option: "Solid"
  - alias: Flash the speed colour - skip if already showing it
    if:
      - condition: template
        value_template: "{{ states('select.master_bedroom_ceiling_fan_switch_led_color') != speed_colour }}"
        alias: Colour needs to change
    then:
      - action: select.select_option
        target:
          entity_id: select.master_bedroom_ceiling_fan_switch_led_color
        data:
          option: "{{ speed_colour }}"
  - alias: Set both intensities together at the dim level - skip if already correct
    if:
      - condition: not
        conditions:
          - condition: state
            entity_id: select.master_bedroom_ceiling_fan_switch_led_intensity_on
            state: "8"
    then:
      - action: select.select_option
        target:
          entity_id:
            - select.master_bedroom_ceiling_fan_switch_led_intensity_on
            - select.master_bedroom_ceiling_fan_switch_led_intensity_off
        data:
          option: "8"
  - alias: Hold the flash briefly
    delay: "00:00:02"
  - alias: Rest dark - skip if already dark
    if:
      - condition: not
        conditions:
          - condition: state
            entity_id: select.master_bedroom_ceiling_fan_switch_led_intensity_on
            state: "0"
    then:
      - action: select.select_option
        target:
          entity_id:
            - select.master_bedroom_ceiling_fan_switch_led_intensity_on
            - select.master_bedroom_ceiling_fan_switch_led_intensity_off
        data:
          option: "0"
