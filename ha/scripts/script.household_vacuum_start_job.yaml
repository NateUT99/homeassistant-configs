alias: "Household: Vacuum Start Job"
description: >-
  Shared entry point for every vacuum and mop job start. Owns each job's rooms
  (segments), active zone, fan speed, and mop intensity, and refuses to start
  when the vacuum or its hardware can't run that job. Returns started
  (true/false) and reason so callers can say why a job was skipped. Callers
  keep their own scheduling gates and ran/done flags. See
  guides/vacuum_cleaning_routine.md.
fields:
  job:
    name: Job
    description: Which cleaning job to start.
    required: true
    selector:
      select:
        options:
          - label: Nightly vacuum (Office, Kitchen, Living Room)
            value: nightly
          - label: Daytime vacuum (bedrooms, baths, utility, pantry, entrance)
            value: daytime
          - label: Common-area mop
            value: common_mop
          - label: Master suite mop
            value: master_mop
          - label: Whole house vacuum
            value: whole_house
sequence:
  - alias: Look up the job's settings
    variables:
      jobs:
        nightly:
          zone: evening
          fan: quiet
          mop: false
          segments: [18, 22, 25]
        daytime:
          zone: daytime
          fan: balanced
          mop: false
          segments: [16, 17, 19, 20, 21, 23, 24, 26]
        common_mop:
          zone: evening
          fan: quiet
          mop: true
          segments: [17, 22, 23, 24, 25, 26]
        master_mop:
          zone: master_mop
          fan: balanced
          mop: true
          segments: [19, 21]
        whole_house:
          zone: away
          fan: max
          mop: false
          segments: []
      cfg: "{{ jobs[job] }}"
    note: >-
      The one place segment IDs live. 16 Avery's Room, 17 Bathroom, 18 Office
      (carpet), 19 Master Bedroom, 20 Master Closet (carpet), 21 Master
      Bathroom, 22 Kitchen, 23 Utility Room, 24 Pantry, 25 Living Room, 26
      Entrance. 28 (Stairs) is never included -- fall hazard, backstopped by
      an app virtual wall. See LESSONS.md before editing segment IDs.
      whole_house uses vacuum.start, so its list stays empty. The app's
      cleaning mode select is deliberately not set: mopping follows the pad
      sensor alone (LESSONS.md -> Vacuum & Roborock).
  - alias: Refuse the job if the vacuum or its hardware can't run it
    choose:
      - alias: Vacuum is already mid-job
        conditions:
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_cleaning
            state: "on"
            alias: Vacuum is mid-job
        note: >-
          The cleaning sensor stays on through a mid-job recharge, unlike the
          vacuum's cleaning state, so a docked-to-recharge job also counts.
        sequence:
          - variables:
              result:
                started: false
                reason: the vacuum is already mid-job
          - stop: Vacuum is already mid-job
            response_variable: result
      - alias: Dustbin module is out
        conditions:
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_water_box_attached
            state: "off"
            alias: 2-in-1 dustbin + water module is out
        note: >-
          On the Q8 Max the bin and water tank are one module; a job started
          without it faults with no_dustbin.
        sequence:
          - variables:
              result:
                started: false
                reason: the dustbin module isn't seated
          - stop: Dustbin module is out
            response_variable: result
      - alias: Mop job with the pad off
        conditions:
          - condition: template
            value_template: "{{ cfg.mop }}"
            alias: This is a mop job
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_mop_attached
            state: "off"
            alias: Mop pad is off
        sequence:
          - variables:
              result:
                started: false
                reason: the mop pad is off
          - stop: Mop pad is off
            response_variable: result
      - alias: Mop job with an empty tank
        conditions:
          - condition: template
            value_template: "{{ cfg.mop }}"
            alias: This is a mop job
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_water_shortage
            state: "on"
            alias: Water tank is empty
        sequence:
          - variables:
              result:
                started: false
                reason: the water tank is empty
          - stop: Water tank is empty
            response_variable: result
      - alias: Vacuum job with the pad on
        conditions:
          - condition: template
            value_template: "{{ not cfg.mop }}"
            alias: This is a vacuum-only job
          - condition: state
            entity_id: binary_sensor.living_room_vacuum_mop_attached
            state: "on"
            alias: Mop pad is attached
        note: Even a dry pad must not be dragged across the carpeted rooms.
        sequence:
          - variables:
              result:
                started: false
                reason: the mop pad is attached
          - stop: Mop pad is attached
            response_variable: result
      - alias: Whole-house job while not docked
        conditions:
          - condition: template
            value_template: "{{ job == 'whole_house' }}"
            alias: This is the whole-house job
          - condition: not
            alias: Vacuum is not docked
            conditions:
              - condition: state
                entity_id: vacuum.living_room_vacuum
                state: docked
        note: >-
          vacuum.start sends a dock command instead of cleaning if the vacuum
          is returning (LESSONS.md).
        sequence:
          - variables:
              result:
                started: false
                reason: the vacuum isn't docked
          - stop: Vacuum isn't docked
            response_variable: result
  - alias: Set the active zone
    action: input_select.select_option
    target:
      entity_id: input_select.vacuum_active_zone
    data:
      option: "{{ cfg.zone }}"
    note: >-
      Read by the Live Activity and the completion check, so every job sets it
      before starting.
  - alias: Set the fan speed
    action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.living_room_vacuum
    data:
      fan_speed: "{{ cfg.fan }}"
  - alias: Set high mop intensity for the common-area mop
    if:
      - condition: template
        value_template: "{{ job == 'common_mop' }}"
        alias: This is the common-area mop
    note: >-
      Not for master_mop: it shares the night's tank fill, and if the tank ran
      dry, mop intensity is dropped to medium by hand for the follow-up --
      forcing high here would undo that.
    then:
      - alias: Set high mop intensity
        action: select.select_option
        target:
          entity_id: select.living_room_vacuum_mop_intensity
        data:
          option: high
  - alias: Start the job
    if:
      - condition: template
        value_template: "{{ job == 'whole_house' }}"
        alias: This is the whole-house job
    then:
      - alias: Start a whole-map clean
        action: vacuum.start
        target:
          entity_id: vacuum.living_room_vacuum
        note: >-
          Not app_segment_clean -- a stale segment list silently no-ops after a
          Roborock map merge (LESSONS.md).
    else:
      - alias: Start the segment clean
        action: vacuum.send_command
        target:
          entity_id: vacuum.living_room_vacuum
        data:
          command: app_segment_clean
          params:
            - segments: "{{ cfg.segments }}"
              repeat: 1
  - variables:
      result:
        started: true
        reason: ""
  - stop: Job started
    response_variable: result
mode: queued
max: 5
icon: mdi:robot-vacuum
