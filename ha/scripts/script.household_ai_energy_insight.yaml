alias: 'Household: AI Energy Insight'
description: 'Daily energy note for the Energy view: yesterday''s electricity against recent home days,
  with a week-over-week pass on Sundays that adds the refrigerator. Fixed rules in energy_insight() (/config/custom_templates/ai_insights.jinja)
  decide what is notable; with nothing flagged it stores "Nothing notable" without calling Claude, otherwise
  Claude (ai_task.claude_haiku_ai_task) writes a headline and a short story. Cost uses the $0.2033/kWh
  rate in the Energy settings. Fired as household_ai_energy_insight_ready and stored by sensor.household_ai_energy_insight.
  Runs on the AI Insights Schedule. See guides/ai_insights.md and issue #18.'
icon: mdi:lightning-bolt
mode: single
max_exceeded: silent
fields:
  weekly:
    name: Weekly pass
    description: Add the week-over-week comparison (on by default on Sundays); for testing.
    required: false
    selector:
      boolean: {}
sequence:
- alias: Get five weeks of daily statistics
  action: recorder.get_statistics
  data:
    start_time: '{{ (today_at() - timedelta(days=36)).isoformat() }}'
    statistic_ids:
    - sensor.household_energy_monitor_total_energy_delivered
    - sensor.kitchen_refrigerator_summation_delivered
    - sensor.household_hvac_heating_runtime_today
    - sensor.household_hvac_cooling_runtime_today
    - sensor.household_occupied_today
    period: day
    types:
    - max
    - change
  response_variable: stats
- alias: Build the facts and flags
  variables:
    is_weekly: '{{ weekly | default(now().weekday() == 6) | bool }}'
    insight: '{% from ''ai_insights.jinja'' import energy_insight %}{{ energy_insight(stats.statistics,
      1, is_weekly, 0.2033) }}'
    report_date: '{{ (today_at() - timedelta(days=1)).date() | string }}'
    earlier: '{% set h = state_attr(''sensor.household_ai_energy_insight'', ''history'') or [] %}{% for
      e in h if e.date != report_date %}{{ e.date }}: {{ e.headline }} {{ e.story }}

      {% else %}none{% endfor %}'
- alias: Write it up if anything was flagged
  if:
  - alias: Something was flagged
    condition: template
    value_template: '{{ insight.flags | count > 0 }}'
  then:
  - alias: Ask Claude for the energy note
    action: ai_task.generate_data
    data:
      task_name: household_ai_energy_insight
      entity_id: ai_task.claude_haiku_ai_task
      instructions: 'You write the energy note on a family''s home dashboard in Waterville, Ohio: what
        in yesterday''s{{ '' and this week\''s'' if is_weekly }} electricity{{ '' and refrigerator'' if
        is_weekly }} use is worth a look, and what it likely means.


        Voice: a sharp, good-humored house manager. Plain and specific, a light touch of wit, never cutesy,
        no emoji.


        The notable items were picked by fixed rules; write about those. Everything else in the facts
        is context: use it to explain, never as news of its own.

        - Lead with the most important item; cover the top one or two.

        - Explain only what the facts support: heating and cooling runtime, time away. Never guess at
        appliances or habits the facts don''t mention.

        - If an item continues from an earlier note this week, say so instead of repeating that note.

        - The comparisons in the facts are already worked out; use them as given and never reverse a direction.
        Round numbers; dollars to the nearest dollar. Use only the facts below; never invent a cause.


        Rules:

        - headline: 70 characters or fewer.

        - story: two or three sentences, 300 characters or fewer.


        Notable:

        {% for f in insight.flags %}- {{ f }}

        {% endfor %}

        Facts:

        {{ insight.facts }}


        Earlier notes this week:

        {{ earlier }}'
      structure:
        headline:
          description: One line, 70 characters or fewer
          required: true
          selector:
            text: {}
        story:
          description: Two or three sentences, 300 characters or fewer
          required: true
          selector:
            text: {}
    response_variable: result
  - alias: Store the note
    event: household_ai_energy_insight_ready
    event_data:
      date: '{{ report_date }}'
      flagged: true
      flags: '{{ insight.flags }}'
      weekly: '{{ is_weekly }}'
      headline: '{{ (result.data.headline | default('''') | string)[:80] }}'
      story: '{{ (result.data.story | default('''') | string)[:320] }}'
  else:
  - alias: Store nothing notable
    event: household_ai_energy_insight_ready
    event_data:
      date: '{{ report_date }}'
      flagged: false
      flags: []
      weekly: '{{ is_weekly }}'
