alias: 'Household: AI House Summary'
description: 'On-demand summary of the house from Claude (ai_task.claude_haiku_ai_task), as two short
  lists: items that need attention and items that are fine. A non-empty attention list turns the AI chip
  on the home-main dashboard orange. Facts come only from the allowlist macro house_facts in /config/custom_templates/ai_insights.jinja.
  Skips if a summary was generated in the last 2 minutes, so repeated taps don''t spam the API. Called
  from the #ai pop-up. See guides/ai_insights.md.'
icon: mdi:text-box-search-outline
mode: single
max_exceeded: silent
sequence:
- alias: Skip if a summary was generated in the last 2 minutes
  condition: template
  value_template: '{% set last = state_attr(''sensor.household_ai_house_summary'', ''generated_at'') %}{{
    last is none or (now() - as_datetime(last)) > timedelta(minutes=2) }}'
- alias: Get the hourly forecast
  action: weather.get_forecasts
  target:
    entity_id: weather.outside_waterville_oh_usa
  data:
    type: hourly
  response_variable: hourly
- alias: Get the daily forecast
  action: weather.get_forecasts
  target:
    entity_id: weather.outside_waterville_oh_usa
  data:
    type: daily
  response_variable: daily
- alias: Build the facts
  variables:
    facts: '{% from ''ai_insights.jinja'' import house_facts %}{{ house_facts(hourly[''weather.outside_waterville_oh_usa''].forecast,
      daily[''weather.outside_waterville_oh_usa''].forecast) }}'
- alias: Ask Claude for the summary
  action: ai_task.generate_data
  data:
    task_name: household_ai_house_summary
    entity_id: ai_task.claude_haiku_ai_task
    instructions: |-
      Give the owner of a family's house in Waterville, Ohio a quick rundown. They just tapped a button on their home dashboard.

      Voice: friendly and a little playful, like a sharp, good-humored house manager. Courteous and clear first, with a light touch of wit, or a bit of attitude when something has clearly been ignored. Never snarky about people, never cutesy or saccharine, no emoji. Facts stay precise.

      Rules:
      - attention_items: 0 to 4 short items (under 60 characters each) that need action now or soon: water leaks, internet down, a door unlocked or open while nobody is home or everyone is asleep, appliances finished and waiting, overdue chores or vacuum maintenance, the generator running, unusual indoor temperatures. Leave it empty if nothing needs attention.
      - ok_items: 1 to 3 short items (under 60 characters each) confirming what is fine, grouping related things (e.g. 'Doors locked, no leaks, internet up').
      - Each item is a plain phrase: no leading dash or bullet.
      - Don't connect unrelated facts. Mention a person only when it changes what to do (e.g. Avery asleep, so keep it quiet).
      - Use only the facts below. Never invent anything. Use °F and 12-hour times. No technical names or entity IDs.

      Facts:
      {{ facts }}
    structure:
      attention_items:
        description: Things that need action now or soon; may be empty
        required: false
        selector:
          text:
            multiple: true
      ok_items:
        description: Short confirmations of what is fine
        required: true
        selector:
          text:
            multiple: true
  response_variable: result
- alias: Store the summary
  event: household_ai_house_summary_ready
  event_data:
    attention_items: '{{ (result.data.attention_items | default([], true))[:4] | map(''string'') | map(''truncate'',
      80) | list }}'
    ok_items: '{{ (result.data.ok_items | default([], true))[:3] | map(''string'') | map(''truncate'',
      80) | list }}'
