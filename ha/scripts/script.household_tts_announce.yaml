alias: "Household: TTS Announce"
description: >-
  Shared entry point for every HomePod TTS announcement. Resolves the
  target room: auto picks master_bedroom if everyone_sleeping is on,
  else living_room if the living room AppleTV is on (playing, paused,
  or idle -- anything but off/standby/unavailable/unknown), else
  kitchen. An explicit target (kitchen/master_bedroom/office/averys_room)
  always goes to that room regardless of the living room's state.
  broadcast unconditionally fans out to kitchen, master bedroom, office,
  and Avery's room with no living-room exception -- it exists to reach
  the whole house, not just wherever someone happens to be. The
  AppleTV's own state is checked directly rather than the living room
  Sonos soundbar it feeds (HDMI ARC): the soundbar reports playing
  continuously based on the input being selected, not on whether the
  AppleTV is actually producing sound, so it can't distinguish playing
  from paused (see LESSONS.md).

  When the resolved target is the living room, the announcement plays
  directly on media_player.living_room_appletv via chime_tts.say_url
  (pre-generated) + media_player.play_media (announce: true) -- no
  HomePod is involved, and no volume_level is set since the AppleTV
  already has a real in-progress volume. It's paused first only if it
  was actually playing (not just on), and resumed afterward only if
  this call itself was the one that paused it -- a show the person had
  already left paused stays paused rather than auto-resuming. If the
  AppleTV rejects the stream, the same pre-generated clip plays on the
  kitchen HomePod instead (or pushes if that's offline too), and the
  AppleTV is resumed only after that finishes. For every
  other call (any HomePod target, or a broadcast), the living room
  AppleTV is ducked -- paused before speaking, resumed after -- whenever
  it's actually playing, since its Sonos soundbar has no independent
  playback of its own to pause and would otherwise compete with the
  announcement. All reachable HomePod rooms for a given call are spoken
  to with a single media_player.play_media action carrying a list of
  entity_ids -- one real action, so playback starts together instead of
  being staggered room by room. A single-room call keeps that room's
  own tuned volume; a multi-room call (2+ rooms resolved) uses one
  shared volume (0.5) since one service call can't carry a different
  volume per target. Office is dropped from a broadcast (and, if
  explicitly targeted, gets a push instead of TTS) whenever
  binary_sensor.nates_work_laptop_audio_input_in_use is on -- the same
  MacBook Pro call-detection signal automation.office_camera_lighting
  relies on. Avery's room is dropped whenever
  input_boolean.avery_sleeping is on. A room that's busy (office only)
  or offline is pulled out of the call and covered by a single push
  notification instead. Pass critical_fallback to send that fallback
  push as an iOS critical alert.

  Timing notes, both live-verified 2026-09-26: pre-generating the audio
  before pausing (rather than calling chime_tts.say, which generates
  and plays in one blocking action) keeps the pause-to-playback gap to
  a fraction of a second instead of several seconds of dead air. And
  the resume waits on the actual playing-to-idle (HomePods) or
  playing-to-paused/idle (living room AppleTV) transition rather than a
  fixed delay, because chime_tts.say_url's reported duration doesn't
  reliably match real playback time. A templated entity_id inside a
  wait_for_trigger was tried first and rejected -- HA can only
  auto-track entities a trigger references by a literal string, so a
  runtime-computed entity_id silently falls back to the timeout instead
  of firing on the real transition. Listing the four HomePods as
  literal state triggers works because only the ones a given call
  actually targeted can transition from playing to idle at all -- the
  rest simply never match.

  Optional chime_path (default soft; pass error for fault/anomaly alerts) and
  volume_override (0.0-1.0, bypasses the tuned per-room volume table and the
  multi-room 0.5 default) let a caller make an announcement sound and play
  distinctly louder/urgent. Used by the water leak, refrigerator fault, and
  laundry fault callers.
fields:
  message:
    name: Message
    description: Text to speak. Templates are supported.
    required: true
    selector:
      text: {}
  target:
    name: Target
    description: >-
      Which HomePod to announce to, broadcast to unconditionally fan
      out to kitchen, master bedroom, office (unless it's busy with a
      call), and Avery's room (unless she's asleep), or auto to pick
      the single best room: master bedroom if everyone's asleep, the
      living room AppleTV if it's on, otherwise kitchen.
    required: false
    default: auto
    selector:
      select:
        options: [kitchen, master_bedroom, office, averys_room, broadcast, auto]
  notification_title:
    name: Notification Title
    description: >-
      Title for the push notification sent when a room can't get TTS
      (busy with a call, or offline).
    required: false
    default: Missed Announcement
    selector:
      text: {}
  critical_fallback:
    name: Critical Fallback
    description: >-
      When TTS cannot be delivered and the script falls back to a push,
      send it as an iOS critical alert (breaks through silent mode and
      Focus). Applies to both fallback paths. Default false.
    required: false
    default: false
    selector:
      boolean: {}
  chime_path:
    name: Chime
    description: >-
      Which Chime TTS preset plays before the message. soft (default) is
      the routine-announcement chime used everywhere else; error signals
      a fault or life-safety alert.
    required: false
    default: soft
    selector:
      select:
        options: [soft, error]
  volume_override:
    name: Volume Override
    description: >-
      Override the per-room tuned volume with this exact level for every
      targeted HomePod, bypassing the normal per-room table and the
      multi-room 0.5 default. Use for urgent alerts that need to be
      unmistakably loud. Leave unset for the normal tuned volume.
    required: false
    selector:
      number:
        min: 0.0
        max: 1.0
        step: 0.05
        mode: slider
variables:
  living_room_appletv_state: "{{ states('media_player.living_room_appletv') }}"
  living_room_on: "{{ living_room_appletv_state not in ['off', 'standby', 'unavailable', 'unknown'] }}"
  living_room_playing: "{{ living_room_appletv_state == 'playing' }}"
  resolved_target: >-
    {{ ('master_bedroom' if is_state('input_boolean.everyone_sleeping', 'on')
    else ('living_room' if living_room_on else 'kitchen')) if
    (target | default('auto')) == 'auto' else target }}
  notification_title_resolved: "{{ notification_title | default('Missed Announcement') }}"
  fallback_push_data: >-
    {{ {'push': {'interruption-level': 'critical', 'sound': {'name': 'default',
    'critical': 1, 'volume': 1}}} if (critical_fallback | default(false)) else {} }}
  office_busy: "{{ is_state('binary_sensor.nates_work_laptop_audio_input_in_use', 'on') }}"
  broadcast_rooms: >-
    {{ ['kitchen', 'master_bedroom'] + ([] if office_busy else ['office']) +
    ([] if is_state('input_boolean.avery_sleeping', 'on') else ['averys_room']) }}
  target_rooms: >-
    {{ broadcast_rooms if (target | default('auto')) == 'broadcast' else [resolved_target] }}
  rooms_offline: |-
    {% set speaker_map = {'kitchen': 'media_player.kitchen_homepod', 'master_bedroom': 'media_player.master_bedroom_homepod', 'office': 'media_player.office_homepod', 'averys_room': 'media_player.averys_room_homepod'} %}
    {% set ns = namespace(rooms=[]) %}
    {% for r in target_rooms %}
    {% if states(speaker_map.get(r, '')) in ['unavailable', 'unknown'] %}{% set ns.rooms = ns.rooms + [r] %}{% endif %}
    {% endfor %}
    {{ ns.rooms }}
  rooms_busy: "{{ ['office'] if ('office' in target_rooms and office_busy) else [] }}"
  rooms_unreachable: "{{ (rooms_offline + rooms_busy) | unique | list }}"
  rooms_to_speak: "{{ target_rooms | reject('in', rooms_unreachable) | list }}"
  speaker_entities: |-
    {% set speaker_map = {'kitchen': 'media_player.kitchen_homepod', 'master_bedroom': 'media_player.master_bedroom_homepod', 'office': 'media_player.office_homepod', 'averys_room': 'media_player.averys_room_homepod'} %}
    {% set ns = namespace(entities=[]) %}
    {% for r in rooms_to_speak %}{% set ns.entities = ns.entities + [speaker_map[r]] %}{% endfor %}
    {{ ns.entities }}
  volume_override_resolved: "{{ volume_override | default(none) }}"
  chime_path_resolved: "{{ chime_path | default('soft') }}"
  call_volume: >-
    {{ volume_override_resolved if volume_override_resolved is not none else
    ({'kitchen': 0.6, 'office': 0.5, 'averys_room': 0.4, 'master_bedroom':
    (0.4 if is_state('input_boolean.everyone_sleeping', 'on') else
    0.5)}[rooms_to_speak[0]] if rooms_to_speak | length == 1 else 0.5) }}
  should_duck_living_room: "{{ living_room_playing and resolved_target != 'living_room' }}"
sequence:
  - alias: Reject an unrecognized target before doing anything
    note: >-
      Reachable only if `target` is called with a value outside the
      documented field selector options.
    if:
      - condition: template
        value_template: >-
          {{ (target | default('auto')) not in ['kitchen', 'master_bedroom',
          'office', 'averys_room', 'broadcast', 'auto'] }}
    then:
      - stop: Unrecognized TTS target
  - alias: >-
      Speak directly through the living room AppleTV if auto resolved
      there, otherwise use the normal room list
    choose:
      - alias: Auto resolved to the living room (asleep is false and the AppleTV is on)
        conditions:
          - condition: template
            value_template: "{{ resolved_target == 'living_room' }}"
        sequence:
          - alias: Pre-generate the announcement audio
            note: >-
              Runs the Nabu Casa cloud TTS round trip up front, while
              the AppleTV is untouched -- this is what closes the
              dead-air gap between pausing it and the announcement
              actually starting. audio_conversion boosts the generated
              clip's own loudness, since cloud TTS masters noticeably
              quieter than TV/streaming audio.
            action: chime_tts.say_url
            data:
              message: "{{ message }}"
              chime_path: "{{ chime_path_resolved }}"
              tts_platform: cloud
              cache: true
              audio_conversion: "Volume 150%"
            response_variable: tts_audio
          - alias: Pause the living room AppleTV if it's actively playing
            note: >-
              Only pause if there's actually something playing to
              interrupt -- pausing an already-paused or idle AppleTV is
              a no-op that would also incorrectly mark it as ours to
              resume.
            if:
              - condition: template
                value_template: "{{ living_room_playing }}"
            then:
              - alias: Pause the AppleTV
                action: media_player.media_pause
                target:
                  entity_id: media_player.living_room_appletv
          - alias: Play the announcement directly on the living room AppleTV
            note: >-
              No volume_level set -- unlike the HomePods, which are
              idle announcement-only speakers, the AppleTV has an
              actual in-progress volume already set. The announce
              pipeline plays at that volume as-is and needs no
              explicit restore. continue_on_error lets a failed AirPlay
              stream (pyatv busy/blocked/timeout, raised as
              HomeAssistantError) fall through to the kitchen fallback
              below instead of aborting the script with the AppleTV left
              paused and the caller's run killed.
            action: media_player.play_media
            target:
              entity_id: media_player.living_room_appletv
            data:
              media_content_id: "{{ tts_audio.url }}"
              media_content_type: music
              announce: true
            continue_on_error: true
          - alias: Wait for the announcement to actually finish
            note: >-
              The AppleTV shows playing for the duration of the
              announcement regardless of what state it started in,
              then settles back to paused (if a show was loaded) or
              idle (if it wasn't) -- watch for either edge. The
              duration-based timeout is kept only as a backstop in case
              the state never settles.
            wait_for_trigger:
              - trigger: state
                alias: AppleTV settles on a paused show
                entity_id: media_player.living_room_appletv
                from: playing
                to: paused
              - trigger: state
                alias: AppleTV settles on idle
                entity_id: media_player.living_room_appletv
                from: playing
                to: idle
            timeout: "{{ tts_audio.duration + 5 }}"
            continue_on_timeout: true
          - alias: If the AppleTV never played the announcement, speak it in the kitchen instead
            note: >-
              On success play_media blocks until the clip finishes and
              the AppleTV then settles from playing, completing the wait
              above. A failed stream returns almost instantly without the
              AppleTV ever entering playing, so the wait times out --
              that timeout is the failure signal, since
              continue_on_error exposes no error variable.
            if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - alias: Kitchen HomePod offline too -- push instead
                if:
                  - condition: state
                    entity_id: media_player.kitchen_homepod
                    state:
                      - unavailable
                      - unknown
                then:
                  - alias: Push fallback (AppleTV failed, kitchen offline)
                    action: notify.mobile_app_nates_iphone
                    data:
                      title: "{{ notification_title_resolved }}"
                      message: "{{ message }}"
                      data: "{{ fallback_push_data }}"
                else:
                  - alias: Set kitchen HomePod volume
                    action: media_player.volume_set
                    target:
                      entity_id: media_player.kitchen_homepod
                    data:
                      volume_level: "{{ volume_override_resolved if volume_override_resolved is not none else 0.6 }}"
                  - alias: Play the pre-generated announcement in the kitchen
                    action: media_player.play_media
                    target:
                      entity_id: media_player.kitchen_homepod
                    data:
                      media_content_id: "{{ tts_audio.url }}"
                      media_content_type: music
                      announce: true
                  - alias: Wait for the kitchen announcement to finish before resuming
                    wait_for_trigger:
                      - trigger: state
                        alias: Kitchen HomePod finishes
                        entity_id: media_player.kitchen_homepod
                        from: playing
                        to: idle
                    timeout: "{{ tts_audio.duration + 5 }}"
                    continue_on_timeout: true
          - alias: Resume the living room AppleTV only if it was ours to pause
            note: >-
              Gated on the original living_room_playing snapshot, not
              the current state -- a show the person themselves had
              already paused before this call stays paused rather than
              auto-resuming.
            if:
              - condition: template
                value_template: "{{ living_room_playing }}"
            then:
              - alias: Resume the AppleTV
                action: media_player.media_play
                target:
                  entity_id: media_player.living_room_appletv
    default:
      - alias: Push once if any resolved room couldn't get TTS
        note: >-
          One push covers it regardless of how many rooms were
          unreachable -- the message/title is identical either way.
        if:
          - condition: template
            value_template: "{{ rooms_unreachable | length > 0 }}"
        then:
          - alias: Push fallback (room busy or offline)
            action: notify.mobile_app_nates_iphone
            data:
              title: "{{ notification_title_resolved }}"
              message: "{{ message }}"
              data: "{{ fallback_push_data }}"
      - alias: Speak to every reachable room in one action
        note: >-
          Audio is pre-generated before the living room is touched, so
          the AppleTV pause-to-playback gap is a fraction of a second
          instead of the several seconds chime_tts.say's
          generate-then-play would otherwise expose as dead air.
        if:
          - condition: template
            value_template: "{{ rooms_to_speak | length > 0 }}"
        then:
          - alias: Pre-generate the announcement audio
            note: >-
              Runs the Nabu Casa cloud TTS round trip up front, while
              the living room's AppleTV (if any) is untouched -- this
              is what closes the dead-air gap between pausing it and
              the announcement actually starting. audio_conversion
              boosts the generated clip's own loudness, since cloud
              TTS masters noticeably quieter than TV/streaming audio.
            action: chime_tts.say_url
            data:
              message: "{{ message }}"
              chime_path: "{{ chime_path_resolved }}"
              tts_platform: cloud
              cache: true
              audio_conversion: "Volume 150%"
            response_variable: tts_audio
          - alias: Set target speaker volume
            note: >-
              chime_tts.say set this internally; calling
              media_player.play_media directly means setting it
              explicitly.
            action: media_player.volume_set
            target:
              entity_id: "{{ speaker_entities }}"
            data:
              volume_level: "{{ call_volume }}"
          - alias: >-
              Duck living room AppleTV if it's playing and this call
              isn't already going there
            note: >-
              Gated on living_room_playing (the AppleTV's own state),
              not the living room being merely on -- pausing an idle or
              already-paused AppleTV would do nothing useful and would
              incorrectly mark it as ours to resume.
            if:
              - condition: template
                value_template: "{{ should_duck_living_room }}"
            then:
              - alias: Pause the AppleTV
                action: media_player.media_pause
                target:
                  entity_id: media_player.living_room_appletv
          - alias: Play the pre-generated announcement
            note: >-
              Starts immediately since the audio already exists -- no
              post-pause wait for generation.
            action: media_player.play_media
            target:
              entity_id: "{{ speaker_entities }}"
            data:
              media_content_id: "{{ tts_audio.url }}"
              media_content_type: music
              announce: true
          - alias: Wait for the announcement to actually finish before resuming
            note: >-
              Listing all four HomePods as literal state triggers
              (rather than templating speaker_entities[0], which HA
              can't auto-track and silently falls back to the timeout)
              fires the instant whichever speaker(s) this call
              actually targeted finish, since the untargeted ones were
              never playing and can't match a from: playing
              transition. The duration-based timeout is kept only as a
              backstop in case a state never settles.
            wait_for_trigger:
              - trigger: state
                alias: Kitchen HomePod finishes
                entity_id: media_player.kitchen_homepod
                from: playing
                to: idle
              - trigger: state
                alias: Master bedroom HomePod finishes
                entity_id: media_player.master_bedroom_homepod
                from: playing
                to: idle
              - trigger: state
                alias: Office HomePod finishes
                entity_id: media_player.office_homepod
                from: playing
                to: idle
              - trigger: state
                alias: Avery's room HomePod finishes
                entity_id: media_player.averys_room_homepod
                from: playing
                to: idle
            timeout: "{{ tts_audio.duration + 5 }}"
            continue_on_timeout: true
          - alias: Resume living room AppleTV if it was ducked for this announcement
            note: >-
              Gated on the same living_room_playing snapshot used to
              decide whether to duck in the first place.
            if:
              - condition: template
                value_template: "{{ should_duck_living_room }}"
            then:
              - alias: Resume the AppleTV
                action: media_player.media_play
                target:
                  entity_id: media_player.living_room_appletv
mode: queued
max: 10
