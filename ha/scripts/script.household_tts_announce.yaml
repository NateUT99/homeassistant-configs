alias: "Household: TTS Announce"
description: >-
  Shared entry point for every HomePod TTS announcement. Resolves the
  target room (or auto-picks kitchen/master bedroom based on
  everyone_sleeping), or fans out to kitchen, master bedroom, office, and
  Avery's room when target is broadcast. Office is dropped from a
  broadcast (and, if explicitly targeted, gets a push instead of TTS)
  whenever it's busy with a call -- sensor.nates_mac_mini_active_camera
  active or binary_sensor.nates_work_laptop_audio_input_in_use on, both
  devices sitting in the Office. Avery's room is dropped whenever
  input_boolean.avery_sleeping is on. Falls back to a push notification
  to Nate's iPhone when TTS can't land for a room: office busy, or that
  room's HomePod being unavailable. Pass critical_fallback to send that
  fallback push as an iOS critical alert.
fields:
  message:
    name: Message
    description: Text to speak. Templates are supported.
    required: true
    selector:
      text: {}
  target:
    name: Target
    description: >-
      Which HomePod to announce to, broadcast to fan out to kitchen,
      master bedroom, office (unless it's busy with a call), and Avery's
      room (unless she's asleep), or auto to pick kitchen/master bedroom
      based on sleep state.
    required: false
    default: auto
    selector:
      select:
        options: [kitchen, master_bedroom, office, averys_room, broadcast, auto]
  notification_title:
    name: Notification Title
    description: >-
      Title for the push notification sent when TTS falls back to a push
      (the office being busy with a call, or a target HomePod being
      offline).
    required: false
    default: Missed Announcement
    selector:
      text: {}
  critical_fallback:
    name: Critical Fallback
    description: >-
      When TTS cannot be delivered and the script falls back to a push,
      send it as an iOS critical alert (breaks through silent mode and
      Focus). Applies to both fallback paths. Default false.
    required: false
    default: false
    selector:
      boolean: {}
variables:
  resolved_target: >-
    {{ ('master_bedroom' if is_state('input_boolean.everyone_sleeping', 'on')
    else 'kitchen') if (target | default('auto')) == 'auto' else target }}
  notification_title_resolved: "{{ notification_title | default('Missed Announcement') }}"
  fallback_push_data: >-
    {{ {'push': {'interruption-level': 'critical', 'sound': {'name': 'default',
    'critical': 1, 'volume': 1}}} if (critical_fallback | default(false)) else {} }}
  office_busy: >-
    {{ not is_state('sensor.nates_mac_mini_active_camera', 'Inactive') or
    is_state('binary_sensor.nates_work_laptop_audio_input_in_use', 'on') }}
  broadcast_rooms: >-
    {{ ['kitchen', 'master_bedroom'] + ([] if office_busy else ['office']) +
    ([] if is_state('input_boolean.avery_sleeping', 'on') else ['averys_room']) }}
  target_rooms: >-
    {{ broadcast_rooms if (target | default('auto')) == 'broadcast' else [resolved_target] }}
sequence:
  - alias: Announce to each resolved room
    repeat:
      for_each: "{{ target_rooms }}"
      sequence:
        - alias: Resolve this room's speaker and volume
          variables:
            room: "{{ repeat.item }}"
            room_speaker: >-
              {{ {'kitchen': 'media_player.kitchen_homepod',
              'master_bedroom': 'media_player.master_bedroom_homepod',
              'office': 'media_player.office_homepod', 'averys_room':
              'media_player.averys_room_homepod'}.get(repeat.item, '') }}
            room_volume: >-
              {{ {'kitchen': 0.6, 'office': 0.5, 'averys_room': 0.4,
              'master_bedroom': (0.4 if
              is_state('input_boolean.everyone_sleeping', 'on') else
              0.5)}.get(repeat.item, 0.5) }}
        - choose:
            - alias: This room is the office and it's busy with a call
              note: >-
                Only reachable for an explicit target: office -- broadcast
                already drops office from target_rooms in this case, so
                this never fires mid-broadcast.
              conditions:
                - condition: template
                  value_template: "{{ room == 'office' and office_busy }}"
              sequence:
                - alias: Push fallback (office busy)
                  note: >-
                    TTS into the office would be picked up by the call's
                    mic, so push instead.
                  action: notify.mobile_app_nates_iphone
                  data:
                    title: "{{ notification_title_resolved }}"
                    message: "{{ message }}"
                    data: "{{ fallback_push_data }}"
            - alias: This room's speaker is offline
              conditions:
                - condition: template
                  value_template: >-
                    {{ room_speaker != '' and states(room_speaker) in
                    ['unavailable', 'unknown'] }}
              sequence:
                - alias: Push fallback (HomePod offline)
                  note: >-
                    chime_tts.say against an unavailable media_player fails
                    silently at any log level, so a dead target HomePod
                    drops the announcement with no trace. Detect it here
                    and push instead.
                  action: notify.mobile_app_nates_iphone
                  data:
                    title: "{{ notification_title_resolved }}"
                    message: "{{ message }}"
                    data: "{{ fallback_push_data }}"
            - alias: Unrecognized room -- stop
              note: >-
                Reachable only if `target` is called with a value outside
                the documented field selector options.
              conditions:
                - condition: template
                  value_template: "{{ room_speaker == '' }}"
              sequence:
                - stop: Unrecognized TTS target
          default:
            - alias: Speak via Chime TTS
              action: chime_tts.say
              target:
                entity_id: "{{ room_speaker }}"
              data:
                message: "{{ message }}"
                chime_path: soft
                tts_platform: cloud
                volume_level: "{{ room_volume }}"
                cache: true
                announce: true
mode: queued
max: 10
