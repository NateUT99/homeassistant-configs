alias: "Household: TTS Announce"
description: >-
  Shared entry point for every HomePod TTS announcement. Resolves the target
  room (or auto-picks based on everyone_sleeping) and speaks via Chime TTS.
  Falls back to a push notification to Nate's iPhone when TTS can't land — an
  active video call on the Mac Mini or work laptop, or the resolved HomePod
  being unavailable. Pass critical_fallback to send that fallback push as an
  iOS critical alert.
fields:
  message:
    name: Message
    description: Text to speak. Templates are supported.
    required: true
    selector:
      text: {}
  target:
    name: Target
    description: Which HomePod to announce to, or auto to pick based on sleep state.
    required: false
    default: auto
    selector:
      select:
        options:
          - kitchen
          - master_bedroom
          - office
          - averys_room
          - auto
  notification_title:
    name: Notification Title
    description: >-
      Title for the push notification sent when TTS falls back to a push
      (active video call, or the target HomePod is offline).
    required: false
    default: Missed Announcement
    selector:
      text: {}
  critical_fallback:
    name: Critical Fallback
    description: >-
      When TTS cannot be delivered and the script falls back to a push, send
      it as an iOS critical alert (breaks through silent mode and Focus).
      Applies to both fallback paths. Default false.
    required: false
    default: false
    selector:
      boolean: {}
variables:
  resolved_target: >-
    {{ ('master_bedroom' if is_state('input_boolean.everyone_sleeping', 'on')
    else 'kitchen') if (target | default('auto')) == 'auto' else target }}
  notification_title_resolved: "{{ notification_title | default('Missed Announcement') }}"
  target_speaker: >-
    {{ {'kitchen': 'media_player.kitchen_homepod',
    'master_bedroom': 'media_player.master_bedroom_homepod',
    'office': 'media_player.office_homepod',
    'averys_room': 'media_player.averys_room_homepod'}.get(resolved_target, '') }}
  fallback_push_data: >-
    {{ {'push': {'interruption-level': 'critical',
    'sound': {'name': 'default', 'critical': 1, 'volume': 1}}}
    if (critical_fallback | default(false)) else {} }}
sequence:
  - alias: "Route the announcement, or push instead when TTS cannot land"
    choose:
      - alias: "Video call active on Mac Mini or work laptop"
        conditions:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.nates_mac_mini_active_camera
                    state: Inactive
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.nates_work_laptop_active_camera
                    state: Inactive
        sequence:
          - alias: "Push fallback (video call active)"
            note: >-
              TTS would interrupt a work call, so suppress it and push
              instead. Checked first, ahead of the per-room routing, because
              the suppression applies no matter which speaker would have been
              used.
            action: notify.mobile_app_nates_iphone
            data:
              title: "{{ notification_title_resolved }}"
              message: "{{ message }}"
              data: "{{ fallback_push_data }}"
      - alias: "Resolved HomePod is offline"
        note: >-
          `entity_id` in a native state condition cannot be templated and the
          target speaker is resolved at runtime, so the availability check is
          a template. Consistent with the per-room routing conditions below.
        conditions:
          - "{{ target_speaker != '' and states(target_speaker) in ['unavailable', 'unknown'] }}"
        sequence:
          - alias: "Push fallback (HomePod offline)"
            note: >-
              chime_tts.say against an unavailable media_player fails silently
              at any log level, so a dead target HomePod drops the
              announcement with no trace. Detect it here and push instead.
            action: notify.mobile_app_nates_iphone
            data:
              title: "{{ notification_title_resolved }}"
              message: "{{ message }}"
              data: "{{ fallback_push_data }}"
      - alias: "Target: kitchen"
        conditions:
          - "{{ resolved_target == 'kitchen' }}"
        sequence:
          - alias: "Speak via Chime TTS (kitchen)"
            action: chime_tts.say
            target:
              entity_id: media_player.kitchen_homepod
            data:
              message: "{{ message }}"
              chime_path: soft
              tts_platform: cloud
              volume_level: 0.65
              cache: true
              announce: true
      - alias: "Target: master bedroom"
        conditions:
          - "{{ resolved_target == 'master_bedroom' }}"
        sequence:
          - alias: "Speak via Chime TTS (master bedroom)"
            action: chime_tts.say
            target:
              entity_id: media_player.master_bedroom_homepod
            data:
              message: "{{ message }}"
              chime_path: soft
              tts_platform: cloud
              volume_level: 0.5
              cache: true
              announce: true
      - alias: "Target: office"
        conditions:
          - "{{ resolved_target == 'office' }}"
        sequence:
          - alias: "Speak via Chime TTS (office)"
            action: chime_tts.say
            target:
              entity_id: media_player.office_homepod
            data:
              message: "{{ message }}"
              chime_path: soft
              tts_platform: cloud
              volume_level: 0.5
              cache: true
              announce: true
      - alias: "Target: Avery's room"
        conditions:
          - "{{ resolved_target == 'averys_room' }}"
        sequence:
          - alias: "Speak via Chime TTS (Avery's room)"
            action: chime_tts.say
            target:
              entity_id: media_player.averys_room_homepod
            data:
              message: "{{ message }}"
              chime_path: soft
              tts_platform: cloud
              volume_level: 0.4
              cache: true
              announce: true
    default:
      - alias: "Unknown target — stop"
        note: >-
          Reachable only if `target` is called with a value outside the
          documented field selector options.
        stop: Unrecognized TTS target
mode: queued
max: 10
