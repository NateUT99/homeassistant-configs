# Bubble Card module: segmented pill control.
# Deployed to /config/bubble_card/modules/segmented.yaml (standards/dashboards.md §13).
# Apply with `modules: [segmented]` on a `sub-buttons` card whose `entity` is the thing being
# chosen: a `select` (its state), a `vacuum` (its fan speed), or a `climate` entity (its preset).
# Each sub-button is one option, with `css_class: seg-<option>` and a tap action that selects it;
# the module draws the track and fills the pill whose class matches the current value. Bubble
# writes `_` in a css_class as `-`, so `seg-vac_and_mop` is matched as `seg-vac-and-mop`.
# Set `sub_button_type: default` on every option: a sub-button whose entity (its own or the
# card's) is a `select` otherwise renders as a dropdown.
segmented:
  name: Segmented control
  version: "1.1"
  creator: home-main
  description: Pill row for a select, vacuum fan speed, or climate preset; the current option is a solid pill.
  supported:
    - sub-buttons
  code: |
    {% set d = entity.split('.')[0] if entity else '' %}
    {% set v = (state_attr(entity, 'fan_speed') if d == 'vacuum'
       else (state_attr(entity, 'preset_mode') if d == 'climate' else states(entity))) | string | replace('_', '-') %}
    .bubble-sub-button-bottom-container {
      justify-content: stretch !important;
    }
    .bubble-sub-button-group {
      width: 100% !important;
      flex-wrap: nowrap !important;
      gap: 4px !important;
      padding: 4px !important;
      box-sizing: border-box !important;
      border-radius: 18px !important;
      background: color-mix(in srgb, var(--primary-text-color) 8%, transparent) !important;
    }
    .bubble-sub-button {
      flex: 1 1 0 !important;
      min-width: 0 !important;
      justify-content: center !important;
      gap: 4px !important;
      padding: 0 6px !important;
      border-radius: 14px !important;
      background: transparent !important;
      transition: background 0.2s ease;
      --mdc-icon-size: 18px;
    }
    .bubble-sub-button .bubble-sub-button-name-container,
    .bubble-sub-button .scrolling-container,
    .bubble-sub-button .scrolling-container span {
      font-size: 13px !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .bubble-sub-button ha-icon,
    .bubble-sub-button .bubble-sub-button-name-container {
      color: var(--secondary-text-color) !important;
    }
    /* Four or more options don't fit icon-beside-label on a phone: stack the icon above. */
    .bubble-sub-button-group:has(> .bubble-sub-button:nth-child(4)) .bubble-sub-button {
      flex-direction: column-reverse !important;
      gap: 2px !important;
      height: 52px !important;
    }
    .bubble-sub-button-group:has(> .bubble-sub-button:nth-child(4)) .bubble-sub-button-name-container {
      margin: 0 !important;
      max-width: 100% !important;
    }
    .seg-{{ v }} {
      background: var(--primary-text-color) !important;
    }
    .seg-{{ v }} ha-icon,
    .seg-{{ v }} .bubble-sub-button-name-container {
      color: var(--primary-background-color) !important;
      font-weight: 600 !important;
    }
