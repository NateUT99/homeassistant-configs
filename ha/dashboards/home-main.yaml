kiosk_mode:
  hide_header: true
navbar-templates:
  main:
    desktop:
      position: left
      show_labels: true
    mobile:
      show_labels: true
    routes:
    - url: /home-main/home
      icon: mdi:home-outline
      icon_selected: mdi:home
      label: Home
    - icon: mdi:view-grid-outline
      icon_selected: mdi:view-grid
      label: Rooms
      tap_action:
        action: navigate
        navigation_path: /home-main/home#rooms
    - url: /home-main/climate
      icon: mdi:thermometer
      label: Climate
    - url: /home-main/chores
      icon: mdi:clipboard-check-outline
      icon_selected: mdi:clipboard-check
      label: Chores
      badge:
        show: '[[[ return Object.keys(states).filter(k => k.startsWith(''sensor.household_chores_'') && k !== ''sensor.household_chores_take_out_trash'' && [''due'', ''overdue''].includes(states[k].state)).length
          > 0 ]]]'
        count: '[[[ const n = Object.keys(states).filter(k => k.startsWith(''sensor.household_chores_'') && k !== ''sensor.household_chores_take_out_trash'' && [''due'', ''overdue''].includes(states[k].state)).length;
          return n > 1 ? String(n) : null ]]]'
        color: red
    - icon: mdi:dots-horizontal
      label: More
      tap_action:
        action: open-popup
      badge:
        show: '[[[ return states[''binary_sensor.outside_home_generator_warning'']?.state === ''on'' || states[''binary_sensor.outside_home_generator_maintenance_alert'']?.state === ''on'' || Object.keys(states).some(k
          => k.startsWith(''update.'') && states[k].state === ''on'') ]]]'
        color: red
      popup:
      - url: /home-main/energy
        icon: mdi:lightning-bolt
        label: Energy
        badge:
          show: '[[[ return states[''binary_sensor.outside_home_generator_warning'']?.state === ''on'' || states[''binary_sensor.outside_home_generator_maintenance_alert'']?.state === ''on'' ]]]'
          color: red
      - url: /home-main/maintenance
        icon: mdi:wrench
        label: Maintenance
        hidden: '[[[ return !user.is_admin ]]]'
        badge:
          show: '[[[ return Object.keys(states).some(k => k.startsWith(''update.'') && states[k].state === ''on'') ]]]'
          color: red
views:
- title: Home
  path: home
  type: sections
  max_columns: 4
  theme: Frosted Glass
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:navbar-card
      template: main
    - type: custom:bubble-card
      card_type: sub-buttons
      hide_main_background: true
      rows: 0.9
      styles: '{% from ''dashboard.jinja'' import alert_level %}{% set lvl = alert_level() %}

        {% set unlocked = not is_state(''lock.entrance_front_door'',''locked'') %}{% set front_open = is_state(''binary_sensor.entrance_front_door'',''on'') %}{% set garage_open = not is_state(''cover.garage_door_opener_door'',''closed'')
        %}{% set secure = not (unlocked or front_open or garage_open) %}

        .doors ha-icon { color: var(--{{ ''green'' if secure else lvl }}-color) !important; }

        .openings ha-icon { color: var(--{{ lvl }}-color) !important; }

        .leak ha-icon, .internet ha-icon, .fridge ha-icon { color: var(--red-color) !important; }

        .hvac-paused ha-icon { color: var(--amber-color) !important; }

        .generator ha-icon { color: var(--amber-color) !important; }

        {% set aqi = states(''sensor.erie_ohio_usa_air_quality_index'') | int(0) %}

        .aqi ha-icon { color: var(--{{ ''green'' if aqi <= 50 else (''yellow'' if aqi <= 100 else (''orange'' if aqi <= 150 else ''red'')) }}-color) !important; }

        .thermo ha-icon { color: {{ ''var(--amber-color)'' if is_state(''binary_sensor.household_hvac_heating'',''on'') else (''var(--blue-color)'' if is_state(''binary_sensor.household_hvac_cooling'',''on'')
        else ''var(--secondary-text-color)'') }} !important; }

        .fireplace ha-icon { color: var(--amber-color) !important; }

        .vacuum ha-icon { color: {% if states(''sensor.living_room_vacuum_vacuum_error'') not in [''none'',''unknown'',''unavailable''] or states(''sensor.living_room_vacuum_dock_dock_error'') not in [''ok'',''unknown'',''unavailable'']
        or is_state(''binary_sensor.vacuum_stuck'',''on'') %}var(--red-color){% elif is_state(''input_boolean.vacuum_routine_pause'',''on'') or states(''vacuum.living_room_vacuum'') in [''cleaning'',''returning'',''paused'']
        %}var(--amber-color){% elif is_state(''input_boolean.vacuum_ran_daytime'',''on'') or is_state(''input_boolean.vacuum_ran_evening'',''on'') %}var(--green-color){% else %}var(--secondary-text-color){%
        endif %} !important; }

        .chores ha-icon { color: var(--{{ ''red'' if expand(integration_entities(''chore_calendar'') | select(''match'',''sensor\\.'') | list) | selectattr(''state'',''eq'',''overdue'') | list | count >
        0 else ''amber'' }}-color) !important; }

        .trash ha-icon { color: var(--{{ ''red'' if is_state(''sensor.household_chores_take_out_trash'',''overdue'') else ''amber'' }}-color) !important; }

        .washer ha-icon { color: var(--{{ ''red'' if is_state(''input_select.utility_room_washer_status'',''fault'') else (''green'' if is_state(''input_select.utility_room_washer_status'',''alerting'')
        else ''blue'') }}-color) !important; }

        .dryer ha-icon { color: var(--{{ ''red'' if is_state(''input_select.utility_room_dryer_status'',''fault'') else (''green'' if is_state(''input_select.utility_room_dryer_status'',''alerting'') else
        ''blue'') }}-color) !important; }

        .dishwasher ha-icon { color: var(--blue-color) !important; }

        {% set g = state_attr(''sensor.household_ai_house_summary'',''generated_at'') %}.ai ha-icon { color: {{ ''var(--amber-color)'' if is_state(''sensor.household_ai_house_summary'',''attention'') and
        g is not none and (now() - as_datetime(g)) < timedelta(hours=12) else ''var(--secondary-text-color)'' }} !important; }


        .bubble-sub-button-bottom-container { overflow-x: auto !important; overflow-y: hidden !important; justify-content: flex-start !important; pointer-events: auto !important; scrollbar-width: none;
        -webkit-overflow-scrolling: touch; }

        .bubble-sub-button-bottom-container::-webkit-scrollbar { display: none; }

        .bubble-sub-button-group { flex-wrap: nowrap !important; }

        .bubble-sub-button { flex-shrink: 0 !important; border-radius: 16px !important; padding: 0 12px !important; }

        {% from ''dashboard.jinja'' import weather_color, security_color, water_status, lights_on_count, media_playing_count %}

        .cat-weather ha-icon { color: {{ weather_color() }} !important; }

        .cat-lights ha-icon { color: {{ ''var(--amber-color)'' if lights_on_count() | int > 0 else ''var(--secondary-text-color)'' }} !important; }

        .cat-security ha-icon { color: {{ security_color() }} !important; }

        .cat-water ha-icon { color: {{ ''var(--green-color)'' if water_status() == ''No leaks'' else ''var(--red-color)'' }} !important; }

        .cat-media ha-icon { color: {{ ''var(--purple-color)'' if media_playing_count() | int > 0 else ''var(--secondary-text-color)'' }} !important; }'
      sub_button:
        main: []
        bottom:
        - name: Chips
          buttons_layout: inline
          justify_content: start
          group:
          - fill_width: false
            state_background: false
            light_background: false
            entity: binary_sensor.utility_room_firewalla_gold_se_wan_buckeye_broadband_status
            css_class: internet
            show_name: true
            icon: mdi:web-off
            name: '{{ ''Modem reset'' if is_state(''input_boolean.utility_room_cable_modem_power_cycle_active'',''on'') else ''Offline'' }}'
            visibility:
            - condition: or
              conditions:
              - condition: state
                entity: binary_sensor.utility_room_firewalla_gold_se_wan_buckeye_broadband_status
                state: 'off'
              - condition: state
                entity: input_boolean.utility_room_cable_modem_power_cycle_active
                state: 'on'
            custom_height: 40
          - fill_width: false
            state_background: false
            light_background: false
            entity: sensor.outside_home_generator_status
            css_class: generator
            show_name: true
            icon: mdi:home-lightning-bolt
            name: Generator
            visibility:
            - condition: state
              entity: sensor.outside_home_generator_status
              state: Running
            custom_height: 40
          - fill_width: false
            state_background: false
            light_background: false
            entity: sensor.kitchen_refrigerator_power
            css_class: fridge
            show_name: true
            icon: mdi:fridge-alert
            name: Fridge
            visibility:
            - condition: or
              conditions:
              - condition: state
                entity: switch.kitchen_refrigerator
                state: 'off'
              - condition: state
                entity: sensor.kitchen_refrigerator_power
                state: unavailable
            custom_height: 40
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            css_class: cat-water
            icon: '{% from ''dashboard.jinja'' import water_status %}{{ ''mdi:water-alert'' if water_status() != ''No leaks'' else ''mdi:water-check'' }}'
            name: '{% from ''dashboard.jinja'' import water_status %}{{ water_status() }}'
            tap_action:
              action: navigate
              navigation_path: '#security'
            hold_action:
              action: none
            visibility:
            - condition: template
              value_template: '{{ label_entities(''water_leak_sensor'') | select(''is_state'',''on'') | list | count > 0 }}'
          - fill_width: false
            state_background: false
            light_background: false
            entity: sensor.household_chores_take_out_trash
            css_class: trash
            show_name: true
            icon: mdi:recycle
            name: Recycling
            tap_action:
              action: navigate
              navigation_path: /home-main/chores
            visibility:
            - condition: state
              entity: sensor.household_chores_take_out_trash
              state:
              - due
              - overdue
            hold_action:
              action: perform-action
              perform_action: todo.update_item
              target:
                entity_id: todo.household_chores
              data:
                item: ab02f24c-f9f8-4def-9085-706634af2ef4
                status: completed
            custom_height: 40
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            css_class: cat-weather
            entity: weather.outside_waterville_oh_usa
            icon: '{% from ''dashboard.jinja'' import weather_icon %}{{ weather_icon() }}'
            name: '{% from ''dashboard.jinja'' import weather_status %}{{ weather_status() }}'
            tap_action:
              action: navigate
              navigation_path: '#weather'
            hold_action:
              action: none
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            css_class: cat-lights
            icon: mdi:lightbulb-group
            name: '{% from ''dashboard.jinja'' import lights_on_count %}{% set n = lights_on_count() | int %}{{ (n ~ '' on'') if n else ''All off'' }}'
            tap_action:
              action: navigate
              navigation_path: '#lights'
            hold_action:
              action: none
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            css_class: cat-security
            entity: lock.entrance_front_door
            icon: '{% from ''dashboard.jinja'' import security_icon %}{{ security_icon() }}'
            name: '{% from ''dashboard.jinja'' import security_status %}{{ security_status() }}'
            tap_action:
              action: navigate
              navigation_path: '#security'
            hold_action:
              action: perform-action
              perform_action: script.household_secure_doors
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            css_class: cat-media
            icon: mdi:speaker-multiple
            name: '{% from ''dashboard.jinja'' import media_playing_count %}{% set n = media_playing_count() | int %}{{ (n ~ '' on'') if n else ''Media off'' }}'
            tap_action:
              action: navigate
              navigation_path: '#media'
            hold_action:
              action: none
          - fill_width: false
            state_background: false
            light_background: false
            entity: sensor.household_ai_house_summary
            css_class: ai
            icon: mdi:creation
            tap_action:
              action: navigate
              navigation_path: '#ai'
            custom_height: 40
            show_name: true
            name: '{{ ''Check'' if is_state(''sensor.household_ai_house_summary'',''attention'') else ''All good'' }}'
    - type: custom:bubble-card
      card_type: sub-buttons
      hide_main_background: true
      rows: 0.9
      sub_button:
        main: []
        bottom:
        - name: Quick actions
          buttons_layout: inline
          justify_content: start
          group:
          - fill_width: false
            state_background: false
            light_background: false
            show_name: false
            custom_height: 40
            entity: climate.living_room_thermostat
            css_class: qa-climate
            icon: '{{ ''mdi:hvac-off'' if not is_state(''input_select.household_hvac_mode_before_pause'',''none'') else ''mdi:hvac'' }}'
            tap_action:
              action: navigate
              navigation_path: '#climate'
            hold_action:
              action: more-info
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            entity: input_boolean.everyone_sleeping
            name: Nate
            icon: '{{ ''mdi:sleep'' if is_state(''input_boolean.everyone_sleeping'',''on'') else (''mdi:home-account'' if is_state(''person.nate'',''home'') else ''mdi:account-arrow-right'') }}'
            css_class: qa-nate
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - fill_width: false
            state_background: false
            light_background: false
            show_name: true
            custom_height: 40
            entity: input_boolean.avery_sleeping
            name: Avery
            icon: '{{ ''mdi:sleep'' if is_state(''input_boolean.avery_sleeping'',''on'') else (''mdi:home-account'' if is_state(''binary_sensor.avery_home_today'',''on'') else ''mdi:account-arrow-right'')
              }}'
            css_class: qa-avery
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - fill_width: false
            state_background: false
            light_background: false
            show_name: false
            custom_height: 40
            entity: input_boolean.vacuum_routine_pause
            name: Pause
            icon: mdi:robot-vacuum-off
            css_class: qa-vacuum
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - fill_width: false
            state_background: false
            light_background: false
            show_name: false
            custom_height: 40
            entity: input_boolean.guest_mode
            name: Guest
            icon: mdi:account-star
            css_class: qa-guest
            tap_action:
              action: more-info
            hold_action:
              action: toggle
      styles: '.bubble-sub-button-bottom-container { overflow-x: auto !important; overflow-y: hidden !important; justify-content: flex-start !important; pointer-events: auto !important; scrollbar-width:
        none; -webkit-overflow-scrolling: touch; }

        .bubble-sub-button-bottom-container::-webkit-scrollbar { display: none; }

        .bubble-sub-button-group { flex-wrap: nowrap !important; margin: 0 auto !important; }

        .bubble-sub-button { flex-shrink: 0 !important; border-radius: 16px !important; padding: 0 12px !important; }


        .qa-vacuum ha-icon { color: {{ ''var(--amber-color)'' if is_state(''input_boolean.vacuum_routine_pause'',''on'') else ''var(--secondary-text-color)'' }} !important; }

        .qa-guest ha-icon { color: {{ ''var(--amber-color)'' if is_state(''input_boolean.guest_mode'',''on'') else ''var(--secondary-text-color)'' }} !important; }

        .qa-nate ha-icon { color: {{ ''var(--indigo-color)'' if is_state(''input_boolean.everyone_sleeping'',''on'') else (''var(--green-color)'' if is_state(''person.nate'',''home'') else ''var(--secondary-text-color)'')
        }} !important; }

        .qa-avery ha-icon { color: {{ ''var(--indigo-color)'' if is_state(''input_boolean.avery_sleeping'',''on'') else (''var(--green-color)'' if is_state(''binary_sensor.avery_home_today'',''on'') else
        ''var(--secondary-text-color)'') }} !important; }

        .qa-climate ha-icon { color: {{ ''var(--amber-color)'' if not is_state(''input_select.household_hvac_mode_before_pause'',''none'') or is_state(''binary_sensor.household_hvac_heating'',''on'') else
        (''var(--blue-color)'' if is_state(''binary_sensor.household_hvac_cooling'',''on'') else ''var(--secondary-text-color)'') }} !important; }'
    - type: markdown
      text_only: true
      grid_options:
        columns: 12
      content: '{% set h = now().hour %}## Good {{ ''morning'' if 5 <= h < 12 else (''afternoon'' if 12 <= h < 17 else ''evening'') }}, {{ user.split('' '')[0] }}!

        {% if has_value(''sensor.household_ai_briefing'') %}*{{ states(''sensor.household_ai_briefing'') }}*{% endif %}'
      uix:
        style:
          ha-markdown$: 'h2 { margin: 0 0 2px 0 !important; } p { margin: 0 !important; }'
          'ha-markdown $ ha-markdown-element:': 'h2 { margin: 0 0 2px 0 !important; } p { margin: 0 !important; }'
    - type: heading
      heading: Favorites
      heading_style: title
      grid_options:
        columns: 24
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        modules:
        - apple_tile
        rows: 1.2
        hold_action:
          action: more-info
        entity: climate.living_room_thermostat
        name: Thermostat
        icon: mdi:thermostat
        state_content: '{% set lo = state_attr(''climate.living_room_thermostat'',''target_temp_low'') %}{% set hi = state_attr(''climate.living_room_thermostat'',''target_temp_high'') %}{{ state_attr(''climate.living_room_thermostat'',''current_temperature'')
          | round(0) | int }}° · {% if not is_state(''input_select.household_hvac_mode_before_pause'',''none'') %}HVAC paused{% elif is_state(''climate.living_room_thermostat'',''off'') %}Off{% elif lo
          and hi %}{{ lo | int }}°–{{ hi | int }}°{% else %}{{ state_attr(''climate.living_room_thermostat'',''temperature'') | int(0) }}°{% endif %}'
        tap_action:
          action: navigate
          navigation_path: '#climate'
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#climate'
          hold_action:
            action: more-info
        styles: '{% if not is_state(''input_select.household_hvac_mode_before_pause'',''none'') %}.bubble-button-card-container { background: color-mix(in srgb, var(--amber-color) 22%, transparent) !important;
          box-shadow: 0 0 22px color-mix(in srgb, var(--amber-color) 25%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--amber-color) 50%, transparent) !important; }

          .bubble-icon-container { background: var(--amber-color) !important; }

          .bubble-icon { color: var(--primary-background-color) !important; }{% endif %}'
      - type: custom:bubble-card
        card_type: button
        button_type: state
        modules:
        - apple_tile
        rows: 1.2
        hold_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.vacuum_routine_pause
        entity: vacuum.living_room_vacuum
        name: Roborock
        icon: mdi:robot-vacuum
        state_content: '{% set s = states(''vacuum.living_room_vacuum'') %}{% set err = states(''sensor.living_room_vacuum_vacuum_error'') %}{% set dock = states(''sensor.living_room_vacuum_dock_dock_error'')
          %}{% if err not in [''none'',''unknown'',''unavailable''] %}{{ err | replace(''_'', '' '') | capitalize }}{% elif dock not in [''ok'',''unknown'',''unavailable''] %}Dock: {{ dock | replace(''_'',
          '' '') }}{% elif is_state(''binary_sensor.vacuum_stuck'',''on'') %}Stuck{% else %}{{ s | replace(''_'', '' '') | capitalize }}{% endif %}'
        tap_action:
          action: navigate
          navigation_path: '#vacuum'
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#vacuum'
          hold_action:
            action: perform-action
            perform_action: input_boolean.toggle
            target:
              entity_id: input_boolean.vacuum_routine_pause
        visibility:
        - condition: state
          entity: input_boolean.vacuum_routine_pause
          state: 'off'
      - type: custom:bubble-card
        card_type: button
        button_type: state
        modules:
        - apple_tile
        rows: 1.2
        hold_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.vacuum_routine_pause
        entity: input_boolean.vacuum_routine_pause
        name: Roborock
        icon: mdi:robot-vacuum-off
        state_content: '{% set s = states(''vacuum.living_room_vacuum'') %}{% set err = states(''sensor.living_room_vacuum_vacuum_error'') %}{% set dock = states(''sensor.living_room_vacuum_dock_dock_error'')
          %}{% if err not in [''none'',''unknown'',''unavailable''] %}{{ err | replace(''_'', '' '') | capitalize }}{% elif dock not in [''ok'',''unknown'',''unavailable''] %}Dock: {{ dock | replace(''_'',
          '' '') }}{% elif is_state(''binary_sensor.vacuum_stuck'',''on'') %}Stuck{% else %}{{ s | replace(''_'', '' '') | capitalize }}{% endif %}'
        tap_action:
          action: navigate
          navigation_path: '#vacuum'
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#vacuum'
          hold_action:
            action: perform-action
            perform_action: input_boolean.toggle
            target:
              entity_id: input_boolean.vacuum_routine_pause
        visibility:
        - condition: state
          entity: input_boolean.vacuum_routine_pause
          state: 'on'
      grid_options:
        columns: 24
    - type: heading
      heading: Happening now
      heading_style: title
      grid_options:
        columns: 24
      visibility:
      - condition: or
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: input_select.utility_room_washer_status
            state:
            - alerting
            - fault
          - condition: state
            entity: sensor.utility_room_washer_current_status
            state_not:
            - power_off
            - initial
            - unavailable
            - unknown
        - condition: or
          conditions:
          - condition: state
            entity: input_select.utility_room_dryer_status
            state:
            - alerting
            - fault
          - condition: state
            entity: sensor.utility_room_dryer_current_status
            state_not:
            - power_off
            - initial
            - unavailable
            - unknown
        - condition: state
          entity: binary_sensor.kitchen_dishwasher_running
          state: 'on'
        - condition: state
          entity: vacuum.living_room_vacuum
          state:
          - cleaning
          - returning
          - paused
          - error
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        rows: 1.4
        hold_action:
          action: more-info
        entity: input_select.utility_room_washer_status
        name: Washer
        icon: mdi:washing-machine
        state_content: '{% set st = states(''input_select.utility_room_washer_status'') %}{{ ''Done · unload'' if st == ''alerting'' else (''Fault'' if st == ''fault'' else (states(''sensor.utility_room_washer_minutes_remaining'')
          | int(0) ~ '' min left'')) }}'
