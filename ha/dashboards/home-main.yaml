      grid_options:
        columns: 12
      cards:
      - type: grid
        columns: 1
        square: false
        cards:
        - type: custom:battery-state-card
          sort: state
          filter:
            include:
            - name: attributes.device_class
              value: battery
            exclude:
            - name: entity_id
              value: sensor.nates_*
          bulk_rename:
          - from: ' Battery'
            to: ''
          colors:
            steps:
            - value: 20
              color: var(--red-color)
            - value: 30
              color: var(--amber-color)
            - value: 100
              color: var(--green-color)
          collapse:
          - name: '{count} others OK'
            secondary_info: Lowest {min}%
            icon: mdi:battery-check
            icon_color: var(--green-color)
            min: 30
      title-card:
        type: heading
        heading: Batteries
        icon: mdi:battery
      title-card-clickable: true
