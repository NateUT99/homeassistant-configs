      clear: true
      padding: '0'
      child-margin-top: 0.6em
      grid_options:
        columns: 12
      cards:
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.living_room_vacuum_filter_clean_time_left
          name: Filter clean
          icon: mdi:air-filter
          modules:
          - consumable_status
          tap_action:
            action: more-info
          hold_action:
            action: perform-action
            perform_action: script.household_vacuum_reset_consumable
            data:
              consumable: filter_clean
          button_action:
            tap_action:
              action: more-info
            hold_action:
              action: perform-action
              perform_action: script.household_vacuum_reset_consumable
              data:
                consumable: filter_clean
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.living_room_vacuum_filter_time_left
          name: Filter replace
          icon: mdi:air-filter
          modules:
